<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Firmar el mandato de domiciliación</title>
    <style>
      :root { --tinta: #172443; --suave: #5B6476; --linea: #D9DEE7; --azul: #1F5FD1; --verde: #166B3A; --rojo: #B42318; --fondo: #F5F7FA; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--fondo); color: var(--tinta); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .sub { color: var(--suave); margin: 0 0 20px; }
      .caja { background: #fff; border: 1px solid var(--linea); border-radius: 12px; padding: 18px; margin: 0 0 16px; }
      .caja h2 { font-size: 15px; margin: 0 0 10px; }
      dl { display: grid; grid-template-columns: 170px 1fr; gap: 6px 12px; margin: 0; }
      dt { color: var(--suave); } dd { margin: 0; overflow-wrap: anywhere; }
      .texto { font-size: 14px; color: var(--suave); }
      label { display: block; font-weight: 600; margin: 12px 0 4px; }
      input[type=text] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--linea); border-radius: 8px; }
      .marca { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin-top: 16px; }
      .marca input { width: 20px; height: 20px; margin-top: 2px; }
      button { width: 100%; margin-top: 18px; padding: 14px; font-size: 16px; font-weight: 600; color: #fff; background: var(--azul); border: 0; border-radius: 10px; cursor: pointer; }
      button:disabled { opacity: .55; cursor: default; }
      .aviso { padding: 12px 14px; border-radius: 10px; margin: 0 0 16px; }
      .aviso[data-tono=bien] { background: #E7F5EC; color: var(--verde); }
      .aviso[data-tono=mal] { background: #FDECEA; color: var(--rojo); }
      .ayuda { font-size: 13px; color: var(--suave); margin-top: 4px; }
      @media (max-width: 480px) { dl { grid-template-columns: 1fr; } dt { margin-top: 6px; } }
      @media print { body { background: #fff; } button, .no-imprimir { display: none; } .caja { border: 0; padding: 0; } }
    </style>
  </head>
  <body>
    <main id="mandato" aria-live="polite"><p class="sub">Cargando el mandato…</p></main>
    <script type="module" src="/src/publicas/mandato.ts"></script>
  </body>
</html>
