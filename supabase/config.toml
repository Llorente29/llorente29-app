# Folvy V1 - Supabase local config
project_id = "xzmpnchlguibclvxyynt"

# ############################################################################
# #  AVISO — NO DESPLIEGUES A MANO SIN LEER ESTO                             #
# ############################################################################
#
# Este fichero declara DOS funciones. En produccion hay 63, y 43 de ellas
# corren con verify_jwt = FALSE (medido el 01/09/2026): todos los webhooks
# (Stripe, HubRise, Last.app, Otter, Catcher), catcher-dispatch, system-alert,
# availability-watchdog, edge-drift-watchdog, order-advance...
#
# El CLI, para una funcion que NO esta declarada aqui, aplica su defecto:
# verify_jwt = true. Asi que:
#
#     supabase functions deploy availability-watchdog
#
# le ACTIVARIA la verificacion de JWT y dejaria fuera a pg_cron. En silencio,
# y con cara de despliegue correcto. Lo mismo con cualquiera de las otras 42.
#
# COMO SE DESPLIEGA BIEN
#   · Lo normal: no se despliega a mano. Un push a main que toque
#     supabase/functions/** dispara .github/workflows/deploy-edge-functions.yml,
#     que PREGUNTA a la Management API el verify_jwt vivo de cada funcion y la
#     vuelve a desplegar igual. No adivina.
#   · Si aun asi hay que hacerlo a mano, mira primero como esta viviendo:
#       curl -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" #         https://api.supabase.com/v1/projects/xzmpnchlguibclvxyynt/functions #         | jq -r '.[] | "\(.slug)\t\(.verify_jwt)"'
#     y anade --no-verify-jwt si esa funcion lo tiene en false.
#
# Y hubrise-webhook NO se despliega, ni a mano ni automaticamente, salvo
# decision explicita: es el camino vivo de los pedidos de Alcala.
#
# DEUDA: completar este fichero con las 63 y su verify_jwt real, y entonces el
# workflow podra dejar de preguntar. No se ha hecho hoy a proposito: transcribir
# 63 valores a mano puede meter uno mal, y un valor DECLARADO mal es peor que
# ausente — el CLI lo aplicaria con toda confianza. Cuando se haga, que se
# genere desde la Management API, no a mano.
# ############################################################################

[functions.check-account-status]
verify_jwt = true

[functions.create-account]
verify_jwt = true

# (02/09) menu-photos-repatriate. Su frontera es el JWT de un admin de la
# cuenta, no un secreto compartido: verify_jwt = true, que es lo contrario que
# los webhooks y los pg_cron de este mismo fichero.
#
# Se declara porque la guarda del workflow abortó el despliegue del 07:54: una
# función NUEVA sin [functions.X] no se despliega, y hace bien — adivinar el
# verify_jwt de una función nueva es como se abre un webhook al mundo o se
# cierra uno que tenía que estar abierto. La guarda no falló: avisó.
[functions.menu-photos-repatriate]
verify_jwt = true

# (04/09) label-scan · C9 Lote 1. El destino del QR de las etiquetas.
# verify_jwt = FALSE, y es deliberado: quien abre esta URL es el movil de un
# cliente en su casa, escaneando la pegatina de su bolsa. No tiene sesion ni
# puede tenerla. Su frontera no es un JWT ni un secreto: es que NO HACE NADA
# sensible — registra un escaneo y devuelve un 302 a la tienda de la marca. Un
# token desconocido redirige igual y no escribe.
[functions.label-scan]
verify_jwt = false

# (04/09) order-evidence-capture · C9 Lote 2. Recibe la foto del pase.
# verify_jwt = FALSE, y es deliberado igual que en label-scan y order-advance:
# quien llama es la TABLET del pase, que se identifica con su `device_token`
# contra `kds_resolve_device` -- no tiene sesion de usuario ni puede tenerla.
# La frontera no es un JWT: es que el token resuelva a un dispositivo vivo Y que
# el pedido sea de ESA cuenta y ESE local (regla 9). Sin las dos cosas, 401/403.
[functions.order-evidence-capture]
verify_jwt = false

# (04/09) order-evidence-purge · C9 Lote 2 §5. Borra las fotos que cumplen plazo.
# verify_jwt = FALSE porque quien llama es pg_cron, que no tiene JWT. Su frontera
# es el `x-cron-secret` de Vault, el mismo patron que edge-drift-watchdog.
[functions.order-evidence-purge]
verify_jwt = false

# (04/09) social-agent · LA QUE ESTUVO DOS DIAS CAIDA SIN QUE NADIE SE ENTERARA.
#
# verify_jwt = FALSE. Quien la llama es el cron `social-agent-daily` (0 10 * * *),
# que manda `Content-Type` y `x-agent-secret` y NO manda `Authorization`. Con la
# puerta del gateway encendida, todas sus llamadas morian en 401 ANTES de entrar
# en el codigo de la funcion. Su autenticacion real es el `x-agent-secret`, que
# devuelve 403 -- por eso un 401 delataba que ni siquiera llegaba a ejecutarse.
#
# COMO SE ROMPIO: el 02/09 a las 16:59 UTC alguien la desplego POR MCP (su
# entrypoint_path era `/tmp/user_fn_...`, no `/home/runner/...`). Un despliegue
# por MCP NO arrastra este fichero, asi que el flag volvio a su defecto, que es
# `true`. Es el mismo despliegue que disparo la deriva de bytes del vigia.
# Ultima fila de `social_post`: 02/09 12:00. Encaja al minuto.
#
# Y POR ESO SE DECLARA AQUI aunque «ya funcionaba»: lo que no esta declarado
# queda a merced del defecto la proxima vez que alguien despliegue por fuera del
# CI. Declararla es lo que convierte este fichero en la intencion, y no en una
# copia de lo que hubiera un martes.
[functions.social-agent]
verify_jwt = false

# La renovadora de la llave de Instagram (14/09). La llama pg_cron con
# `x-agent-secret`, igual que a `social-agent` y `social-publish`, asi que su
# frontera es ese secreto y no un JWT. Se declara ANTES de existir en
# produccion, porque el CI se planta con una funcion nueva sin declarar — y
# hace bien: adivinar el verify_jwt de una funcion nueva es como se abre al
# mundo algo que toca el Vault.
[functions.social-token-refresh]
verify_jwt = false

