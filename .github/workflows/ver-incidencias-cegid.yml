name: Ver incidencias en Cegid (solo lectura)

# Q10 · respuesta 5 (26/11) · Lee de la facturación de Cegid (API DiezREC) unas incidencias tal cual, con todos sus
# campos, y la ficha de su cliente sin lo personal: para saber qué campos de la API son la «Descripción», el «Tipo de
# IVA» y el total que Julio corrigió a mano en la del cliente 9, y si los conceptos fijos dicen «Facturar hasta».
# Llama a conta-cegid-ver con la clave de servicio (entorno «despliegue»: solo se lanza desde main). No escribe nada
# ni en Cegid ni en Sumied. El resumen es público: la función no devuelve ni nombres, ni NIF, ni correos (ver.ts).

on:
  workflow_dispatch:
    inputs:
      empresa:
        description: 'Sociedad (company_id). Por defecto, la de QBO.'
        required: true
        default: '58e574ec-012a-4483-9f5b-3501cc023ba4'
      pares:
        description: 'Cliente/incidencia, como mucho 5, separados por espacios: «9/2 10/1»'
        required: true
        default: '9/2'

concurrency:
  group: ver-incidencias-cegid
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ver:
    environment: despliegue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Proyecto y clave (enmascarada)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF=$(grep -E '^\s*project_id\s*=' supabase/config.toml | head -1 | sed -E 's/.*=\s*"?([a-z0-9]+)"?.*/\1/')
          [ -n "$REF" ] || { echo "::error::No se pudo leer project_id de supabase/config.toml."; exit 1; }
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" > /tmp/claves.json
          KEY=$(jq -r '[.[] | select(.type == "secret" and (.api_key // "" | startswith("sb_secret_")))] | (map(select(.name == "default")) + .) | .[0].api_key // empty' /tmp/claves.json)
          [ -n "$KEY" ] || KEY=$(jq -r '[.[] | select(.name == "service_role")] | .[0].api_key // empty' /tmp/claves.json)
          rm -f /tmp/claves.json
          [ -n "$KEY" ] && [ "$KEY" != "null" ] || { echo "::error::No se pudo obtener la clave de servicio."; exit 1; }
          echo "::add-mask::$KEY"
          case "$KEY" in sb_secret_*) echo "FORMATO=nueva" >> "$GITHUB_ENV" ;;
                         eyJ*) echo "FORMATO=antigua" >> "$GITHUB_ENV" ;;
                         *) echo "::error::La clave de servicio no tiene un formato conocido."; exit 1 ;; esac
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "KEY=$KEY" >> "$GITHUB_ENV"

      - name: Leer (solo lee de Cegid; no escribe nada)
        env:
          EMPRESA: ${{ inputs.empresa }}
          PARES: ${{ inputs.pares }}
        run: |
          set -euo pipefail
          [[ "$EMPRESA" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::La sociedad no es un uuid."; exit 1; }
          [[ "$PARES" =~ ^[0-9/\ ]+$ ]] || { echo "::error::Los pares van como «9/2 10/1»."; exit 1; }
          jq -n --arg c "$EMPRESA" --arg p "$PARES" '{company_id: $c, pares: $p}' > /tmp/cuerpo.json
          if [ "$FORMATO" = "nueva" ]; then CABECERA="apikey: $KEY"; else CABECERA="Authorization: Bearer $KEY"; fi
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "https://$REF.supabase.co/functions/v1/conta-cegid-ver" \
                 -H "$CABECERA" -H "x-internal-key: $KEY" -H 'Content-Type: application/json' --data @/tmp/cuerpo.json)
          if [ "$code" != "200" ]; then
            echo "::error::La función ha contestado $code: $(jq -r '.error // "sin mensaje"' /tmp/r.json 2>/dev/null || echo 'sin mensaje')"
            exit 1
          fi
          {
            echo "## Incidencias en Cegid, tal cual (solo lectura)"
            echo
            echo "$(jq -r '.frase' /tmp/r.json)"
            jq -r '.incidencias[] | "\n### Incidencia \(.cliente)/\(.incidencia) · HTTP \(.status)\n\n| Campo | Valor |\n|---|---|\n" + ((.campos // {}) | to_entries | map("| `\(.key)` | `\(.value | tojson)` |") | join("\n"))' /tmp/r.json
            jq -r '.fichas | to_entries[] | "\n### Ficha del cliente \(.key) · HTTP \(.value.status)\n\nCampos: " + ((.value.campos // []) | map("`\(.)`") | join(", ")) + "\n\nConceptos fijos:\n\n" + ((.value.conceptos // []) | map(tojson | "- `\(.)`") | join("\n"))' /tmp/r.json
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
