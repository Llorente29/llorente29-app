name: Unitarias por producto

# QUÉ HACE (N1, cola de noche del 23/10, paso 1 de la auditoría C09)
# Corre las unitarias (vitest) en cada PR a main, solo las del producto que
# toca: las de Sumied si cambia Sumied, las de Folvy si cambia Folvy, y las dos
# si toca lo común o algo que no es claramente de ninguno. El reparto lo decide
# scripts/pruebas/unitarias.mjs (con sus pruebas en
# tests/unit/scripts/unitarias.test.ts), contra los ficheros del PR.
# Hasta hoy solo corrían en local (antes-de-subir.sh, paso 3), y allí siguen
# corriendo enteras: esto es la red de la CI.
# Solo lee: no tiene secretos ni permisos de escritura.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: unitarias-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unitarias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Hace falta el historial: las unitarias que tocan salen del diff
          # base...head (desde el ancestro común con main).
          # W09c (28/10): todo el historial de commits y árboles, sin el contenido
          # viejo (las capturas PNG del historial pesan más de 1,3 GB). Lo que un
          # paso lea de un commit viejo (git show) lo baja git al momento.
          fetch-depth: 0
          filter: blob:none
          # W09d (28/10): sin las imágenes de las capturas de hoy (docs/**/capturas,
          # PNG y JPG: 172 de los 295 MB del árbol). Ningún paso las lee: las
          # capturas se revisan por el diff (capturas.mjs revisar), no en disco.
          # Lo demás de esas carpetas (.md, .json) sí se baja.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/**/capturas/**/*.png
            !/docs/**/capturas/**/*.jpg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Qué unitarias tocan
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE...$HEAD" > /tmp/cambiados.txt
          echo "Ficheros cambiados: $(wc -l < /tmp/cambiados.txt)"
          node scripts/pruebas/unitarias.mjs /tmp/cambiados.txt /tmp/pruebas.txt | tee /tmp/plan.txt >> "$GITHUB_OUTPUT"
          cat /tmp/plan.txt
          {
            echo "### Unitarias"
            echo
            echo "- $(grep '^n=' /tmp/plan.txt | cut -d= -f2-) pruebas"
            echo "- Por qué: $(grep '^porque=' /tmp/plan.txt | cut -d= -f2-)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Dependencias
        if: steps.plan.outputs.ninguna != 'true'
        run: npm ci --ignore-scripts
      # V03 (26/10): las de Verifactu validan el mensaje contra los XSD oficiales de
      # la AEAT con xmllint, y sin él fallan a propósito (no se saltan). El runner
      # no lo trae: libxml2-utils.
      - name: xmllint (las de Verifactu validan contra los XSD de la AEAT)
        if: steps.plan.outputs.ninguna != 'true'
        run: command -v xmllint || { sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils; } && xmllint --version 2>&1 | head -1
      # Las pruebas de captura (cocina, inventario, tablet) leen dist/assets:
      # en local existe de builds anteriores; aquí hay que construirlo antes.
      - name: Build (lo leen las pruebas de captura)
        if: steps.plan.outputs.ninguna != 'true'
        run: npm run build
      - name: Unitarias
        if: steps.plan.outputs.ninguna != 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.plan.outputs.todas }}" = "true" ]; then
            npx vitest run
          else
            # Las de su producto, una a una: la lista la escribe unitarias.mjs.
            xargs -a /tmp/pruebas.txt npx vitest run
          fi
      - name: Sin unitarias que correr
        if: steps.plan.outputs.ninguna == 'true'
        run: echo "El PR no toca nada que lean las unitarias." | tee -a "$GITHUB_STEP_SUMMARY"
