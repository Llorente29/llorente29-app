name: PR a main · funciones y título

# QUÉ HACE (C06b, respuesta 5, punto 5 · 14/10)
# La #181 se fusionó con «[skip ci]» en el mensaje: el push a main no lanzó
# deploy-edge-functions y las funciones de la C06 se quedaron sin desplegar.
# Dos reglas de Julio, comprobadas aquí en vez de confiadas a la memoria:
#   1. el título de un PR a main nunca lleva una marca de saltar CI;
#   2. la descripción dice, en «## Funciones a desplegar a mano», las funciones
#      que toca el PR (las carpetas cambiadas y las que importan algo de
#      _shared que cambie), o «ninguna».
#   3. (N2, 23/10) la descripción dice a qué producto va, en «## Producto»:
#      Sumied, Folvy o Común (_shared es común), contra el diff; y si agrupa
#      las funciones en «### Sumied» / «### Folvy», cada una en el suyo.
#   4. (W12, 29/10) merge, nunca rebase: un push al PR no reescribe su historia
#      (regla 5 de CLAUDE.md, scripts/ci/sin-rebase.mjs).
#   5. (W12, 29/10) ningún DNI, NIE, NAF ni IBAN que parezca real en lo que
#      añade el PR, sus commits o su descripción (regla T11,
#      scripts/ci/datos-personales.mjs).
# Lo que no puede ver: el mensaje que se escribe AL FUSIONAR. Ese lo vigila
# quien fusiona (CLAUDE.md), y si se cuela, deploy-edge-functions no corre:
# se despliega a mano con su `funciones`.
# Solo lee: no tiene secretos ni permisos de escritura.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

env:
  # W09: psql y pg_dump dejan de esperar a conectar a los 15 s (el #728 esperó casi una hora).
  PGCONNECT_TIMEOUT: '15'

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Hace falta el historial: el diff del PR es base...head (desde el
          # ancestro común con main), y una rama puede venir de muy atrás.
          # W09c (28/10): todo el historial de commits y árboles, sin el contenido
          # viejo (las capturas PNG del historial pesan más de 1,3 GB). Lo que un
          # paso lea de un commit viejo (git show) lo baja git al momento.
          fetch-depth: 0
          filter: blob:none
          # W09d (28/10): sin las imágenes de las capturas de hoy (docs/**/capturas,
          # PNG y JPG: 172 de los 295 MB del árbol). Ningún paso las lee: las
          # capturas se revisan por el diff (capturas.mjs revisar), no en disco.
          # Lo demás de esas carpetas (.md, .json) sí se baja.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/**/capturas/**/*.png
            !/docs/**/capturas/**/*.jpg
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Título, producto y funciones a desplegar a mano
        env:
          PR_TITULO: ${{ github.event.pull_request.title }}
          PR_CUERPO: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr/revisar-pr.mjs "$BASE" "$HEAD"
      # PC01 (26/10): ninguna migración nueva o cambiada trae un DELETE o un
      # UPDATE sin WHERE. La app pasa por safeupdate (rol authenticator) y los
      # para, también dentro de una función o de un disparador; las pruebas de
      # staging corren como postgres y no lo ven. Se salta solo con
      # «-- sin where: <por qué>» en la línea o en la de encima.
      - name: Ningún DELETE ni UPDATE sin WHERE (PC01)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/conta/sql-sin-where.mjs "$BASE" "$HEAD"

      # W06 (26/10): una cuenta de tanda («cuenta:») no mide algo que crece
      # solo. El ensayo de producción cuenta antes y después de deshacer, con
      # minutos en medio y el negocio abierto: el #241 se paró porque contaba
      # «asientos (base entera)» y entró un asiento de banco. Cada medida que
      # lee una tabla de datos lleva un corte de fecha fijo o «-- quieta: <por
      # qué>». Solo las cuentas que el PR añade o cambia.
      - name: Las cuentas de la tanda no miden algo que crece solo (W06)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/conta/produccion/cuenta-crece.mjs revisar "$BASE" "$HEAD"

      # F01, respuesta 4 (27/10): lo que el PR añade al manifiesto de staging
      # lo admite el workflow que lo aplica. El #358 llegó a main con una
      # semilla en seeds/folvy, que aplicar-staging-conta.yml no admitía: el
      # run de main tras la fusión (#677) cayó entero y staging se quedó sin
      # el F01. La regla es la misma en los dos (staging-tanda.mjs RUTA_STAGING).
      - name: El manifiesto de staging solo nombra rutas que el workflow admite
        timeout-minutes: 5
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node scripts/conta/staging-tanda.mjs nuevas "$BASE" > /tmp/staging-nuevas.txt
          echo "Líneas nuevas en el manifiesto de staging: $(wc -l < /tmp/staging-nuevas.txt)."
          if [ -s /tmp/staging-nuevas.txt ]; then node scripts/conta/staging-tanda.mjs rutas $(cat /tmp/staging-nuevas.txt); fi

      # C10 (23/10): el nombre de cada migración nueva, en su formato y sin
      # repetir en main ni en los demás PR abiertos.
      - name: Cada PR edita solo su tanda (C10)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RAMA: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=d "$BASE...$HEAD" > /tmp/cambiados.txt
          node scripts/conta/produccion/tanda.mjs ajenos "$RAMA" /tmp/cambiados.txt

      # W08 (28/10): nunca un PNG distinto de main que no sea del frente de la
      # rama. El bot de capturas fijó PNG de inventario en tres PR de Laboral
      # (#350, #354 y #370) y chocaron con main. Corre también sobre el commit
      # del bot (su head), y nombra cada fichero.
      - name: Las capturas, solo las del frente de la rama (W08)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RAMA: ${{ github.event.pull_request.head.ref }}
        run: node scripts/conta/capturas.mjs revisar "$RAMA" "$BASE" "$HEAD"

      - name: Nombres de las migraciones nuevas
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ESTE: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=A "$BASE...$HEAD" -- supabase/migrations > /tmp/nuevas.txt || true
          git ls-tree --name-only "$BASE" -- supabase/migrations/ > /tmp/main.txt
          : > /tmp/prs.txt
          for n in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --limit 100 --json number -q '.[].number'); do
            [ "$n" = "$ESTE" ] && continue
            gh api "repos/$GITHUB_REPOSITORY/pulls/$n/files?per_page=100" --paginate -q '.[] | select(.status == "added") | .filename' | grep '^supabase/migrations/' >> /tmp/prs.txt || true
          done
          echo "Migraciones nuevas en este PR: $(wc -l < /tmp/nuevas.txt) · en main: $(wc -l < /tmp/main.txt) · en otros PR abiertos: $(wc -l < /tmp/prs.txt)."
          node scripts/conta/produccion/nombres.mjs revisar /tmp/nuevas.txt /tmp/main.txt /tmp/prs.txt

      # W12 · Regla T8 (29/10): merge, nunca rebase. En cada push al PR, el commit
      # de antes tiene que seguir en la historia del nuevo.
      - name: La rama no reescribe su historia (merge, nunca rebase)
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.event.after }}
        run: node scripts/ci/sin-rebase.mjs "$ANTES" "$DESPUES"

      # W12 · Regla T11 (29/10): el repositorio es público. Ningún dato personal
      # real (DNI, NIE, NAF, IBAN, con su control) en lo que añade el PR.
      - name: Ningún dato personal real (DNI, NIE, NAF, IBAN)
        env:
          PR_CUERPO: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/datos-personales.mjs "$BASE" "$HEAD"
