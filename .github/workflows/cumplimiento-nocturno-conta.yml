name: Cumplimiento nocturno de contabilidad

# QUÉ HACE (C00 §9.2)
# Los agentes de cumplimiento del módulo de contabilidad, cada noche:
#
#   · «Datos maestros e impuestos»: recorre las filas de serie de staging-conta
#     (scripts/conta/agente-datos-maestros.sql, SOLO LEE) y comprueba que cada
#     una lleva su norma y su fecha de comprobación, que no hay dos vigentes a
#     la vez para el mismo concepto y que los valores son los de
#     docs/conta/referencia/serie.json (sacada de las fuentes oficiales).
#   · «Normativa al día»: vuelve a descargar las fuentes oficiales citadas y
#     las compara con la última descarga (scripts/conta/fuentes.mjs comparar).
#   · «Plan contable» (C02): vuelve a bajar el PGC del BOE y comprueba que la
#     serie (cuadro + correcciones citadas) sigue saliendo limpia —si el BOE
#     corrige una errata, la corrección sobra y lo dice— y que pgc_account de
#     staging-conta es exactamente supabase/conta/pgc/serie.json.
#
# Ninguno cambia nada. Dejan su informe en lenguaje normal en el resumen de la
# ejecución y, si algo no cuadra en una ejecución nocturna o lanzada a mano,
# abren un aviso (una incidencia en GitHub; si ya hay una abierta del mismo
# agente, le añaden un comentario en vez de abrir otra).
#
# CUÁNDO
#   · Cada noche a las 03:40 de Madrid, en verano y en invierno. GitHub solo
#     entiende UTC, así que hay dos disparos (01:40 y 02:40 UTC) y el trabajo
#     «hora» deja correr solo el que en Madrid son las 03:40: el de las 01:40
#     con el horario de verano (+02:00) y el de las 02:40 con el de invierno
#     (+01:00). Se mira el disparo que llegó (github.event.schedule), no la
#     hora del reloj: un disparo que GitHub retrase veinte minutos sigue
#     contando como suyo. Lo programado solo corre desde la rama principal.
#   · A mano (workflow_dispatch).
#   · Con un push a conta/** que cambie los propios agentes: así se ve el
#     primer informe desde la rama. En ese caso NO abre avisos: solo informa.
#
# LO QUE NO PUEDE HACER: TOCAR PRODUCCIÓN
# Las mismas tres guardas que aplicar-staging-conta.yml (la URL es de
# staging-conta, no es de producción, y al otro lado no hay cuentas de
# producción), y además la sesión va en modo SOLO LECTURA. La URL no se
# imprime.

on:
  schedule:
    # 03:40 de Madrid: uno vale en verano y el otro en invierno (ver «hora»).
    - cron: '40 1 * * *'
    - cron: '40 2 * * *'
  workflow_dispatch:
  push:
    branches: ['conta/**']
    paths:
      - 'scripts/conta/agente-datos-maestros.*'
      - 'scripts/conta/agente-terceros.sql'
      - 'scripts/conta/agente-libro.*'
      - 'scripts/conta/lib/libro.mjs'
      - 'scripts/conta/lib/datosMaestros.mjs'
      - 'scripts/conta/lib/terceros.mjs'
      - 'scripts/conta/normativa-aviso.mjs'
      - 'scripts/conta/agente-plan-contable.*'
      - 'scripts/conta/lib/agentePlan.mjs'
      - 'scripts/conta/lib/planContable.mjs'
      - 'supabase/conta/pgc/**'
      - 'docs/conta/fuentes/sabido.json'
      # Mientras el C00 no esté en main: lanzarlo a mano desde la rama (respuesta 2).
      - 'docs/conta/cumplimiento/lanzar-agentes.txt'
      - '.github/workflows/cumplimiento-nocturno-conta.yml'

concurrency:
  group: cumplimiento-nocturno-conta-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  hora:
    name: ¿Son las 03:40 en Madrid?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      toca: ${{ steps.mirar.outputs.toca }}
    steps:
      - name: Mirar qué disparo ha llegado y qué horario rige en Madrid
        id: mirar
        env:
          EVENTO: ${{ github.event_name }}
          DISPARO: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          desfase=$(TZ=Europe/Madrid date +%z)
          if [ "$EVENTO" != "schedule" ]; then
            toca=true
          else
            case "$DISPARO|$desfase" in
              "40 1 * * *|+0200" | "40 2 * * *|+0100") toca=true ;;
              *) toca=false ;;
            esac
          fi
          echo "Evento ${EVENTO}, disparo «${DISPARO:-ninguno}», Madrid en ${desfase}: corre = ${toca}."
          echo "toca=${toca}" >> "$GITHUB_OUTPUT"

  datos-maestros:
    name: Datos maestros e impuestos
    needs: hora
    if: needs.hora.outputs.toca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_REF: oseymswjlzplqoxrfjzi
      PROD_REF: xzmpnchlguibclvxyynt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guarda 1 y 2 · el secreto apunta a staging-conta y no a producción
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then echo "::error::Falta el secreto STAGING_CONTA_DB_URL."; exit 1; fi
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ["DB_URL"])
          for parte in (os.environ["DB_URL"], u.password, u.username, u.hostname):
              if parte:
                  print(f"::add-mask::{parte}")
          PY
          case "$DB_URL" in *"$PROD_REF"*) echo "::error::La URL apunta a PRODUCCIÓN. Abortado sin conectar."; exit 1 ;; esac
          case "$DB_URL" in *"$STAGING_REF"*) echo "La URL es de staging-conta." ;; *) echo "::error::La URL no es de staging-conta."; exit 1 ;; esac

      - name: Instalar psql 17
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null

      - name: Guarda 3 · al otro lado no hay producción
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
          PGOPTIONS: '-c default_transaction_read_only=on'
        run: |
          set -euo pipefail
          r=$(/usr/lib/postgresql/17/bin/psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            select count(*) from public.accounts
            where id in ('51ad1792-6629-4ef7-833a-b57b09a86710', '00000000-0000-0000-0000-000000000001')")
          if [ "$r" != "0" ]; then echo "::error::La base tiene cuentas de producción. Abortado."; exit 1; fi

      - name: Volcar las filas de serie (solo lectura)
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
          PGOPTIONS: '-c default_transaction_read_only=on'
        run: |
          set -euo pipefail
          export PGAPPNAME="gha-cumplimiento-conta-${GITHUB_RUN_ID}"
          /usr/lib/postgresql/17/bin/psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -f scripts/conta/agente-datos-maestros.sql > /tmp/bd.json
          # C03: los terceros, solo si la base ya los tiene (antes del C03, no).
          if [ "$(/usr/lib/postgresql/17/bin/psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select to_regclass('public.party') is not null")" = "t" ]; then
            /usr/lib/postgresql/17/bin/psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -f scripts/conta/agente-terceros.sql > /tmp/terceros.json
          else
            echo null > /tmp/terceros.json
          fi

      - name: Revisar contra la referencia
        id: revisar
        continue-on-error: true
        run: node scripts/conta/agente-datos-maestros.mjs /tmp/bd.json /tmp/informe.md staging-conta /tmp/terceros.json

      - name: Informe
        if: always()
        run: |
          if [ -f /tmp/informe.md ]; then cat /tmp/informe.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Aviso
        if: steps.revisar.outcome == 'failure' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: 'Conta · Cumplimiento: los datos maestros no cuadran con la fuente, o hay fallos de coherencia'
        run: |
          set -euo pipefail
          enlace="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '%s\n\nEjecución: %s\n' "$(cat /tmp/informe.md)" "$enlace" > /tmp/aviso.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITULO\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file /tmp/aviso.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body-file /tmp/aviso.md; fi

      # C04 · Agente «Libro diario»: cuadre, numeración, cadena, IVA, ventas del
      # día, cedidas, socio, resultado por local, meses cerrados y propuestas
      # viejas. Solo lee; antes del C04 (sin journal_entry) no hay libro que mirar.
      - name: Libro diario (solo lectura)
        id: libro
        continue-on-error: true
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
          PGOPTIONS: '-c default_transaction_read_only=on'
        run: |
          set -euo pipefail
          if [ "$(/usr/lib/postgresql/17/bin/psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select to_regclass('public.journal_entry') is not null")" = "t" ]; then
            /usr/lib/postgresql/17/bin/psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -f scripts/conta/agente-libro.sql > /tmp/libro.json
            node scripts/conta/agente-libro.mjs /tmp/libro.json /tmp/informe-libro.md staging-conta
          else
            echo "## Agente «Libro diario» · staging-conta: aún no hay libro diario (antes del C04)." > /tmp/informe-libro.md
          fi

      - name: Informe del libro
        if: always()
        run: |
          if [ -f /tmp/informe-libro.md ]; then cat /tmp/informe-libro.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Aviso del libro
        if: steps.libro.outcome == 'failure' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: 'Conta · Libro diario: algo no cuadra en el libro'
        run: |
          set -euo pipefail
          enlace="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '%s\n\nEjecución: %s\n' "$(cat /tmp/informe-libro.md)" "$enlace" > /tmp/aviso-libro.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITULO\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file /tmp/aviso-libro.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body-file /tmp/aviso-libro.md; fi

      - name: Resultado del libro
        if: steps.libro.outcome == 'failure'
        run: |
          echo "::error::El libro diario tiene algo en rojo: ver el informe del resumen."
          exit 1

      - name: Resultado
        if: steps.revisar.outcome == 'failure'
        run: |
          echo "::error::Los datos maestros no cuadran con la fuente o hay fallos de coherencia en rojo: ver el informe del resumen."
          exit 1

  normativa:
    name: Normativa al día
    needs: hora
    if: needs.hora.outputs.toca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comparar las fuentes con la última descarga
        run: node scripts/conta/fuentes.mjs comparar

      - name: Separar lo nuevo de lo ya sabido
        id: informe
        continue-on-error: true
        run: node scripts/conta/normativa-aviso.mjs /tmp/informe-normativa.md

      - name: Informe
        if: always()
        run: |
          if [ -f /tmp/informe-normativa.md ]; then cat /tmp/informe-normativa.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Aviso
        # Solo lo NUEVO abre aviso; lo ya sabido sale en el informe (docs/conta/fuentes/sabido.json).
        if: steps.informe.outcome == 'failure' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: 'Conta · Normativa al día: ha cambiado una fuente oficial'
        run: |
          set -euo pipefail
          enlace="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '%s\n\nEjecución: %s\n' "$(cat /tmp/informe-normativa.md)" "$enlace" > /tmp/aviso.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITULO\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file /tmp/aviso.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body-file /tmp/aviso.md; fi

      - name: Resultado
        if: steps.informe.outcome == 'failure'
        run: |
          echo "::warning::Ha cambiado alguna fuente oficial, o no se ha podido comprobar: ver el informe."

  plan-contable:
    name: Plan contable
    needs: hora
    if: needs.hora.outputs.toca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_REF: oseymswjlzplqoxrfjzi
      PROD_REF: xzmpnchlguibclvxyynt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guarda 1 y 2 · el secreto apunta a staging-conta y no a producción
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then echo "::error::Falta el secreto STAGING_CONTA_DB_URL."; exit 1; fi
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ["DB_URL"])
          for parte in (os.environ["DB_URL"], u.password, u.username, u.hostname):
              if parte:
                  print(f"::add-mask::{parte}")
          PY
          case "$DB_URL" in *"$PROD_REF"*) echo "::error::La URL apunta a PRODUCCIÓN. Abortado sin conectar."; exit 1 ;; esac
          case "$DB_URL" in *"$STAGING_REF"*) echo "La URL es de staging-conta." ;; *) echo "::error::La URL no es de staging-conta."; exit 1 ;; esac

      - name: Instalar psql 17
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null

      - name: Guarda 3 · al otro lado no hay producción
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
          PGOPTIONS: '-c default_transaction_read_only=on'
        run: |
          set -euo pipefail
          r=$(/usr/lib/postgresql/17/bin/psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            select count(*) from public.accounts
            where id in ('51ad1792-6629-4ef7-833a-b57b09a86710', '00000000-0000-0000-0000-000000000001')")
          if [ "$r" != "0" ]; then echo "::error::La base tiene cuentas de producción. Abortado."; exit 1; fi

      - name: Volver a bajar el PGC del BOE (no se sube a ninguna parte)
        env:
          FUENTES_SOLO: rd-1514-2007,rd-1515-2007,rd-1-2021
        run: node scripts/conta/fuentes.mjs descargar

      - name: Volcar pgc_account (solo lectura)
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
          PGOPTIONS: '-c default_transaction_read_only=on'
        run: |
          set -euo pipefail
          export PGAPPNAME="gha-plan-contable-${GITHUB_RUN_ID}"
          /usr/lib/postgresql/17/bin/psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -f scripts/conta/agente-plan-contable.sql > /tmp/bd-plan.json

      - name: Revisar
        id: revisar
        continue-on-error: true
        run: node scripts/conta/agente-plan-contable.mjs /tmp/bd-plan.json /tmp/informe-plan.md staging-conta

      - name: Informe
        if: always()
        run: |
          if [ -f /tmp/informe-plan.md ]; then cat /tmp/informe-plan.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Aviso
        if: steps.revisar.outcome == 'failure' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: 'Conta · Plan contable: la serie no cuadra con el BOE o con la base'
        run: |
          set -euo pipefail
          enlace="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '%s\n\nEjecución: %s\n' "$(cat /tmp/informe-plan.md)" "$enlace" > /tmp/aviso.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITULO\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file /tmp/aviso.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body-file /tmp/aviso.md; fi

      - name: Resultado
        if: steps.revisar.outcome == 'failure'
        run: |
          echo "::error::La serie del plan contable no cuadra: ver el informe del resumen."
          exit 1
