name: Aplicar SQL en staging-conta

# QUÉ HACE
# Aplica en staging-conta (la rama de Supabase del módulo de contabilidad,
# ref oseymswjlzplqoxrfjzi) los ficheros SQL que diga el manifiesto
# supabase/staging/aplicar.txt, en su orden, cada uno en UNA transacción:
# o entra entero o no entra nada. Si uno falla, los siguientes no se aplican.
#
# POR QUÉ EXISTE (02/10/2026)
# El conector de Supabase pide confirmación para cualquier sentencia con DROP
# o DELETE y la petición caduca a los 60 s: la estructura del C01 no pudo
# entrar dos veces seguidas, y ni siquiera un `drop table if exists` de una
# tabla inexistente. Las migraciones de staging dejan de depender de él.
#
# CUÁNDO SE DISPARA
# Un push a main, a una rama conta/** o a una reparto-** que cambie
# supabase/staging/aplicar.txt. Nada más lo dispara: ni tocar un .sql ni tocar
# este workflow.
#
# QUÉ PASA (W04, Julio, 22/10): «staging recibe de verdad solo lo que está en
# producción». Ya no se pasa el manifiesto entero, sino lo que el push AÑADE
# (scripts/conta/staging-tanda.mjs nuevas):
#   · desde una RAMA: lo que la rama añade contra main, cada fichero en su
#     sesión con BEGIN … ROLLBACK (y antes, las migraciones nuevas de la rama,
#     para que su prueba las encuentre), sin el cerrojo de migrar. Un fichero
#     con COMMIT, o con un ROLLBACK que no es su última sentencia, para el run
#     (dejaría cosas de verdad). Y después (W05, Julio, 22/10), las migraciones
#     que SOLO AÑADEN contra lo que hay en staging (columna que admite nulos,
#     tabla o función nuevas: la clase del analizador de la tanda) van DE
#     VERDAD, con el cerrojo, si se pueden pasar dos veces seguidas (main las
#     volverá a pasar). Las que cambian o destruyen algo, solo en ROLLBACK;
#   · desde MAIN (después del real de la tanda, que se fusiona en verde): lo que
#     el push añade, DE VERDAD, fichero a fichero, con el cerrojo;
#   · a mano («aplicar»): desde main, el manifiesto ENTERO de verdad (para
#     rehacer staging); desde una rama, lo mismo que su push.
# Así staging es como producción por construcción, y W03 (17 funciones con su
# md5, que tapaba lo que el manifiesto entero dejaba fuera de orden) se fue.
#
# W06 (Julio, 26/10): DESDE UNA RAMA, LO MISMO QUE EL ENSAYO DE PRODUCCIÓN. Dos
# veces (el #230 y el #241) el ensayo de producción paró una tanda en verde en
# staging. Ahora, si la rama tiene tanda de producción
# (supabase/produccion/tandas/<producto>/<rama>/aplicar.txt), staging la
# cuenta antes, la aplica, la deshace con sus .down.sql, la cuenta después y
# compara, todo en ROLLBACK: las cuentas que declara («cuenta:») y además las
# DEFINICIONES de la base entera (huella de cada función, cada índice, cada
# columna, cada almacén de Storage…). Si algo no vuelve, para, con la tabla de
# lo que cambia en el registro del job y en una anotación (scripts/conta/
# staging/compara.sh). Lo que va de verdad (W05) queda registrado en
# w06_staging (scripts/conta/staging/de-verdad.sh) para que el push siguiente
# compare desde como estaba antes. El modo «compara-prueba» lo prueba con una
# tanda de vueltas atrás rotas a propósito (supabase/staging/compara-prueba/).
# El manifiesto fijo de antes del C10 (supabase/staging/tanda-de-produccion.txt)
# ya no es lo que se usa para esto: solo lo usan «real-con-fallo» y «real».
#
# LO QUE NO PUEDE HACER: TOCAR PRODUCCIÓN
# Usa un único secreto de base de datos, STAGING_CONTA_DB_URL, y tres guardas
# antes de aplicar nada:
#   1. La URL contiene oseymswjlzplqoxrfjzi (staging-conta).
#   2. La URL NO contiene xzmpnchlguibclvxyynt (producción).
#   3. Ya conectado, la base NO tiene ni Foodint ni Folvy Interno en accounts.
#      Producción tiene las dos siempre; staging-conta, ninguna (solo semillas).
#      Esta no depende de lo que diga la URL: mira lo que hay al otro lado.
# Si falla una, el job aborta sin aplicar nada.
#
# LO QUE JULIO HACE UNA VEZ
#   Settings → Secrets and variables → Actions → New repository secret
#     Nombre:  STAGING_CONTA_DB_URL
#     Valor:   la cadena de conexión de staging-conta (Connect → Session pooler)
#
# La URL no se imprime: el usuario, la contraseña y el host se enmascaran antes
# de conectar, y psql nunca recibe la URL por la línea de órdenes que se ve.

on:
  push:
    # reparto-**: el R02 (quién reparte) usa la misma tanda y las mismas guardas.
    branches: ['main', 'conta/**', 'reparto-**']
    # W06 (22/10): también cuando cambia un fichero de la tanda, no solo el
    # manifiesto. El 22/10 bb7d2e24 arregló la prueba de staging de la 0470 sin
    # tocar el manifiesto y no se ensayó: la tanda iba a salir sin su prueba.
    # Desde una rama se ensaya lo que la rama añade contra main (aunque el push
    # solo cambie un fichero); desde main, lo que añade el push (nada, si solo
    # cambia un fichero: lo de main no se reaplica).
    paths:
      - 'supabase/staging/aplicar.txt'
      - 'supabase/staging/tandas/**'
      - 'supabase/migrations/**'
      - 'supabase/staging/sql/**'
      - 'supabase/vuelta-atras/**'
      - 'supabase/seeds/conta/**'
      - 'supabase/seeds/reparto/**'
      - 'scripts/conta/staging-tanda.mjs'
      # W06: la tanda de producción de la rama, lo que cuenta y el comparador.
      - 'supabase/produccion/tandas/**'
      - 'scripts/conta/produccion/cuentas/**'
      - 'scripts/conta/staging/**'
  # C04 R4 · A mano, desde la rama: el modo «ensayo-de-vuelta-atras» aplica la
  # tanda de ejemplo de supabase/staging/ensayo-vuelta-atras/ con su registro,
  # FUERZA que la comprobación de después falle y deja que deshacer.sh —el de
  # producción— la quite; en verde solo si staging queda exactamente como
  # estaba (foto antes = foto después). «aplicar» hace lo mismo que el push.
  # R9 (13/10) · «real-con-fallo» y «real»: LA TANDA DE PRODUCCIÓN
  # (supabase/staging/tanda-de-produccion.txt) con las piezas del real de
  # producción (scripts/conta/produccion/real-en-staging.sh). real-con-fallo
  # aplica, fuerza en rojo la comprobación de después y deja que deshacer.sh
  # la quite y la CUENTE: en verde solo si staging queda como antes. real la
  # aplica y la deja puesta.
  workflow_dispatch:
    inputs:
      modo:
        description: 'aplicar (el manifiesto y, desde una rama, la comparación de su tanda), ensayo-de-vuelta-atras, real-con-fallo, real (la tanda de producción) o compara-prueba (W06: vueltas atrás rotas a propósito)'
        type: choice
        options: ['aplicar', 'ensayo-de-vuelta-atras', 'real-con-fallo', 'real', 'compara-prueba']
        default: 'aplicar'

# Dos tandas a la vez sobre la misma base se pisan. Se encolan.
concurrency:
  group: aplicar-staging-conta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    # 15 de aplicar y hasta 45 esperando a que acaben las e2e que están
    # corriendo (una entera en trozos, unos 12 min; una de las de antes, 35).
    timeout-minutes: 60
    env:
      STAGING_REF: oseymswjlzplqoxrfjzi
      PROD_REF: xzmpnchlguibclvxyynt
      MANIFIESTO: supabase/staging/aplicar.txt
    steps:
      - uses: actions/checkout@v4
        with:
          # Para comparar el manifiesto con el de main o con el del commit de antes.
          fetch-depth: 0

      - name: Guarda 1 y 2 · el secreto apunta a staging-conta y no a producción
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::Falta el secreto STAGING_CONTA_DB_URL. No se aplica nada."
            exit 1
          fi
          # Enmascarar las piezas de la URL antes de cualquier otra cosa.
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ["DB_URL"])
          for parte in (os.environ["DB_URL"], u.password, u.username, u.hostname):
              if parte:
                  print(f"::add-mask::{parte}")
          PY
          case "$DB_URL" in
            *"$PROD_REF"*) echo "::error::La URL apunta a PRODUCCIÓN. Abortado sin conectar."; exit 1 ;;
          esac
          case "$DB_URL" in
            *"$STAGING_REF"*) echo "La URL es de staging-conta." ;;
            *) echo "::error::La URL no es de staging-conta (no contiene su ref). Abortado sin conectar."; exit 1 ;;
          esac

      - name: Leer y validar el manifiesto
        id: manifiesto
        if: inputs.modo != 'ensayo-de-vuelta-atras' && inputs.modo != 'real-con-fallo' && inputs.modo != 'real' && inputs.modo != 'compara-prueba'
        env:
          ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # W06: desde una rama, ¿tiene tanda de producción? Entonces se compara (abajo).
          if [ "$GITHUB_REF_NAME" != main ]; then
            set +e; d=$(node scripts/conta/produccion/tanda.mjs carpeta "$GITHUB_REF_NAME"); rc=$?; set -e
            case "$rc" in
              0) echo "TANDA_PROD=$d" >> "$GITHUB_ENV"; echo "La rama tiene tanda de producción: $d (se compara como el ensayo de producción)." ;;
              1) echo "La rama no tiene tanda de producción: no hay nada que comparar como el ensayo." ;;
              *) echo "::error::La tanda de la rama no se puede leer (¿está en los dos productos?)."; exit 1 ;;
            esac
          fi
          # W04: qué pasa y cómo (arriba, «QUÉ PASA»).
          if [ "$GITHUB_REF_NAME" = main ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            QUE='el manifiesto ENTERO, de verdad (a mano desde main)'; ENSAYO=0
            node scripts/conta/staging-tanda.mjs entero > /tmp/tanda.txt
          elif [ "$GITHUB_REF_NAME" = main ]; then
            QUE="lo que añade este push (contra ${ANTES::7}), de verdad"; ENSAYO=0
            node scripts/conta/staging-tanda.mjs nuevas "$ANTES" > /tmp/tanda.txt
          else
            QUE='lo que añade la rama contra main, en ROLLBACK (staging no cambia)'; ENSAYO=1
            node scripts/conta/staging-tanda.mjs nuevas origin/main > /tmp/tanda.txt
          fi
          echo "ENSAYO=$ENSAYO" >> "$GITHUB_ENV"
          echo "### Qué pasa: $QUE" >> "$GITHUB_STEP_SUMMARY"
          n=$(wc -l < /tmp/tanda.txt)
          if [ "$n" -eq 0 ]; then
            echo "Nada que pasar: $QUE no tiene ningún fichero." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "NADA=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mal=0
          while IFS= read -r f; do
            # Solo SQL de las carpetas de migraciones, de staging o de semillas
            # de contabilidad y de reparto (R02); sin rutas con «..».
            if ! printf '%s' "$f" | grep -qE '^supabase/(migrations|staging/sql|seeds/conta|seeds/reparto)/[A-Za-z0-9_./-]+\.sql$' \
               || printf '%s' "$f" | grep -q '\.\.'; then
              echo "::error::Ruta no permitida en el manifiesto: $f"; mal=1; continue
            fi
            if [ ! -f "$f" ]; then
              echo "::error::No existe: $f"; mal=1
            fi
          done < /tmp/tanda.txt
          [ "$mal" -eq 0 ] || exit 1
          # En ROLLBACK, nada puede quedarse de verdad.
          if [ "$ENSAYO" = 1 ]; then node scripts/conta/staging-tanda.mjs rollback $(cat /tmp/tanda.txt); fi
          echo "Tanda de $n ficheros ($QUE), en este orden:"
          nl -ba /tmp/tanda.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar psql 17
        if: env.NADA != '1' || env.TANDA_PROD != '' || inputs.modo == 'compara-prueba'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/psql --version

      - name: Guarda 3 · al otro lado no hay producción
        if: env.NADA != '1' || env.TANDA_PROD != '' || inputs.modo == 'compara-prueba'
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/17/bin/psql
          export PGAPPNAME="gha-staging-conta-${GITHUB_RUN_ID}"
          r=$("$PSQL" "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            select count(*) from public.accounts
            where id in ('51ad1792-6629-4ef7-833a-b57b09a86710',   -- Foodint
                         '00000000-0000-0000-0000-000000000001')   -- Folvy Interno
          ")
          if [ "$r" != "0" ]; then
            echo "::error::La base tiene cuentas de producción ($r). NO es staging-conta. Abortado sin aplicar nada."
            exit 1
          fi
          echo "Al otro lado no hay ni Foodint ni Folvy Interno: es staging-conta."

      # W02 (paso 1c, 16/10): una tanda ya no entra en staging a mitad de una
      # e2e. Cada e2e de carril tiene el cerrojo de migrar COMPARTIDO mientras
      # corre; esto lo coge EXCLUSIVO: espera a que acaben las que están
      # corriendo y, mientras aplica, no deja empezar ninguna nueva (Postgres
      # pone en cola a las que llegan detrás). Y, mientras queden ramas con la
      # e2e de antes (sin carril), también el cerrojo de antes, e2e.cerrojo.
      # W04: solo lo que se queda de verdad coge el cerrojo; un ensayo en ROLLBACK no.
      - name: Cerrojo de migrar · esperar a que acaben las e2e en marcha
        if: env.NADA != '1' && env.ENSAYO != '1' && inputs.modo != 'compara-prueba'
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
          CARRIL_YO: "run ${{ github.run_id }} · aplicar · ${{ github.ref_name }}"
          CERROJO_YO: "run ${{ github.run_id }} · aplicar · ${{ github.ref_name }}"
        run: |
          set -euo pipefail
          scripts/e2e/carril.sh migrar-coger
          scripts/e2e/cerrojo.sh coger

      - name: Ensayar en ROLLBACK lo que añade la rama
        if: env.NADA != '1' && env.ENSAYO == '1' && inputs.modo != 'ensayo-de-vuelta-atras' && inputs.modo != 'real-con-fallo' && inputs.modo != 'real'
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -uo pipefail
          PSQL=/usr/lib/postgresql/17/bin/psql
          export PGAPPNAME="gha-staging-conta-ensayo-${GITHUB_RUN_ID}"
          {
            echo "## Ensayo en staging-conta (ROLLBACK: staging no cambia)"
            echo
            echo "Rama \`${GITHUB_REF_NAME}\` · commit \`${GITHUB_SHA::7}\` · lanzado por ${GITHUB_ACTOR}"
            echo
            echo "| # | Fichero | md5 | Resultado |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/sesiones
          # Una sesión por fichero: BEGIN, las migraciones nuevas de antes, el fichero, ROLLBACK.
          node scripts/conta/staging-tanda.mjs sesiones $(cat /tmp/tanda.txt) \
            | awk '/^--@@ sesión /{n++} {print > sprintf("/tmp/sesiones/%03d.sql", n)}'
          i=0; fallo=0
          while IFS= read -r f; do
            i=$((i+1))
            md5=$(md5sum "$f" | cut -d' ' -f1)
            s=$(printf '/tmp/sesiones/%03d.sql' "$i")
            echo "::group::[$i] $f  (md5 $md5, en ROLLBACK)"
            if "$PSQL" "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$s" > /tmp/salida.txt 2>&1; then
              cat /tmp/salida.txt; echo "::endgroup::"
              echo "| $i | \`$f\` | \`$md5\` | **en verde** (ROLLBACK) |" >> "$GITHUB_STEP_SUMMARY"
            else
              cat /tmp/salida.txt; echo "::endgroup::"
              err=$(grep -E '^(psql:.*)?(ERROR|CONTEXT|DETALLE|DETAIL|LÍNEA|LINE)' /tmp/salida.txt | head -8 | tr '\n' ' ' | cut -c1-900)
              echo "::error title=psql [$i]::${err:-sin mensaje de error}"
              echo "| $i | \`$f\` | \`$md5\` | **FALLÓ** (ROLLBACK) |" >> "$GITHUB_STEP_SUMMARY"
              fallo=1
            fi
          done < /tmp/tanda.txt
          exit "$fallo"

      # W06: la tanda de producción de la rama, como el ensayo de producción
      # (arriba, «W06»). Antes de W05: si no vuelve, no va nada de verdad.
      - name: Comparar como el ensayo de producción (la tanda de la rama, en ROLLBACK)
        if: env.TANDA_PROD != '' && inputs.modo != 'ensayo-de-vuelta-atras' && inputs.modo != 'real-con-fallo' && inputs.modo != 'real' && inputs.modo != 'compara-prueba'
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -uo pipefail
          export PSQL=/usr/lib/postgresql/17/bin/psql
          export PGAPPNAME="gha-staging-conta-compara-${GITHUB_RUN_ID}"
          export INFORME="$GITHUB_STEP_SUMMARY"
          bash scripts/conta/staging/compara.sh "$TANDA_PROD/aplicar.txt" '^supabase/migrations/[A-Za-z0-9_./-]+\.sql$' "$GITHUB_REF_NAME"

      # W05: lo que solo añade, de verdad desde la rama (arriba, «QUÉ PASA»).
      - name: Lo que solo añade, de verdad (desde la rama)
        if: env.NADA != '1' && env.ENSAYO == '1' && inputs.modo != 'ensayo-de-vuelta-atras' && inputs.modo != 'real-con-fallo' && inputs.modo != 'real'
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
          CARRIL_YO: "run ${{ github.run_id }} · aplicar · ${{ github.ref_name }}"
          CERROJO_YO: "run ${{ github.run_id }} · aplicar · ${{ github.ref_name }}"
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/17/bin/psql
          export PGAPPNAME="gha-staging-conta-anade-${GITHUB_RUN_ID}"
          A=scripts/conta/produccion/analizar.mjs
          grep '^supabase/migrations/' /tmp/tanda.txt > /tmp/migraciones.txt || true
          if [ ! -s /tmp/migraciones.txt ]; then echo "La rama no trae migraciones: nada va de verdad." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # El contexto, medido en STAGING y solo leyendo (la misma consulta que la tanda de producción).
          node "$A" objetivos $(cat /tmp/migraciones.txt) > /tmp/objetivos.json
          node "$A" destruidos $(cat /tmp/migraciones.txt) > /tmp/destruidos.json
          node "$A" sql-contexto /tmp/objetivos.json /tmp/destruidos.json $(cat /tmp/migraciones.txt) > /tmp/contexto.sql
          PGOPTIONS="-c default_transaction_read_only=on" "$PSQL" "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -f /tmp/contexto.sql > /tmp/contexto.json
          node scripts/conta/staging-tanda.mjs anaden /tmp/contexto.json $(cat /tmp/migraciones.txt) > /tmp/anaden.txt 2> /tmp/no-anaden.txt || true
          { echo; echo "### Lo que solo añade, de verdad (W05)"; echo; } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r l; do echo "- $l" >> "$GITHUB_STEP_SUMMARY"; done < /tmp/no-anaden.txt
          if [ ! -s /tmp/anaden.txt ]; then echo "- Ninguna migración de la rama solo añade: todo se queda en ROLLBACK." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # Que se pueda pasar otra vez: dos veces seguidas, en ROLLBACK.
          while IFS= read -r f; do
            if ! printf 'begin;\n\\i %s\n\\i %s\nrollback;\n' "$f" "$f" | "$PSQL" "$DB_URL" -X -v ON_ERROR_STOP=1 > /tmp/dos.txt 2>&1; then
              cat /tmp/dos.txt
              echo "::error::$f no se puede pasar dos veces seguidas: main la volverá a pasar. Que use «if not exists» o «create or replace». No va nada de verdad."
              echo "- \`$f\`: **no se puede pasar dos veces**: no va de verdad." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done < /tmp/anaden.txt
          # De verdad, con el cerrojo (espera a las e2e en marcha), fichero a fichero.
          # W06: con su registro en w06_staging (qué fue y cómo estaba antes), para
          # que la comparación del push siguiente parta de como estaba.
          scripts/e2e/carril.sh migrar-coger
          scripts/e2e/cerrojo.sh coger
          PSQL="$PSQL" bash scripts/conta/staging/de-verdad.sh "$GITHUB_REF_NAME" $(cat /tmp/anaden.txt)
          while IFS= read -r f; do
            echo "- \`$f\`: **solo añade: aplicado de verdad** (se puede pasar otra vez; registrado en w06_staging)." >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/anaden.txt

      - name: Aplicar, fichero a fichero
        if: env.NADA != '1' && env.ENSAYO != '1' && inputs.modo != 'ensayo-de-vuelta-atras' && inputs.modo != 'real-con-fallo' && inputs.modo != 'real'
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -uo pipefail
          PSQL=/usr/lib/postgresql/17/bin/psql
          export PGAPPNAME="gha-staging-conta-${GITHUB_RUN_ID}"
          {
            echo "## Aplicar SQL en staging-conta"
            echo
            echo "Rama \`${GITHUB_REF_NAME}\` · commit \`${GITHUB_SHA::7}\` · lanzado por ${GITHUB_ACTOR}"
            echo
            echo "| # | Fichero | md5 | Resultado |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          i=0; fallo=0
          while IFS= read -r f; do
            i=$((i+1))
            md5=$(md5sum "$f" | cut -d' ' -f1)
            if [ "$fallo" -ne 0 ]; then
              echo "| $i | \`$f\` | \`$md5\` | no aplicado (falló uno anterior) |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "::group::[$i] $f  (md5 $md5)"
            # -1: todo el fichero en una transacción. ON_ERROR_STOP: el primer
            # error la revierte entera. -X: sin .psqlrc.
            if "$PSQL" "$DB_URL" -X -v ON_ERROR_STOP=1 -1 -f "$f" > /tmp/salida.txt 2>&1; then
              cat /tmp/salida.txt
              echo "::endgroup::"
              echo "OK [$i] $f"
              echo "| $i | \`$f\` | \`$md5\` | **aplicado** |" >> "$GITHUB_STEP_SUMMARY"
            else
              cat /tmp/salida.txt
              echo "::endgroup::"
              # El error de psql también como anotación: los registros de la
              # ejecución no siempre se pueden descargar, las anotaciones sí.
              # Solo las líneas de ERROR y CONTEXT (nunca la URL: psql no la imprime).
              err=$(grep -E '^(psql:.*)?(ERROR|CONTEXT|DETALLE|DETAIL|LÍNEA|LINE)' /tmp/salida.txt | head -8 | tr '\n' ' ' | cut -c1-900)
              echo "::error title=psql [$i]::${err:-sin mensaje de error}"
              echo "::error::FALLÓ [$i] $f — revertido entero. Los siguientes no se aplican."
              echo "| $i | \`$f\` | \`$md5\` | **FALLÓ, revertido entero** |" >> "$GITHUB_STEP_SUMMARY"
              fallo=1
            fi
          done < /tmp/tanda.txt
          exit "$fallo"

      - name: Ensayo de vuelta atrás (aplica, falla a propósito y deshace)
        if: inputs.modo == 'ensayo-de-vuelta-atras'
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -uo pipefail
          export PSQL=/usr/lib/postgresql/17/bin/psql
          export PGAPPNAME="gha-staging-conta-ensayo-${GITHUB_RUN_ID}"
          export INFORME="$GITHUB_STEP_SUMMARY"
          bash scripts/conta/produccion/ensayo-vuelta-atras.sh

      - name: La tanda de producción en staging (real-con-fallo o real)
        if: inputs.modo == 'real-con-fallo' || inputs.modo == 'real'
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
          MODO: ${{ inputs.modo }}
        run: |
          set -uo pipefail
          export PSQL=/usr/lib/postgresql/17/bin/psql
          export PGAPPNAME="gha-staging-conta-${MODO}-${GITHUB_RUN_ID}"
          export INFORME="$GITHUB_STEP_SUMMARY"
          bash scripts/conta/produccion/real-en-staging.sh "$MODO"

      # W06 · La prueba del comparador: la misma tanda con una vuelta atrás buena
      # y cuatro rotas a propósito. En verde solo si la buena sale en verde y las
      # cuatro rotas en rojo. Todo en ROLLBACK: staging no cambia.
      - name: Prueba del comparador (una vuelta atrás buena y cuatro rotas)
        if: inputs.modo == 'compara-prueba'
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -uo pipefail
          export PSQL=/usr/lib/postgresql/17/bin/psql
          export PGAPPNAME="gha-staging-conta-compara-prueba-${GITHUB_RUN_ID}"
          export COMPARA_PREVIO=supabase/staging/compara-prueba/previo.sql
          export COMPARA_SIN_ANOTAR=1
          D=supabase/staging/compara-prueba
          { echo "## W06 · Prueba del comparador"; echo; echo "| Vuelta atrás | Tiene que salir | Sale | |"; echo "|---|---|---|---|"; } > /tmp/prueba.md
          mal=0
          for caso in buena rota-indice rota-columna rota-almacen rota-funcion; do
            echo "::group::$caso"
            VUELTA_ATRAS_DIR="$D/$caso" INFORME=/dev/null bash scripts/conta/staging/compara.sh "$D/aplicar.txt" '^supabase/staging/compara-prueba/[A-Za-z0-9_./-]+\.sql$'
            rc=$?
            echo "::endgroup::"
            [ "$caso" = buena ] && quiere=0 || quiere=1
            sale=$([ "$rc" -eq 0 ] && echo verde || echo rojo); tiene=$([ "$quiere" -eq 0 ] && echo verde || echo rojo)
            if [ "$rc" -eq "$quiere" ]; then ok=bien; else ok='**MAL**'; mal=1; fi
            echo "| \`$caso\` | $tiene | $sale | $ok |" >> /tmp/prueba.md
          done
          cat /tmp/prueba.md | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$mal" -ne 0 ]; then echo "::error title=Prueba del comparador::Alguna vuelta atrás no sale como debe (ver la tabla)."; exit 1; fi
          echo "La buena en verde y las cuatro rotas en rojo."

      - name: Cerrojo de migrar · soltarlo (pase lo que pase)
        if: always()
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
          CERROJO_YO: "run ${{ github.run_id }} · aplicar · ${{ github.ref_name }}"
        run: |
          scripts/e2e/carril.sh migrar-soltar || true
          scripts/e2e/cerrojo.sh soltar
