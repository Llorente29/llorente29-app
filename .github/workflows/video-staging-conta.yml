name: Vídeo en staging-conta
run-name: "vídeo · ${{ github.ref_name }} · ${{ github.sha }}"

# QUÉ HACE (V01, 02/11)
# Graba el vídeo «De la factura al pago» (scripts/video) contra staging-conta,
# con la persona administradora de la empresa A de un CARRIL (la copia de las
# cuentas de prueba de las e2e, scripts/e2e/carril.sh), y lo monta con ffmpeg:
# subtítulos quemados, portada y cierre, sin las esperas de red.
#
# NADA DE PRODUCCIÓN. Solo el secreto de staging (STAGING_CONTA_DB_URL), con las
# mismas tres guardas que la e2e: la URL es de staging-conta, no es de
# producción, y al otro lado no hay ni Foodint ni Folvy Interno.
# Lo que se siembra para el vídeo va en el carril, que se borra al acabar.
#
# CUÁNDO: un push a video/** o a claude/** que toque scripts/video o este
# workflow (no toca src ni tests: no lanza la e2e). Para volver a grabarlo
# cuando cambien las pantallas, basta un push (o «Re-run» del último run).
#
# LO QUE DEJA: el artefacto «video» (el MP4, un fotograma por paso y uno cada
# 2 s para revisarlo) y, como desde el entorno de las sesiones no se pueden
# bajar artefactos, lo mismo en la rama aparte video-salida/<rama>, un solo
# commit sin historia que se reescribe en cada run. No es la rama del PR.

on:
  push:
    branches: ['video/**', 'claude/**']
    paths:
      - 'scripts/video/**'
      - '.github/workflows/video-staging-conta.yml'
  workflow_dispatch:

concurrency:
  group: video-staging-conta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PGCONNECT_TIMEOUT: '15'
  STAGING_REF: oseymswjlzplqoxrfjzi
  PROD_REF: xzmpnchlguibclvxyynt
  VITE_SUPABASE_URL: https://oseymswjlzplqoxrfjzi.supabase.co
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zZXltc3dqbHpwbHFveHJmanppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODYzNzUsImV4cCI6MjEwNjQ2MjM3NX0.xszvWohb2R7MWidy1ZsIL0IZg2E55aQSFRc1WX8A4js

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARRIL_MAX: ${{ vars.E2E_CARRILES || '2' }}
      CARRIL_YO: "vídeo · run ${{ github.run_id }}/${{ github.run_attempt }} · ${{ github.ref_name }}"
      SALIDA: ${{ github.workspace }}/video-salida
    steps:
      - uses: actions/checkout@v4

      - name: Guarda 1 y 2 · el secreto apunta a staging-conta y no a producción
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then echo "::error::Falta STAGING_CONTA_DB_URL."; exit 1; fi
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ["DB_URL"])
          for parte in (os.environ["DB_URL"], u.password, u.username, u.hostname):
              if parte:
                  print(f"::add-mask::{parte}")
          PY
          case "$DB_URL" in *"$PROD_REF"*) echo "::error::La URL apunta a PRODUCCIÓN."; exit 1 ;; esac
          case "$DB_URL" in *"$STAGING_REF"*) echo "La URL es de staging-conta." ;; *) echo "::error::La URL no es de staging-conta."; exit 1 ;; esac

      - name: Instalar psql 17 y ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common ffmpeg fonts-dejavu-core >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      # Las pantallas que se graban: las de esta rama, o las de la rama que diga
      # scripts/video/rama-app.txt (solo su src: la que aún no está en main y ya
      # está en staging, como el Pagar nuevo del B01·12). Sin ese fichero, las de aquí.
      - name: Las pantallas de la rama que se graba
        run: |
          set -euo pipefail
          R=$(grep -v '^\s*#' scripts/video/rama-app.txt 2>/dev/null | head -1 | tr -d '[:space:]' || true)
          if [ -z "$R" ]; then echo "Pantallas de esta rama."; exit 0; fi
          [[ "$R" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::rama-app.txt: «$R» no es un nombre de rama."; exit 1; }
          git fetch -q --depth=1 origin "$R"
          git checkout FETCH_HEAD -- src
          echo "### Pantallas de \`$R\` ($(git rev-parse --short FETCH_HEAD))" >> "$GITHUB_STEP_SUMMARY"
          echo "Pantallas de $R ($(git rev-parse --short FETCH_HEAD))."

      - name: Build contra staging-conta
        run: npm run build

      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Guarda 3 · al otro lado no hay cuentas de producción
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          r=$(psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from public.accounts where id in ('51ad1792-6629-4ef7-833a-b57b09a86710','00000000-0000-0000-0000-000000000001')")
          if [ "$r" != "0" ]; then echo "::error::Al otro lado hay cuentas de producción. Abortado."; exit 1; fi

      # La voz: Piper (voz neuronal libre, corre aquí sin llamar a ningún servicio),
      # con la voz de castellano de España es_ES-davefx-medium. Si no se puede
      # bajar, el vídeo sale igual, sin voz, y el run lo dice.
      - name: Voz · Piper y su modelo de castellano
        id: voz
        continue-on-error: true
        run: |
          set -euo pipefail
          pip install -q piper-tts
          mkdir -p "$RUNNER_TEMP/voz"
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium
          curl -sSfL -o "$RUNNER_TEMP/voz/es_ES-davefx-medium.onnx" "$base/es_ES-davefx-medium.onnx"
          curl -sSfL -o "$RUNNER_TEMP/voz/es_ES-davefx-medium.onnx.json" "$base/es_ES-davefx-medium.onnx.json"
          echo "VOZ_MODELO=$RUNNER_TEMP/voz/es_ES-davefx-medium.onnx" >> "$GITHUB_ENV"

      - name: Carril · esperar su turno y coger uno
        timeout-minutes: 30
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          scripts/e2e/carril.sh coger
          echo "E2E_CARRIL=$(cat "$RUNNER_TEMP/carril/numero")" >> "$GITHUB_ENV"

      - name: Carril · clonar las cuentas de prueba (con la contraseña de un solo uso)
        timeout-minutes: 30
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          CLAVE=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "::add-mask::$CLAVE"
          echo "CLAVE_PRUEBAS=$CLAVE" >> "$GITHUB_ENV"
          BARRERA_QUE=clonar scripts/e2e/carril.sh barrera-entrar
          scripts/e2e/carril.sh plantilla-coger
          scripts/e2e/carril.sh borrar
          CLAVE_PRUEBAS="$CLAVE" scripts/e2e/carril.sh clonar
          scripts/e2e/carril.sh barrera-salir
          CLAVE_PRUEBAS="$CLAVE" node scripts/e2e/carril-entrar.mjs "$E2E_CARRIL"

      - name: Grabar (con la barrera de staging cogida mientras dura)
        timeout-minutes: 30
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
          # La voz de pago (si están): secretos del repositorio, no de producción.
          VOZ_ELEVENLABS_KEY: ${{ secrets.VOZ_ELEVENLABS_KEY }}
          VOZ_ELEVENLABS_ID: ${{ vars.VOZ_ELEVENLABS_ID }}
          VOZ_GOOGLE_KEY: ${{ secrets.VOZ_GOOGLE_KEY }}
          VOZ_GOOGLE_NOMBRE: ${{ vars.VOZ_GOOGLE_NOMBRE }}
        run: |
          set -euo pipefail
          mkdir -p "$SALIDA"
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173 > /dev/null && break; sleep 1; done
          BARRERA_QUE=video scripts/e2e/carril.sh barrera-entrar
          trap 'scripts/e2e/carril.sh barrera-salir || true' EXIT
          IDS=$(node -e "import('./scripts/e2e/carril.mjs').then(m=>console.log(m.enCarril('c01a0000-0000-4000-8000-00000000000a',+process.env.E2E_CARRIL)+' '+m.enCarril('3b34403a-a7d6-4a48-a8d7-737e8cababdc',+process.env.E2E_CARRIL)))")
          read -r CUENTA EMPRESA <<< "$IDS"
          echo "VIDEO_CUENTA=$CUENTA" >> "$GITHUB_ENV"; echo "VIDEO_EMPRESA=$EMPRESA" >> "$GITHUB_ENV"
          export VIDEO_CUENTA="$CUENTA" VIDEO_EMPRESA="$EMPRESA"
          psql "$DB_URL" -X -v cuenta="$CUENTA" -v empresa="$EMPRESA" -f scripts/video/reconocer.sql > "$SALIDA/reconocer.txt" 2>&1 || true
          node scripts/video/factura-al-pago.mjs reconocer "$SALIDA"
          # La locución, ANTES de grabar: el guion espera a que acabe cada frase.
          node scripts/video/locucion.mjs "$SALIDA"
          # La voz: la de pago si hay su clave (ElevenLabs o Google, voz_nube.py); si no, Piper.
          set +e; python3 scripts/video/voz_nube.py "$SALIDA/voz/frases.json"; r=$?; set -e
          if [ "$r" = 3 ]; then
            if [ -n "${VOZ_MODELO:-}" ]; then python3 scripts/video/voz.py "$VOZ_MODELO" "$SALIDA/voz/frases.json"; else echo "::warning::Sin voz: se graba con el ritmo estimado y el vídeo sale sin voz."; fi
          elif [ "$r" != 0 ]; then echo "::error::La voz de pago ha fallado (arriba, el porqué)."; exit 1; fi
          node scripts/video/factura-al-pago.mjs grabar "$SALIDA"

      - name: Montar con ffmpeg
        if: always()
        run: |
          set -euo pipefail
          [ -f "$SALIDA/crudo.webm" ] || { echo "Sin grabación: no hay nada que montar."; exit 0; }
          [ -n "${VOZ_MODELO:-}" ] || echo "::warning::Sin modelo de voz: el vídeo sale sin voz."
          # La portada para las plataformas (YouTube, web, correo, WhatsApp), con capturas de esta grabación.
          # Antes del montaje: es también el primer fotograma del vídeo y su carátula.
          node scripts/video/miniatura.mjs "$SALIDA"
          node scripts/video/montar.mjs "$SALIDA"
          # Todo junto, para descargarlo de una vez.
          (cd "$SALIDA" && zip -q -j factura-al-pago.zip factura-al-pago.mp4 miniatura-16x9.jpg miniatura-1x1.jpg)

      - name: Revisar que no sale nada real (T11)
        if: always()
        run: |
          [ -d "$SALIDA/capturas" ] || { echo "Sin capturas."; exit 0; }
          node scripts/video/revisar.mjs "$SALIDA"

      - name: Carril · borrar y soltar (pase lo que pase)
        if: always()
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          [ -s "$RUNNER_TEMP/carril/guardian.pid" ] || [ -s "$RUNNER_TEMP/carril/numero" ] || { echo "No llegó a coger carril."; exit 0; }
          scripts/e2e/carril.sh soltar

      - name: Artefacto «video»
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: video-salida
          retention-days: 30

      - name: Publicar en video-salida/<rama> (fuera del PR)
        if: always()
        run: |
          set -euo pipefail
          [ -d "$SALIDA" ] || exit 0
          RAMA="video-salida/${GITHUB_REF_NAME//\//-}"
          cd "$SALIDA"
          rm -f crudo.webm voz/*.wav
          git init -q -b salida
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Vídeo · ${GITHUB_REF_NAME} · ${GITHUB_SHA::8} · run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "salida:refs/heads/$RAMA"
          echo "### Publicado en \`$RAMA\`" >> "$GITHUB_STEP_SUMMARY"
