name: Aplicar SQL en PRODUCCIÓN (contabilidad)

# QUÉ HACE (C00, respuestas 6 y 7 de Julio; W01, 08/10: a cualquier hora)
# Aplica en PRODUCCIÓN la tanda DE LA RAMA (C10, 23/10):
# supabase/produccion/tandas/<producto>/<rama>/aplicar.txt (o, en modo
# «vuelta_atras», su vuelta-atras.txt). Cada rama tiene la suya y nadie más la
# edita (scripts/conta/produccion/tanda.mjs). Desde main, la que se nombre en
# «tanda» (una ya fusionada, p. ej. «heredada»).
#
#   · Solo a mano (workflow_dispatch). NUNCA por push. Pide escribir
#     «produccion» en el campo `confirmo`.
#   · SIN FRANJA (W01). Se lanza a cualquier hora: lo que protege lo que está
#     en marcha no es el reloj sino qué hace cada fichero (docs/conta/staging.md,
#     «Producción a cualquier hora»). El informe dice la hora de Madrid.
#   · Comprueba que la URL es la de producción y que al otro lado está Foodint.
#   · YA APLICADO NO SE REAPLICA. Lee el historial de producción
#     (supabase_migrations.schema_migrations): un fichero registrado con la
#     misma huella se quita de la tanda; con otra huella, PARA.
#   · ANALIZA cada sentencia contra lo que existe (scripts/conta/produccion/
#     analizar.mjs, una consulta de solo lectura):
#       añade    → pasa siempre;
#       cambia   → pasa declarado en la cabecera del fichero
#                  («-- cambia: <objeto> · prueba: supabase/staging/sql/…») y con
#                  esa prueba nombrándolo; en el camino del pedido, además
#                  «autorizo»;
#       destruye → solo con «autorizo»; borrar o renombrar, además, sin usos
#                  (base y front) y en su propia tanda.
#     Cada fichero sale «sigue», «AUTORIZO» o «BLOQUEA». Los AUTORIZO se abren
#     escribiendo su NOMBRE ENTERO (sin carpeta) en `autorizo`: dos cerrojos,
#     como la puerta de la prohibida (CLAUDE.md, regla 1). Un BLOQUEA no lo
#     abre nada: se arregla el fichero. Un nombre escrito que no está en la
#     tanda o que no lo necesita también para (un dedo torpe no abre nada).
#   · CAMINO DEL PEDIDO = tablas que EXISTEN y están en CAMINO_TABLAS, las
#     funciones de CAMINO_FUNCIONES y las que esas tablas disparan o llama un
#     cron. Una tabla que crea la propia tanda no lo es, se llame como se llame.
#   · Modo «ensayo»: TODO en una transacción (con el registro en el historial),
#     D1 y recuento dentro, y ROLLBACK. Luego, en otra transacción que también
#     se deshace, ensaya la vuelta atrás: la tanda y sus .down.sql al revés.
#     Una tanda SIN VUELTA ATRÁS a propósito (W02) se declara en el manifiesto
#     («sin-vuelta-atras: <f> · motivo: …» y un «esperado:» por medida; va sola
#     y necesita «autorizo»): en vez de «como antes», el ensayo comprueba que
#     deja exactamente lo esperado (ensayo-sin-vuelta.sh), y para si no.
#   · Modo «real»: solo con un ENSAYO EN VERDE DEL MISMO COMMIT. Un fichero por
#     transacción, con su registro en el historial dentro de la misma. Para al
#     primer fallo. D1 antes y después del fichero que reemplaza vat_rate_for.
#   · DESPUÉS DEL REAL, COMPROBACIÓN: D1, recuento de filas de serie, los
#     agentes de solo lectura (datos maestros y libro diario, antes y después:
#     cuenta lo que se pone en rojo con la tanda, solo entre los medibles en los
#     dos lados; el «antes» es la foto de partida y un agente que aún no puede
#     leer queda «no-medible» sin parar nada; el «después» tiene que poder
#     medirse entero) y la salud del camino del
#     pedido (con 3 o más pedidos en los 15 minutos de antes, en los 15 de
#     después tiene que haber algún cambio de estado). Si algo falla, aplica los
#     .down.sql de lo aplicado en orden inverso (deshacer.sh) y avisa; si la
#     vuelta atrás tampoco pasa, para en rojo con lo que queda a medias.
#   · lock_timeout de 5 s: si un fichero tiene que esperar un cierre, falla en
#     vez de quedarse en cola delante de los pedidos.
#
# LO QUE JULIO HACE UNA VEZ
#   Settings → Secrets and variables → Actions:
#     PROD_CONTA_DB_URL     producción con permiso de escritura (Session pooler).
#                           Solo la usa este workflow.
#     PROD_CONTA_RO_DB_URL  producción con el usuario conta_lectura (la misma de
#                           los agentes nocturnos): para los agentes de después.
#   Las URL no se imprimen: usuario, contraseña y host se enmascaran antes de
#   conectar, y psql nunca las recibe por la línea de órdenes que se ve.
#
# OJO: GitHub solo deja lanzar un workflow_dispatch si el fichero del workflow
# existe en la rama por defecto (main). Ver el informe del PR #138.

run-name: "${{ inputs.modo }} · ${{ github.ref_name }}${{ inputs.tanda && format(' · tanda {0}', inputs.tanda) || '' }} · ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      confirmo:
        description: 'Escribe «produccion» (sin tilde) para confirmar que esto toca PRODUCCIÓN.'
        required: true
        type: string
      modo:
        description: 'ensayo = todo en una transacción y rollback; real = aplica (solo con un ensayo en verde de este mismo commit); vuelta_atras = aplica el vuelta-atras.txt de la tanda'
        required: true
        type: choice
        options: [ensayo, real, vuelta_atras]
        default: ensayo
      tanda:
        description: 'Vacío = la tanda de la rama desde la que se lanza. Desde main, el nombre de la carpeta de la tanda (supabase/produccion/tandas/<producto>/<nombre>), p. ej. «heredada».'
        required: false
        type: string
        default: ''
      autorizo:
        description: 'Solo para los ficheros que el análisis marca AUTORIZO: el nombre ENTERO de cada uno, sin carpeta, separados por espacios. Vacío = ninguno. Un BLOQUEA no se abre aquí.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  # W09: psql y pg_dump dejan de esperar a conectar a los 15 s (el #728 esperó casi una hora).
  PGCONNECT_TIMEOUT: '15'

jobs:
  # W12 · Regla T9 (29/10): el ensayo espera a que acabe la e2e de su rama (tope
  # de 45 min; si se pasa, en rojo). Va aparte y sin la cola de producción:
  # esperar aquí no para los runs de las demás ramas.
  espera-e2e:
    if: inputs.modo == 'ensayo'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Esperar a que acabe la e2e de esta rama (regla T9)
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/esperar-e2e.mjs 45

  # W12 · Regla T10 (29/10): el real lo lanza siempre Julio. El job pide la
  # aprobación del entorno «produccion» (sus revisores: Julio) y no sigue hasta
  # que la da en GitHub. Las sesiones lanzan con la autorización de Julio, así
  # que mirar quién lanza no las distingue (los 40 runs del 27 al 29/10, todos
  # «Llorente29»); esto sí. El ensayo no la necesita.
  aprobacion:
    if: inputs.modo == 'real'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: produccion
    steps:
      - name: Julio ha aprobado el real
        run: echo "Real aprobado en el entorno «produccion» por quien tiene que aprobarlo. Rama ${GITHUB_REF_NAME}, commit ${GITHUB_SHA}."

  aplicar:
    needs: [espera-e2e, aprobacion]
    # Sigue si la espera y la aprobación han ido bien o no tocaban (saltadas).
    if: always() && !cancelled() && needs.espera-e2e.result != 'failure' && needs.aprobacion.result != 'failure'
    runs-on: ubuntu-latest
    # Nunca dos a la vez contra producción (antes, para todo el workflow; desde
    # el W12, solo para el job que aplica: la espera y la aprobación, fuera).
    concurrency:
      group: aplicar-produccion-conta
      cancel-in-progress: false
    # 15 minutos de la lectura de salud del pedido, más la vuelta atrás si toca.
    timeout-minutes: 60
    env:
      PROD_REF: xzmpnchlguibclvxyynt
      STAGING_REF: oseymswjlzplqoxrfjzi
      FOODINT: 51ad1792-6629-4ef7-833a-b57b09a86710
      MODO: ${{ inputs.modo }}
      TANDA_PEDIDA: ${{ inputs.tanda }}
      PSQL: /usr/lib/postgresql/17/bin/psql
      PGAPPNAME: gha-produccion-conta-${{ github.run_id }}
      # D01 R2 (13/10): sin NOTICE (los avisos de una migración pueden llevar
      # valores de filas) y, abajo, psql con VERBOSITY=sqlstate: de un error sale
      # el fichero, la línea y el código, nunca el DETAIL («Key (x)=(…)»,
      # «Failing row contains (…)»). El registro y el resumen son públicos.
      PGOPTIONS: -c lock_timeout=5s -c client_min_messages=warning
      INFORME: /tmp/informe.md
      # La salud del camino del pedido: con SALUD_MINIMO pedidos o más en los
      # SALUD_MINUTOS de antes, en los SALUD_MINUTOS de después tiene que haber
      # algún cambio de estado. Medido sobre 30 días (W01): con 3 o más en 15
      # minutos, la ventana siguiente se queda sin ninguno 1 vez de 532.
      SALUD_MINUTOS: '15'
      SALUD_MINIMO: '3'
      # EL CAMINO DEL PEDIDO, lista explícita (expresiones sobre el nombre con
      # esquema). Solo cuenta lo que EXISTE en producción: una tabla que crea la
      # tanda no está en el camino. Ampliarla es cambiar esta línea, a la vista.
      # fiscal_for_print, desde el 27/10 (Respuesta 1 al V04): la tablet la
      # llama al imprimir cada bolsa.
      CAMINO_TABLAS: '^public\.(sale|sale_.*|sales_.*|order_.*|delivery_.*|dispatch_.*|courier.*|brand_delivery_policy|kds_.*|kitchen_.*|pase_.*|stock_.*|recipe_.*|modifier_.*)$'
      CAMINO_FUNCIONES: '^public\.(_?sale_.*|tg_sale.*|compute_sale.*|_?consum.*|resolve_(dispatch|delivery).*|dispatch.*|delivery.*|courier.*|orders_feed.*|kds_.*|kitchen_.*|pase_.*|_?stock_.*|recipe_.*|modifier_.*|hubrise.*|lastapp.*|fiscal_for_print)(\(|$)'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirmación y modo
        env:
          CONFIRMO: ${{ inputs.confirmo }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMO" != "produccion" ]; then
            echo "::error::Hay que escribir «produccion» en «confirmo». No se hace nada."
            exit 1
          fi
          case "$MODO" in ensayo|real|vuelta_atras) ;; *) echo "::error::Modo desconocido: tiene que ser ensayo, real o vuelta_atras."; exit 1 ;; esac
          {
            echo "# Producción · modo **$MODO**"
            echo
            echo "Rama \`${GITHUB_REF_NAME}\` · commit \`${GITHUB_SHA}\` · lanzado por **${GITHUB_ACTOR}** · $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M') de Madrid (sin franja: W01)"
            echo
          } > "$INFORME"

      - name: Guarda 1 y 2 · el secreto apunta a PRODUCCIÓN y no a staging
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::Falta el secreto PROD_CONTA_DB_URL. No se aplica nada."
            exit 1
          fi
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ["DB_URL"])
          for parte in (os.environ["DB_URL"], u.password, u.username, u.hostname):
              if parte:
                  print(f"::add-mask::{parte}")
          PY
          case "$DB_URL" in *"$STAGING_REF"*) echo "::error::La URL apunta a STAGING. Abortado sin conectar."; exit 1 ;; esac
          case "$DB_URL" in
            *"$PROD_REF"*) echo "La URL es de producción." ;;
            *) echo "::error::La URL no es de producción (no contiene su ref). Abortado sin conectar."; exit 1 ;;
          esac

      - name: Leer y validar el manifiesto
        run: |
          set -euo pipefail
          # R9: el manifiesto declara también qué se cuenta antes y después
          # («cuenta: …»), obligatorio en la tanda de aplicar (manifiesto.sh).
          # C10: la tanda de la rama (o la nombrada en «tanda»), en su carpeta.
          if [ -n "${TANDA_PEDIDA:-}" ] && ! [[ "$TANDA_PEDIDA" =~ ^[A-Za-z0-9._/-]+$ ]]; then echo "::error::«tanda» es el nombre de una carpeta de supabase/produccion/tandas."; exit 1; fi
          node scripts/conta/produccion/tanda.mjs workflow "${TANDA_PEDIDA:-$GITHUB_REF_NAME}" > /tmp/tanda-error.txt 2>&1 || {
            echo "::error::No hay tanda para esta rama en supabase/produccion/tandas/<producto>/<rama>/aplicar.txt (o está en los dos productos). Desde main, di cuál en «tanda»."; exit 1; }
          DIR=$(cat /tmp/tanda-dir.txt)
          if [ "$MODO" = "vuelta_atras" ]; then M=$DIR/vuelta-atras.txt; PAT='^supabase/vuelta-atras/[A-Za-z0-9_./-]+\.down\.sql$'; OBLIG=no
          else M=$DIR/aplicar.txt; PAT='^supabase/migrations/[A-Za-z0-9_./-]+\.sql$'; OBLIG=si; fi
          # W02: y si la tanda va SIN VUELTA ATRÁS, a propósito («sin-vuelta-atras:»),
          # con lo que se espera después («esperado:»). Vacíos si no lo declara.
          bash scripts/conta/produccion/manifiesto.sh "$M" /tmp/tanda.txt /tmp/cuentas.txt "$PAT" "$OBLIG" /tmp/sin-vuelta.txt /tmp/esperado.txt

      - name: Instalar psql 17
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          "$PSQL" --version

      - name: Guarda 3 · al otro lado está Foodint
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          r=$("$PSQL" "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from public.accounts where id = '$FOODINT'")
          if [ "$r" != "1" ]; then
            echo "::error::Al otro lado no está la cuenta de Foodint: NO es producción. Abortado sin aplicar nada."
            exit 1
          fi
          echo "Al otro lado está Foodint: es producción."

      - name: Modo real · hace falta un ensayo en verde de este mismo commit
        if: inputs.modo == 'real'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/aplicar-produccion-conta.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=50" \
                --jq '[.workflow_runs[] | select(.display_title | startswith("ensayo · "))] | length')
          if [ "$n" -lt 1 ]; then
            echo "::error::No hay ningún ENSAYO en verde del commit ${GITHUB_SHA}. Primero el ensayo, luego el real."
            exit 1
          fi
          echo "Hay al menos un ensayo en verde de este commit."
          echo "Ensayo en verde de este mismo commit: sí ($n)." >> "$INFORME"; echo >> "$INFORME"

      - name: Contexto (solo lee) e historial · lo ya aplicado no se reaplica
        if: inputs.modo != 'vuelta_atras'
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          A=scripts/conta/produccion/analizar.mjs
          node "$A" objetivos $(cat /tmp/tanda.txt) > /tmp/objetivos.json
          node "$A" destruidos $(cat /tmp/tanda.txt) > /tmp/destruidos.json
          node "$A" sql-contexto /tmp/objetivos.json /tmp/destruidos.json $(cat /tmp/tanda.txt) > /tmp/contexto.sql
          PGOPTIONS="$PGOPTIONS -c default_transaction_read_only=on" "$PSQL" "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -f /tmp/contexto.sql > /tmp/contexto.json
          node "$A" historial /tmp/contexto.json $(cat /tmp/tanda.txt) > /tmp/historial.json
          # C10: ningún fichero de la tanda repite la fecha, hora y sesión de otro ya aplicado.
          PGOPTIONS="$PGOPTIONS -c default_transaction_read_only=on" "$PSQL" "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select version from supabase_migrations.schema_migrations" > /tmp/versiones.txt
          node scripts/conta/produccion/nombres.mjs produccion /tmp/versiones.txt $(cat /tmp/tanda.txt) > /tmp/nombres.txt 2>&1 || {
            echo "::error::Un fichero de la tanda repite la fecha, hora y sesión de una migración ya aplicada en producción (nombres.mjs): cámbiale el minuto."; exit 1; }
          node -e '
            const h = require("/tmp/historial.json"), fs = require("fs")
            const l = ["## Historial", ""]
            for (const f of h.yaAplicados) l.push(`- \`${f}\`: **ya aplicado** con la misma huella → se quita de la tanda.`)
            for (const d of h.distintos) l.push(`- \`${d.f}\`: **registrado con OTRA huella** (registrada ${d.registrada ?? "ninguna"}, ahora ${d.actual}) → PARA.`)
            if (!h.yaAplicados.length && !h.distintos.length) l.push("Ningún fichero de la tanda está en el historial.")
            fs.appendFileSync(process.env.INFORME, l.join("\n") + "\n\n")
            fs.writeFileSync("/tmp/tanda.txt", h.pendientes.map((x) => x + "\n").join(""))
            if (h.distintos.length) { console.log(`::error::${h.distintos.length} fichero(s) ya aplicados con otra huella: alguien ha cambiado un fichero que ya está en producción. No se aplica nada.`); process.exit(1) }
            console.log(`Pendientes: ${h.pendientes.length}; ya aplicados: ${h.yaAplicados.length}.`)
          ' || { cat "$INFORME" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          if [ ! -s /tmp/tanda.txt ]; then
            echo "Todo lo de la tanda ya está aplicado con la misma huella: no hay nada que aplicar." | tee -a "$INFORME"
            echo "NADA=1" >> "$GITHUB_ENV"
          fi

      - name: Análisis · qué hace cada fichero (sigue, AUTORIZO o BLOQUEA)
        if: inputs.modo != 'vuelta_atras' && env.NADA != '1'
        env:
          AUTORIZO: ${{ inputs.autorizo }}
        run: |
          set -euo pipefail
          A=scripts/conta/produccion/analizar.mjs
          # El front del commit que se aplica: lo que se borra no puede leerlo nadie.
          node "$A" front WORKTREE /tmp/destruidos.json > /tmp/usos-front.json
          set +e
          node "$A" informe /tmp/contexto.json /tmp/usos-front.json $(cat /tmp/tanda.txt) > /tmp/analisis.md
          set -e
          grep -v '^VAT_RATE_FOR_EN:' /tmp/analisis.md >> "$INFORME"
          sed -n 's/^VAT_RATE_FOR_EN: //p' /tmp/analisis.md | sed 's/(ninguno)//' > /tmp/vat_rate_for_en.txt
          sed -n 's/^### `\([^`]*\)` — \*\*AUTORIZO\*\*$/\1/p' /tmp/analisis.md > /tmp/autorizables.txt
          sed -n 's/^### `\([^`]*\)` — \*\*BLOQUEA\*\*$/\1/p' /tmp/analisis.md > /tmp/bloquean.txt
          # W02: una tanda SIN VUELTA ATRÁS declarada necesita «autorizo» siempre,
          # diga lo que diga el análisis (un BLOQUEA sigue bloqueando).
          if [ -s /tmp/sin-vuelta.txt ]; then cut -f1 /tmp/sin-vuelta.txt >> /tmp/autorizables.txt; sort -u -o /tmp/autorizables.txt /tmp/autorizables.txt; fi
          # Lo autorizado: nombres enteros, sin carpeta, uno por línea.
          set -f; printf '%s\n' $AUTORIZO | sed '/^$/d' > /tmp/autorizo.txt; set +f
          mal=0
          while IFS= read -r f; do echo "::error::BLOQUEA (no lo abre «autorizo»; se arregla el fichero): $(basename -- "$f")"; mal=1; done < /tmp/bloquean.txt
          while IFS= read -r n; do
            if [ "$n" != "$(basename -- "$n")" ]; then echo "::error::«$n»: va el nombre sin carpeta."; mal=1; continue; fi
            if ! grep -qxF "supabase/migrations/$n" /tmp/tanda.txt; then echo "::error::Autorizas «$n», pero no está en la tanda (o ya estaba aplicado)."; mal=1; continue; fi
            if ! grep -qxF "supabase/migrations/$n" /tmp/autorizables.txt; then echo "::error::Autorizas «$n», pero no lo necesita: quítalo."; mal=1; fi
          done < /tmp/autorizo.txt
          while IFS= read -r f; do
            grep -qxF "$(basename -- "$f")" /tmp/autorizo.txt || { echo "::error::Necesita «autorizo» y no está escrito: $(basename -- "$f")"; mal=1; }
          done < /tmp/autorizables.txt
          if [ "$mal" -ne 0 ]; then
            echo "::error::El análisis PARA. No se aplica nada. Ver el informe."
            cat "$INFORME" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -s /tmp/autorizables.txt ]; then
            { echo "## Autorizados a mano"; echo
              echo "Estos ficheros necesitaban «autorizo» y se aplican porque **${GITHUB_ACTOR}** los nombró enteros, desde la rama \`${GITHUB_REF_NAME}\`:"; echo
              while IFS= read -r f; do echo "- \`$f\` (md5 \`$(md5sum "$f" | cut -d' ' -f1)\`)"; done < /tmp/autorizables.txt; echo; } >> "$INFORME"
          fi

      - name: Antes · D1, salud del pedido y agentes
        if: env.NADA != '1'
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
          RO_DB_URL: ${{ secrets.PROD_CONTA_RO_DB_URL }}
        run: |
          set -euo pipefail
          "$PSQL" "$DB_URL" -X -v ON_ERROR_STOP=1 --csv -t -f scripts/conta/produccion/d1.sql > /tmp/d1-antes.csv
          { echo "## Antes"; echo; echo "D1: $(wc -l < /tmp/d1-antes.csv) pares categoría × día leídos de \`vat_rate_for\`."; } >> "$INFORME"
          # R9: el recuento de serie y lo que la tanda declara que cuenta, ANTES:
          # con esto se compara lo que quede si la tanda se deshace.
          "$PSQL" "$DB_URL" -X -v ON_ERROR_STOP=1 --csv -t -f scripts/conta/produccion/recuento-serie.sql > /tmp/recuento-antes.csv
          bash scripts/conta/produccion/cuentas.sh /tmp/cuentas.txt /tmp/cuentas-antes.csv
          if [ -s /tmp/cuentas.txt ]; then
            { echo; echo "Lo que la tanda declara que cuenta ($(paste -sd' ' /tmp/cuentas.txt | sed 's#scripts/conta/produccion/cuentas/##g')), antes:"; echo
              node scripts/conta/produccion/cuentas-comparar.mjs /tmp/cuentas-antes.csv; echo; } >> "$INFORME"
          fi
          if [ "$MODO" = "real" ]; then
            t0=$("$PSQL" "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select now()")
            echo "T0=$t0" >> "$GITHUB_ENV"
            # Todas las cuentas: una fila por cuenta con servicio (SALUD_MINIMO o más pedidos en la ventana).
            "$PSQL" "$DB_URL" -X -A -t -F' ' -v ON_ERROR_STOP=1 -v t0="$t0" -v t="$t0" -v minutos="$SALUD_MINUTOS" -v minimo="$SALUD_MINIMO" -f scripts/conta/produccion/salud-pedido.sql > /tmp/salud-antes.txt
            cuentas=$(grep -c . /tmp/salud-antes.txt || true)
            entrados=$(awk '{s+=$2} END {print s+0}' /tmp/salud-antes.txt)
            echo "ENTRADOS_ANTES=$entrados" >> "$GITHUB_ENV"
            echo "CUENTAS_CON_SERVICIO=$cuentas" >> "$GITHUB_ENV"
            if [ "$cuentas" -gt 0 ]; then
              echo "- Cuentas con servicio (≥ $SALUD_MINIMO pedidos en los $SALUD_MINUTOS minutos de antes): **$cuentas**, con **$entrados** pedidos entre todas (después se mide si siguen avanzando). Por cuenta: $(awk '{printf "%s%s… %s", (NR>1?"; ":""), substr($1,1,8), $2}' /tmp/salud-antes.txt)." >> "$INFORME"
            else
              echo "- Ninguna cuenta con $SALUD_MINIMO o más pedidos en los $SALUD_MINUTOS minutos de antes: sin servicio, la salud no se mide." >> "$INFORME"
            fi
            # Los agentes de solo lectura, con conta_lectura.
            if [ -z "${RO_DB_URL:-}" ]; then echo "::error::Falta el secreto PROD_CONTA_RO_DB_URL (los agentes de después)."; exit 1; fi
            python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ["RO_DB_URL"])
          for parte in (os.environ["RO_DB_URL"], u.password, u.hostname):
              if parte:
                  print(f"::add-mask::{parte}")
          if (u.username or "").split(".")[0] != "conta_lectura":
              print("::error::El usuario de PROD_CONTA_RO_DB_URL no es conta_lectura.")
              raise SystemExit(1)
          if os.environ["PROD_REF"] not in os.environ["RO_DB_URL"] or os.environ["STAGING_REF"] in os.environ["RO_DB_URL"]:
              print("::error::PROD_CONTA_RO_DB_URL no es la de producción.")
              raise SystemExit(1)
          PY
            # La foto de partida, NO una guarda (C04 R4, 08/10): un agente que no puede
            # leer antes de la tanda (la tanda le da el permiso) queda «no-medible» con
            # su motivo y se sigue. D1 y la salud del pedido, arriba, sí son guardas.
            bash scripts/conta/produccion/agentes.sh antes
            { echo "- Agentes antes (foto de partida; «no-medible» no para):"
              awk -F'\t' '{printf "  - %s: %s%s\n", $1, $2, ($3 != "" ? " — " $3 : "")}' /tmp/agentes-antes.txt; } >> "$INFORME"
          fi
          echo >> "$INFORME"

      - name: ENSAYO · todo en una transacción, con el registro en el historial, y ROLLBACK
        if: inputs.modo == 'ensayo' && env.NADA != '1'
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          {
            echo '\set ON_ERROR_STOP 1'
            echo 'begin;'
            i=0
            while IFS= read -r f; do
              i=$((i+1))
              node scripts/conta/produccion/analizar.mjs registro "$f" "ensayo ${GITHUB_RUN_ID} · ${GITHUB_ACTOR}" > "/tmp/registro-$i.sql"
              echo "\\echo '>>> [$i] $f'"
              echo "\\i $f"
              echo "\\i /tmp/registro-$i.sql"
            done < /tmp/tanda.txt
            echo "\\echo '>>> D1 y recuento, dentro de la transacción'"
            echo '\pset format csv'
            echo '\pset tuples_only on'
            echo '\o /tmp/d1-despues.csv'
            echo '\i scripts/conta/produccion/d1.sql'
            echo '\o /tmp/recuento-despues.csv'
            echo '\i scripts/conta/produccion/recuento-serie.sql'
            # R9: lo que la tanda declara que cuenta, con la tanda puesta.
            j=0; while IFS= read -r c; do j=$((j+1)); echo "\\o /tmp/cuentas-ensayo-$j.csv"; echo "\\i $c"; done < /tmp/cuentas.txt
            echo '\o'
            echo 'rollback;'
            echo "\\echo '>>> ROLLBACK: no queda nada.'"
          } > /tmp/ensayo.sql
          set +e
          "$PSQL" "$DB_URL" -X -v VERBOSITY=sqlstate -f /tmp/ensayo.sql > /tmp/ensayo.log 2>&1
          rc=$?
          set -e
          grep -E '^>>>|ERROR' /tmp/ensayo.log | head -200
          if [ "$rc" -ne 0 ]; then
            ult=$(grep '^>>>' /tmp/ensayo.log | tail -1)
            { echo "## Ensayo: **FALLA**"; echo; echo "Falló en: \`$ult\`. La conexión se cerró sin commit: no ha quedado nada."; echo; echo '```'; grep -E 'ERROR' /tmp/ensayo.log | head -20; echo '```'; } >> "$INFORME"
            cat "$INFORME" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::El ensayo falla en: $ult"
            exit 1
          fi
          set +e
          node scripts/conta/produccion/d1-comparar.mjs /tmp/d1-antes.csv /tmp/d1-despues.csv > /tmp/d1.txt
          d1=$?
          set -e
          : > /tmp/cuentas-con-tanda.csv; j=0
          while IFS= read -r c; do j=$((j+1)); sed "s#^#$(basename "$c" .sql),#" "/tmp/cuentas-ensayo-$j.csv" >> /tmp/cuentas-con-tanda.csv; done < /tmp/cuentas.txt
          { echo "## Ensayo: todo entra"; echo; echo "Los $(wc -l < /tmp/tanda.txt) ficheros, con su registro en el historial, en una transacción, y **ROLLBACK**: en producción no ha quedado nada."; echo
            echo "**D1 (antes ↔ con la tanda):** $(head -1 /tmp/d1.txt)"; tail -n +2 /tmp/d1.txt; echo
            echo "**Filas de serie con la tanda:**"; echo; echo '| Tabla | Filas |'; echo '|---|---|'
            sed -E 's/^([^,]*),(.*)$/| \1 | \2 |/' /tmp/recuento-despues.csv; echo
            echo "**Lo que la tanda declara que cuenta (antes ↔ con la tanda; aquí cambiar es lo esperado, se enseña para que se vea qué hace):**"; echo
            node scripts/conta/produccion/cuentas-comparar.mjs /tmp/cuentas-antes.csv /tmp/cuentas-con-tanda.csv "Antes" "Con la tanda" | sed '$d' || true; echo
            # R9 · Lo que el ensayo NO ve y el real sí (lista de antes de subir).
            echo "**Lo que este ensayo NO mira y el real sí** (un ensayo en verde no garantiza el real si la comprobación de después mira algo que el ensayo no ve):"; echo
            echo "- **Los agentes de después** (\`conta_lectura\`, otra conexión): no ven una transacción sin commit, así que en el ensayo no corren. El 13/10 el real se deshizo por el agente del libro, que vio 22 días×local sin asiento que el ensayo no podía ver."
            echo "- **La salud del pedido** de los $SALUD_MINUTOS minutos de después: en el ensayo no pasa el tiempo."
            echo "- **Lo que hacen otros procesos después** (el cierre del día a los :07, los disparadores de los pedidos que entren): el ensayo acaba antes. Por eso una tanda no deja huecos para que los tape otro proceso más tarde: se rehace en la misma transacción."
            echo; } >> "$INFORME"
          if [ "$d1" -ne 0 ]; then echo "::error::D1 da diferencias no decididas."; cat "$INFORME" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi

      - name: ENSAYO · la vuelta atrás automática funcionaría (tanda y .down.sql al revés, y ROLLBACK)
        if: inputs.modo == 'ensayo' && env.NADA != '1'
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          # W02: una tanda SIN VUELTA ATRÁS declarada (manifiesto.sh) no puede salir
          # «como antes»: no hay con qué deshacerla. Se compara, en su lugar, con lo
          # que el manifiesto dice que dejará («esperado:»), y si no, para igual.
          # Para cualquier otra tanda, este paso sigue exactamente como estaba, debajo.
          if [ -s /tmp/sin-vuelta.txt ]; then
            bash scripts/conta/produccion/ensayo-sin-vuelta.sh /tmp/tanda.txt /tmp/cuentas.txt /tmp/sin-vuelta.txt /tmp/esperado.txt /tmp/cuentas-antes.csv \
              || { cat "$INFORME" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
            exit 0
          fi
          sin=""
          {
            echo '\set ON_ERROR_STOP 1'
            echo 'begin;'
            while IFS= read -r f; do echo "\\i $f"; done < /tmp/tanda.txt
            tac /tmp/tanda.txt | while IFS= read -r f; do
              d="supabase/vuelta-atras/$(basename "$f" .sql).down.sql"
              if [ -f "$d" ]; then echo "\\echo '>>> deshace $f'"; echo "\\i $d"; else echo "\\echo '>>> SIN VUELTA ATRÁS: $f'"; fi
            done
            # R9: deshecha la tanda, ¿está como antes? Lo mismo que contará deshacer.sh.
            echo '\pset format csv'
            echo '\pset tuples_only on'
            j=0; while IFS= read -r c; do j=$((j+1)); echo "\\o /tmp/cuentas-atras-$j.csv"; echo "\\i $c"; done < /tmp/cuentas.txt
            echo '\o'
            echo 'rollback;'
          } > /tmp/ensayo-atras.sql
          while IFS= read -r f; do [ -f "supabase/vuelta-atras/$(basename "$f" .sql).down.sql" ] || sin="$sin \`$f\`"; done < /tmp/tanda.txt
          set +e
          "$PSQL" "$DB_URL" -X -v VERBOSITY=sqlstate -f /tmp/ensayo-atras.sql > /tmp/ensayo-atras.log 2>&1
          rc=$?
          set -e
          igual=1
          if [ "$rc" -eq 0 ]; then
            : > /tmp/cuentas-ensayo-atras.csv; j=0
            while IFS= read -r c; do j=$((j+1)); sed "s#^#$(basename "$c" .sql),#" "/tmp/cuentas-atras-$j.csv" >> /tmp/cuentas-ensayo-atras.csv; done < /tmp/cuentas.txt
            node scripts/conta/produccion/cuentas-comparar.mjs /tmp/cuentas-antes.csv /tmp/cuentas-ensayo-atras.csv "Antes de la tanda" "Tanda y vuelta atrás" > /tmp/cuentas-atras.md || igual=0
            # W06 (26/10): la misma tabla, TAMBIÉN al registro del job, que es lo único
            # que se lee desde una sesión (el #241 no se pudo leer). Por la puerta de
            # salida (D01 R2): cada medida por su fila en la cuenta («<cuenta>.<n>»),
            # con antes y después si son números o huellas, y «distinta 1» si no
            # coincide. Solo añade salida: no cambia lo que se compara ni cuándo para.
            node scripts/conta/produccion/cuentas-salida.mjs /tmp/cuentas-antes.csv /tmp/cuentas-ensayo-atras.csv | node scripts/conta/salida-segura.mjs || true
          fi
          if [ "$rc" -eq 0 ] && [ -z "$sin" ] && [ "$igual" -eq 1 ]; then
            { echo "## Ensayo de la vuelta atrás: **funcionaría, y deja todo como estaba**"; echo; echo "La tanda y sus .down.sql en orden inverso, en una transacción, y ROLLBACK. Lo que la tanda declara que cuenta sale igual que antes:"; echo
              cat /tmp/cuentas-atras.md; echo; } >> "$INFORME"
          elif [ "$rc" -eq 0 ] && [ "$igual" -eq 0 ]; then
            # R9: una vuelta atrás que no deja los datos como estaban NO es una vuelta atrás. Para.
            { echo "## Ensayo de la vuelta atrás: **NO deja los datos como estaban**"; echo
              echo "Los .down.sql entran sin error, pero lo que la tanda declara que cuenta no sale igual que antes. Si el real se deshiciera solo, quedaría así:"; echo
              cat /tmp/cuentas-atras.md; echo; } >> "$INFORME"
            echo "::error::La vuelta atrás de esta tanda no deja los datos como estaban (ver el informe). El ensayo para: así no se lanza el real."
            cat "$INFORME" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            { echo "## Ensayo de la vuelta atrás: **NO estaría completa**"; echo
              [ -n "$sin" ] && echo "- Sin \`.down.sql\`:$sin. Si la comprobación de después falla, eso y lo anterior quedarían aplicados."
              [ "$rc" -ne 0 ] && { echo "- Falla en \`$(grep '^>>>' /tmp/ensayo-atras.log | tail -1)\`:"; echo; echo '```'; grep -E 'ERROR' /tmp/ensayo-atras.log | head -10; echo '```'; }
              echo; } >> "$INFORME"
            echo "::warning::La vuelta atrás automática no estaría completa: ver el informe."
          fi

      - name: REAL · fichero a fichero, cada uno con su registro, para al primer fallo
        timeout-minutes: 15
        id: real
        if: (inputs.modo == 'real' || inputs.modo == 'vuelta_atras') && env.NADA != '1'
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -uo pipefail
          { echo "## Aplicación"; echo; echo '| # | Fichero | md5 | Resultado |'; echo '|---|---|---|---|'; } >> "$INFORME"
          vrf=" $(cat /tmp/vat_rate_for_en.txt 2>/dev/null || true) "
          : > /tmp/aplicados.txt
          i=0; fallo=0
          while IFS= read -r f; do
            i=$((i+1)); md5=$(md5sum "$f" | cut -d' ' -f1)
            if [ "$fallo" -ne 0 ]; then echo "| $i | \`$f\` | \`$md5\` | no aplicado (paró antes) |" >> "$INFORME"; continue; fi
            # El historial va en la MISMA transacción que el fichero: o los dos o ninguno.
            if [ "$MODO" = "vuelta_atras" ]; then node scripts/conta/produccion/analizar.mjs baja "$f" > /tmp/registro.sql
            else node scripts/conta/produccion/analizar.mjs registro "$f" "real ${GITHUB_RUN_ID} · ${GITHUB_ACTOR}" > /tmp/registro.sql; fi
            echo "::group::[$i] $f (md5 $md5)"
            if "$PSQL" "$DB_URL" -X -q -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate -1 -f "$f" -f /tmp/registro.sql 2>&1 | grep -E 'ERROR' ; [ "${PIPESTATUS[0]}" -eq 0 ]; then
              echo "::endgroup::"
              echo "$f" >> /tmp/aplicados.txt
              echo "| $i | \`$f\` | \`$md5\` | **aplicado** $(TZ=Europe/Madrid date +%H:%M:%S) |" >> "$INFORME"
            else
              echo "::endgroup::"
              echo "::error::FALLÓ [$i] $f — revertido entero. Los siguientes no se aplican."
              echo "| $i | \`$f\` | \`$md5\` | **FALLÓ, revertido entero** |" >> "$INFORME"; fallo=1; continue
            fi
            # D1 justo después del fichero que reemplaza vat_rate_for: si cambia algo, para.
            case "$vrf" in *" $f "*)
              "$PSQL" "$DB_URL" -X -v ON_ERROR_STOP=1 --csv -t -f scripts/conta/produccion/d1.sql > /tmp/d1-tras-vrf.csv
              if node scripts/conta/produccion/d1-comparar.mjs /tmp/d1-antes.csv /tmp/d1-tras-vrf.csv > /tmp/d1-vrf.txt; then
                echo "| | D1 tras \`$(basename "$f")\` | | $(head -1 /tmp/d1-vrf.txt) |" >> "$INFORME"
              else
                echo "| | D1 tras \`$(basename "$f")\` | | **DIFERENCIAS: para** · $(head -1 /tmp/d1-vrf.txt) |" >> "$INFORME"
                echo "::error::D1 da diferencias tras $f. No se aplica nada más."; cat /tmp/d1-vrf.txt; fallo=1
              fi ;;
            esac
          done < /tmp/tanda.txt
          echo >> "$INFORME"
          echo "T1=$("$PSQL" "$DB_URL" -X -A -t -c 'select now()')" >> "$GITHUB_ENV"
          exit "$fallo"

      - name: Después · comprobación (D1, serie, agentes y salud del pedido); si falla, vuelta atrás automática
        timeout-minutes: 25
        id: despues
        # Solo si el REAL llegó a correr (aunque fallara a medias): no tras un análisis que para.
        if: always() && inputs.modo == 'real' && steps.real.outcome != 'skipped' && steps.real.outcome != ''
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
          RO_DB_URL: ${{ secrets.PROD_CONTA_RO_DB_URL }}
          # R9: deshacer.sh vuelve a contar lo que la tanda declara y lo compara con el «antes».
          CUENTAS: /tmp/cuentas.txt
          # W02: lo declarado sin vuelta atrás (deshacer.sh lo dice así, y queda aplicado).
          SIN_VUELTA: /tmp/sin-vuelta.txt
          CUENTAS_ANTES: /tmp/cuentas-antes.csv
        run: |
          set -uo pipefail
          [ -s /tmp/aplicados.txt ] || { echo "No se aplicó nada: no hay nada que comprobar."; exit 1; }
          mal=""
          # 1. D1 y recuento de filas de serie.
          "$PSQL" "$DB_URL" -X -v ON_ERROR_STOP=1 --csv -t -f scripts/conta/produccion/d1.sql > /tmp/d1-despues.csv
          node scripts/conta/produccion/d1-comparar.mjs /tmp/d1-antes.csv /tmp/d1-despues.csv > /tmp/d1.txt || mal="$mal D1"
          { echo "## Después"; echo; echo "**D1 (antes ↔ después):** $(head -1 /tmp/d1.txt)"; tail -n +2 /tmp/d1.txt; echo; } >> "$INFORME"
          if "$PSQL" "$DB_URL" -X -v ON_ERROR_STOP=1 --csv -t -f scripts/conta/produccion/recuento-serie.sql > /tmp/recuento.csv 2>/tmp/recuento.err; then
            { echo "**Filas de serie:**"; echo; echo '| Tabla | Filas |'; echo '|---|---|'; sed -E 's/^([^,]*),(.*)$/| \1 | \2 |/' /tmp/recuento.csv; echo; } >> "$INFORME"
          else
            mal="$mal recuento"; { echo "**Filas de serie:** no se han podido contar ($(head -1 /tmp/recuento.err))."; echo; } >> "$INFORME"
          fi
          # 2. Los agentes. El «después» es obligatorio: todos tienen que poder medirse
          # (agentes.sh sale con 2 si no). Lo que cuenta es lo que se pone en rojo con
          # la tanda, y solo entre agentes medibles en los dos lados (agentes-comparar.mjs).
          bash scripts/conta/produccion/agentes.sh despues || mal="$mal agentes-no-corren-despues"
          node scripts/conta/produccion/agentes-comparar.mjs /tmp/agentes-antes.txt /tmp/agentes-despues.txt > /tmp/agentes.md || mal="$mal agentes"
          cat /tmp/agentes.md >> "$INFORME"
          # 3. La salud del camino del pedido.
          if [ "${CUENTAS_CON_SERVICIO:-0}" -gt 0 ]; then
            hasta=$(( $(date -u -d "$T1" +%s) + SALUD_MINUTOS * 60 ))
            while [ "$(date -u +%s)" -lt "$hasta" ]; do sleep 30; done
            # Las mismas cuentas («entrados» se mide antes de T0) y sus cambios de estado desde el final del real.
            "$PSQL" "$DB_URL" -X -A -t -F' ' -v ON_ERROR_STOP=1 -v t0="$T0" -v t="$T1" -v minutos="$SALUD_MINUTOS" -v minimo="$SALUD_MINIMO" -f scripts/conta/produccion/salud-pedido.sql > /tmp/salud-despues.txt
            movidos=$(awk '{s+=$3} END {print s+0}' /tmp/salud-despues.txt)
            quietas=$(awk '$3 == 0 {printf "%s%s…", (n++?", ":""), substr($1,1,8)}' /tmp/salud-despues.txt)
            echo "- Salud del pedido, sumando las $CUENTAS_CON_SERVICIO cuentas con servicio: $ENTRADOS_ANTES pedidos en los $SALUD_MINUTOS minutos de antes; **$movidos** cambios de estado en los $SALUD_MINUTOS de después.$([ -n "$quietas" ] && echo " Sin ningún cambio: $quietas (se dice; la suma es la que decide).")" >> "$INFORME"
            [ "$movidos" -ge 1 ] || mal="$mal salud-del-pedido"
          else
            echo "- Salud del pedido: ninguna cuenta con servicio (≥ $SALUD_MINIMO pedidos en los $SALUD_MINUTOS minutos de antes): no se mide." >> "$INFORME"
          fi
          echo >> "$INFORME"
          if [ -z "$mal" ]; then echo "**Comprobación en verde.**" >> "$INFORME"; exit 0; fi
          # 4. Falla algo: vuelta atrás de lo que ha aplicado ESTE run, en orden inverso.
          { echo "**Comprobación en ROJO:**$mal. Se deshace lo aplicado."; echo; } >> "$INFORME"
          echo "::error::La comprobación de después falla:$mal. Vuelta atrás automática."
          bash scripts/conta/produccion/deshacer.sh /tmp/aplicados.txt; rc=$?
          # R9: «está como antes» solo si deshacer.sh lo ha CONTADO (sale con 0).
          case "$rc" in
            0) echo "::error::Vuelta atrás hecha y contada: producción está como antes de la tanda ($(grep -c . /tmp/cuentas-antes.csv) medidas iguales). Ver el informe." ;;
            3) echo "::error::Vuelta atrás aplicada, pero producción NO está como antes: $(node scripts/conta/produccion/cuentas-comparar.mjs /tmp/cuentas-antes.csv /tmp/cuentas-tras-deshacer.csv | tail -1). Ver «¿Está como antes de la tanda?» en el informe." ;;
            *) echo "::error::LA VUELTA ATRÁS NO SE HA COMPLETADO: hay cosas aplicadas a medias. Ver la tabla «Vuelta atrás automática» del informe." ;;
          esac
          exit 1

      - name: Después de la vuelta atrás · D1 y recuento
        timeout-minutes: 15
        # En modo vuelta_atras, y también cuando un REAL se deshace solo (R9):
        # la comprobación de después falló y deshacer.sh ha corrido.
        if: >-
          always() && steps.real.outcome != 'skipped' && steps.real.outcome != '' &&
          (inputs.modo == 'vuelta_atras' || (inputs.modo == 'real' && steps.despues.outcome == 'failure'))
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -uo pipefail
          "$PSQL" "$DB_URL" -X -v ON_ERROR_STOP=1 --csv -t -f scripts/conta/produccion/d1.sql > /tmp/d1-despues.csv
          node scripts/conta/produccion/d1-comparar.mjs /tmp/d1-antes.csv /tmp/d1-despues.csv > /tmp/d1.txt; d1=$?
          "$PSQL" "$DB_URL" -X -v ON_ERROR_STOP=1 --csv -t -f scripts/conta/produccion/recuento-serie.sql > /tmp/recuento-tras.csv; rr=$?
          igual=1; cmp -s /tmp/recuento-antes.csv /tmp/recuento-tras.csv || igual=0
          { echo "## Después de la vuelta atrás"; echo; echo "**D1 (antes ↔ después):** $(head -1 /tmp/d1.txt)"; tail -n +2 /tmp/d1.txt; echo
            echo "**Filas de serie (antes ↔ después):** $([ "$igual" -eq 1 ] && echo "iguales" || echo "**distintas**")"; echo
            echo '| Tabla | Antes | Después |'; echo '|---|---|---|'
            join -t, -a1 -a2 -e '—' -o 0,1.2,2.2 <(sort /tmp/recuento-antes.csv) <(sort /tmp/recuento-tras.csv) | sed -E 's/^([^,]*),([^,]*),(.*)$/| \1 | \2 | \3 |/'; echo
            if [ "$MODO" = "vuelta_atras" ] && [ -s /tmp/cuentas.txt ]; then
              # En el modo vuelta_atras cambiar es lo esperado: se enseña, no para.
              bash scripts/conta/produccion/cuentas.sh /tmp/cuentas.txt /tmp/cuentas-tras.csv && {
                echo "**Lo que el manifiesto declara que cuenta (antes ↔ después de la vuelta atrás; cambiar es lo esperado):**"; echo
                node scripts/conta/produccion/cuentas-comparar.mjs /tmp/cuentas-antes.csv /tmp/cuentas-tras.csv "Antes" "Después" | sed '$d'; echo; }
            fi; } >> "$INFORME"
          [ "$d1" -eq 0 ] || exit "$d1"
          [ "$rr" -eq 0 ] || exit 1
          # Un real deshecho solo tiene que dejar las filas de serie como estaban.
          if [ "$MODO" = "real" ] && [ "$igual" -eq 0 ]; then echo "::error::Tras la vuelta atrás automática, las filas de serie no son las de antes."; exit 1; fi
          exit 0

      - name: Informe
        if: always()
        run: |
          [ -f "$INFORME" ] && cat "$INFORME" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-produccion-${{ inputs.modo }}-${{ github.run_id }}
          path: /tmp/informe.md
          if-no-files-found: warn
          retention-days: 90
