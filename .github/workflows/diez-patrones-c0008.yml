name: Diez · patrones de las facturas de ventas en C0008 (solo lectura)

# QUÉ HACE (C06b, 15/10)
# Mide, solo con GET, cómo numera la gestoría en C0008 las facturas diarias
# de Glovo y de Just Eat (y Uber como testigo), para que Folvy las mande igual
# (scripts/conta/diez/patrones-ventas-c0008.ts). El cliente de Diez se crea con
# escribir: false.
#
# QUÉ SALE: solo «@@ clave número|huella», por scripts/conta/salida-segura.mjs
# (D01 R2): ni números de factura, ni descripciones, ni nombres, ni importes.
#
# CUÁNDO: al empujar a la rama del encargo un commit cuyo mensaje EMPIECE por
# «[patrones-c0008]».

on:
  push:
    branches: ['conta/c06b-patrones-numeracion']

concurrency:
  group: diez-lectura
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  patrones:
    if: startsWith(github.event.head_commit.message, '[patrones-c0008]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enmascarar el secreto
        env:
          DIEZ_LECTURA: ${{ secrets.DIEZ_LECTURA }}
        run: |
          set -euo pipefail
          [ -n "$DIEZ_LECTURA" ] || { echo "::error::Falta el secreto DIEZ_LECTURA. No se lee nada."; exit 1; }
          jq -r '.[] | tostring' <<<"$DIEZ_LECTURA" | while IFS= read -r v; do [ -n "$v" ] && echo "::add-mask::$v"; done
      - name: Medir en C0008 (solo GET)
        env:
          DIEZ_LECTURA: ${{ secrets.DIEZ_LECTURA }}
        run: |
          set -euo pipefail
          npx --yes tsx@4.19.2 scripts/conta/diez/patrones-ventas-c0008.ts 2>&1 | node scripts/conta/salida-segura.mjs | tee -a "$GITHUB_STEP_SUMMARY"
