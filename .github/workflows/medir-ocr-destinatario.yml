name: Medir el NIF del destinatario (ocr-albaran)

# QUÉ HACE (Compras, tarea 2c, 10/10)
# Julio pidió que el lector de recepciones lea un campo nuevo, el NIF del
# DESTINATARIO, sin cambiar los demás, y que se mida antes y después con las
# fotos de octubre.
#
# Las fotos están en el almacenamiento de producción y la IA solo la llama la
# función desplegada, así que la medida la hace la propia función en modo
# MEDIR: relee cada papel DOS VECES en la misma llamada, con el prompt de
# antes (byte a byte el de main antes del cambio) y con el de ahora, y dice
# qué campos salen distintos. La misma vara a los dos lados (regla 31). No
# guarda nada.
#
# CUÁNDO: después de fusionar, cuando el despliegue de ocr-albaran esté hecho
# (si no, la función contesta como antes y este workflow PARA diciéndolo).
#
# QUÉ NO SALE AQUÍ: ni nombres ni NIF. El repositorio es público y este
# resumen también. Sale el código de la recepción (ALB-…), los campos que
# cambian, y del NIF del destinatario solo a quién corresponde.
#
# Usa el secreto SUPABASE_ACCESS_TOKEN (el del despliegue) para pedir la clave
# de servicio a la Management API en el momento, enmascarada; no hay secreto
# nuevo. Cuesta dos lecturas de IA por recepción.

on:
  workflow_dispatch:
    inputs:
      cuenta:
        description: 'Cuenta (account_id). Por defecto, Foodint.'
        required: true
        default: '51ad1792-6629-4ef7-833a-b57b09a86710'
      desde:
        description: 'Recepciones confirmadas desde este día (AAAA-MM-DD).'
        required: true
        default: '2026-10-01'

concurrency:
  group: medir-ocr-destinatario
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Proyecto y clave (enmascarada)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF=$(grep -E '^\s*project_id\s*=' supabase/config.toml | head -1 | sed -E 's/.*=\s*"?([a-z0-9]+)"?.*/\1/')
          [ -n "$REF" ] || { echo "::error::No se pudo leer project_id de supabase/config.toml."; exit 1; }
          KEY=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" \
                | jq -r '.[] | select(.name == "service_role") | .api_key' | head -1)
          [ -n "$KEY" ] && [ "$KEY" != "null" ] || { echo "::error::No se pudo obtener la clave de servicio."; exit 1; }
          echo "::add-mask::$KEY"
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "KEY=$KEY" >> "$GITHUB_ENV"

      - name: Las recepciones a medir (solo lectura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CUENTA: ${{ inputs.cuenta }}
          DESDE: ${{ inputs.desde }}
        run: |
          set -euo pipefail
          [[ "$CUENTA" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::La cuenta no es un uuid."; exit 1; }
          [[ "$DESDE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::La fecha no es AAAA-MM-DD."; exit 1; }
          SQL="select a.id, g.code from goods_receipt g join goods_receipt_ai_session a on a.id = g.ai_session_id
               where g.account_id = '$CUENTA' and g.status = 'confirmado' and g.receipt_date >= '$DESDE'
               order by g.receipt_date, g.code"
          jq -n --arg q "$SQL" '{query: $q, read_only: true}' > /tmp/q.json
          curl -sf -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
               --data @/tmp/q.json "https://api.supabase.com/v1/projects/$REF/database/query" > /tmp/sesiones.json
          echo "Recepciones con papel leído: $(jq length /tmp/sesiones.json)"

      - name: Releer cada papel con los dos prompts
        env:
          CUENTA: ${{ inputs.cuenta }}
        run: |
          set -euo pipefail
          : > /tmp/medidas.jsonl
          n=0
          while read -r fila; do
            id=$(jq -r .id <<<"$fila"); code=$(jq -r .code <<<"$fila")
            out=$(curl -s -X POST "https://$REF.supabase.co/functions/v1/ocr-albaran" \
                    -H "Authorization: Bearer $KEY" -H "x-internal-key: $KEY" -H 'Content-Type: application/json' \
                    --data "$(jq -n --arg c "$CUENTA" --arg s "$id" '{account_id: $c, medir_sesiones: [$s]}')" || true)
            if ! jq -e '.medidas' >/dev/null 2>&1 <<<"$out"; then
              if [ "$n" -eq 0 ]; then
                echo "::error::La función desplegada no contesta en modo MEDIR: todavía no está desplegada la versión nueva de ocr-albaran. No se mide nada."
                exit 1
              fi
              jq -nc --arg code "$code" '{code: $code, error: "sin respuesta"}' >> /tmp/medidas.jsonl
            else
              jq -c --arg code "$code" '.medidas[0] + {code: $code} | del(.sesion)' <<<"$out" >> /tmp/medidas.jsonl
            fi
            n=$((n+1))
          done < <(jq -c '.[]' /tmp/sesiones.json)
          echo "Medidas: $n"

      - name: Resumen
        run: |
          set -euo pipefail
          {
            echo "## El NIF del destinatario, antes y después"
            echo
            echo "Cada papel leído dos veces en la misma llamada: con el prompt de antes y con el de ahora."
            echo
            echo "| Recepción | Campos que cambian | NIF del destinatario |"
            echo "|---|---|---|"
            jq -r '"| \(.code) | \(if .error then "error: " + .error elif (.campos_distintos | length) == 0 then "ninguno" else (.campos_distintos | join(", ")) end) | \(.nif_destinatario // "—") |"' /tmp/medidas.jsonl
            echo
            echo "**Recepciones:** $(wc -l < /tmp/medidas.jsonl) · **sin ningún campo distinto:** $(jq -s '[.[] | select(.error == null and (.campos_distintos | length) == 0)] | length' /tmp/medidas.jsonl)"
            echo
            echo "**NIF del destinatario:**"
            jq -rs 'map(.nif_destinatario // "error") | group_by(.) | map("- \(.[0]): \(length)") | .[]' /tmp/medidas.jsonl
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
