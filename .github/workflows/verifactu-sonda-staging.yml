name: V03 · Sonda de Verifactu en staging-conta

# QUÉ HACE (V03 · E1 · paso 1, 25/10)
# El riesgo técnico del encargo: ¿una función de Supabase llega al entorno de
# PRUEBAS de la AEAT y le habla con certificado de cliente? Y, de paso, baja de
# allí las dos fuentes oficiales que no se pueden bajar desde la sesión de
# trabajo: el WSDL y la lista de códigos de error (errores.properties).
#
# En un solo run, y SOLO en staging-conta (oseymswjlzplqoxrfjzi):
#   1. guardas: staging y no producción; la sonda solo habla con prewww*.aeat.es
#      y no nombra ningún dominio de producción de la AEAT;
#   2. un token de un solo run como secreto de la función, y la despliega
#      (supabase/staging/sondas/verifactu, copiada a supabase/functions/ dentro del runner);
#   3. «fuentes»: baja el WSDL y errores.properties y los deja en la rama, en
#      docs/conta/v03/aeat/, con su fecha y su huella;
#   4. «conexion»: si Julio ha puesto AEAT_PRUEBAS_P12_B64 y AEAT_PRUEBAS_P12_CLAVE
#      en staging, UNA CONSULTA con certificado al punto de acceso de pruebas que
#      declara el WSDL. Si no están, lo dice y no falla;
#   5. busca en los logs de la función restos de material (PEM o base64 largo);
#   6. pase lo que pase, borra la función y su token. Los dos secretos del
#      certificado NO se tocan: son de Julio y hacen falta después.
#
# CUÁNDO: un push a conta/v03-e1 cuyo mensaje EMPIECE por «[verifactu-sonda]».

on:
  push:
    branches: ['conta/v03-e1']

concurrency:
  group: verifactu-sonda-staging
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sonda:
    # W12b (30/10): el secreto vive en el entorno «despliegue», que solo admite
    # ejecuciones de main (el token de Supabase y la clave de servicio alcanzan producción).
    environment: despliegue
    if: startsWith(github.event.head_commit.message, '[verifactu-sonda]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REF: oseymswjlzplqoxrfjzi
      PROD_REF: xzmpnchlguibclvxyynt
      FN: verifactu-sonda
      SRC: supabase/staging/sondas/verifactu/index.ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guardas · staging y no producción; solo pruebas de la AEAT
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${TOKEN:-}" ] || { echo "::error::Falta SUPABASE_ACCESS_TOKEN."; exit 1; }
          [ "$REF" != "$PROD_REF" ] || { echo "::error::El ref es el de producción. Abortado."; exit 1; }
          grep -qF 'const SOLO_PRUEBAS = /^https:\/\/prewww\d*\.aeat\.es\//;' "$SRC" || { echo "::error::La sonda no limita el destino a prewww*.aeat.es."; exit 1; }
          # Ningún dominio de producción de la AEAT al que se pueda llamar: los
          # espacios de nombres XML (…/static_files/…xsd) no son llamadas.
          ! grep -nE 'https://(www[0-9]*\.agenciatributaria\.gob\.es|www[0-9]*\.aeat\.es)' "$SRC" | grep -v 'static_files/common/internet/dep/aplicaciones/es/aeat/tike/cont/ws/' \
            || { echo "::error::La sonda nombra un dominio de producción de la AEAT."; exit 1; }
          grep -q 'PRODUCCION_REF = "xzmpnchlguibclvxyynt"' "$SRC" || { echo "::error::La sonda no tiene la guarda de producción."; exit 1; }

      - name: Token y despliegue en staging-conta
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sonda
          TOK=$(openssl rand -hex 24); echo "::add-mask::$TOK"; printf '%s' "$TOK" > /tmp/sonda/token
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/sonda/desde
          supabase secrets set --project-ref "$REF" "VERIFACTU_SONDA_TOKEN=$TOK" > /dev/null
          mkdir -p "supabase/functions/$FN"
          cp "$SRC" "supabase/functions/$FN/index.ts"
          supabase functions deploy "$FN" --project-ref "$REF" --no-verify-jwt > "$RUNNER_TEMP/despliegue.txt" 2>&1
          echo "Sonda desplegada en staging-conta."

      # Lo que sale al registro y al resumen, solo por la puerta (D01 R2): números
      # y huellas. El texto de lo que contesta la AEAT no sale; se cuenta.
      - name: Fuentes · el WSDL y la lista de errores, desde staging
        run: |
          set -euo pipefail
          sleep 5
          curl -sS --max-time 90 -H "x-verifactu-sonda: $(cat /tmp/sonda/token)" "https://$REF.supabase.co/functions/v1/$FN?modo=fuentes" > /tmp/sonda/fuentes.json || echo '{"ok":false,"error":"curl"}' > /tmp/sonda/fuentes.json
          jq -r '"@@ # fuentes",
            (["wsdl", "errores"][] as $k | .[$k] // {} |
              "@@ \($k).status \(.status // -1)", "@@ \($k).bytes \(.bytes // -1)", "@@ \($k).ms \(.ms // -1)", "@@ \($k).sha256 \(.sha256 // "")"),
            "@@ puertos \((.puertos // []) | length)",
            ((.xsd // {}) | to_entries[] | (.key | ascii_downcase | sub("\\.xsd$"; "")) as $k | .value |
              "@@ \($k).status \(.status // -1)", "@@ \($k).bytes \(.bytes // -1)", "@@ \($k).sha256 \(.sha256 // "")")' /tmp/sonda/fuentes.json > /tmp/sonda/fuentes.txt
          cat /tmp/sonda/fuentes.txt | node scripts/conta/salida-segura.mjs >> "$GITHUB_STEP_SUMMARY"
          A=docs/conta/v03/aeat; mkdir -p "$A"
          HOY=$(date -u +%Y-%m-%d)
          jq -r '.wsdl.texto // empty' /tmp/sonda/fuentes.json > "$A/SistemaFacturacion.wsdl"
          jq -r '.errores.texto // empty' /tmp/sonda/fuentes.json > "$A/errores.properties"
          for x in SuministroLR SuministroInformacion RespuestaSuministro ConsultaLR RespuestaConsultaLR; do
            jq -r --arg n "$x.xsd" '.xsd[$n].texto // empty' /tmp/sonda/fuentes.json > "docs/conta/v03/aeat/$x.xsd"
            [ -s "docs/conta/v03/aeat/$x.xsd" ] || rm -f "docs/conta/v03/aeat/$x.xsd"
          done
          jq --arg hoy "$HOY" '{bajado: $hoy, desde: "función de staging-conta (sonda V03)", wsdl: (.wsdl | del(.texto)), errores: (.errores | del(.texto)), xsd: ((.xsd // {}) | map_values(del(.texto))), puertos: (.puertos // [])}' /tmp/sonda/fuentes.json > "$A/fuentes.json"
          jq -r '[(.puertos // [])[] | select(.url | test("^https://prewww1\\.aeat\\.es/.*VerifactuSOAP$"))][0].url // ""' /tmp/sonda/fuentes.json > /tmp/sonda/destino
          for f in SistemaFacturacion.wsdl errores.properties; do [ -s "$A/$f" ] || rm -f "$A/$f"; done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$A"
          if git diff --cached --quiet; then echo "Nada nuevo que guardar."; else
            git commit -q -m "V03 · E1 · Las fuentes oficiales de la AEAT bajadas desde staging ($HOY): WSDL, errores.properties y sus huellas"
            git push -q origin "HEAD:${GITHUB_REF#refs/heads/}"; echo "Guardadas en la rama."
          fi

      - name: Conexión · una consulta con certificado al entorno de pruebas
        run: |
          set -euo pipefail
          DEST=$(cat /tmp/sonda/destino)
          if [ -z "$DEST" ]; then echo '{"ok":false,"error":"sin_destino"}' > /tmp/sonda/conexion.json; else
            curl -sS --max-time 90 -G -H "x-verifactu-sonda: $(cat /tmp/sonda/token)" "https://$REF.supabase.co/functions/v1/$FN" \
              --data-urlencode "modo=conexion" --data-urlencode "destino=$DEST" > /tmp/sonda/conexion.json || echo '{"ok":false,"error":"curl"}' > /tmp/sonda/conexion.json
          fi
          # El fallo y su motivo son palabras que escribe la sonda (sin_certificado,
          # certificado, caducado, tls…): van como CLAVE, con un 1.
          jq -r '"@@ # conexion",
            "@@ ok \(if .ok then 1 else 0 end)", "@@ status \(.status // -1)", "@@ ms \(.ms // -1)",
            (if .error then "@@ error.\(.error | ascii_downcase | gsub("[^a-z0-9_]"; "_")) 1" else empty end),
            (if .motivo then "@@ motivo.\(.motivo | ascii_downcase | gsub("[^a-z0-9_]"; "_")) 1" else empty end),
            ((.respuesta // "") as $r |
              "@@ respuesta.bytes \($r | length)",
              "@@ respuesta.consulta \(if ($r | test("RespuestaConsultaFactuSistemaFacturacion")) then 1 else 0 end)",
              "@@ respuesta.fault \(if ($r | test("Fault>")) then 1 else 0 end)",
              ([$r | scan("(?:CodigoErrorRegistro|CodigoError|faultcode)>[^0-9<]*([0-9]{3,5})<") | .[0]] | unique[] | "@@ codigo_aeat.\(.) 1"))' /tmp/sonda/conexion.json > /tmp/sonda/conexion.txt
          cat /tmp/sonda/conexion.txt | node scripts/conta/salida-segura.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Logs de la función (se buscan restos de material; no se imprimen)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          DESDE=$(cat /tmp/sonda/desde)
          echo "Esperando a que lleguen los logs (90 s)."; sleep 90
          HASTA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          : > /tmp/sonda/logs
          for sql in "select timestamp, event_message, metadata from function_logs limit 1000" "select timestamp, event_message, metadata from function_edge_logs limit 1000"; do
            curl -sS --max-time 60 -G -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs.all" \
              --data-urlencode "sql=$sql" --data-urlencode "iso_timestamp_start=$DESDE" --data-urlencode "iso_timestamp_end=$HASTA" >> /tmp/sonda/logs || true
            echo >> /tmp/sonda/logs
          done
          PEM=$(grep -cE 'BEGIN (CERTIFICATE|PRIVATE KEY|RSA PRIVATE KEY|ENCRYPTED PRIVATE KEY)' /tmp/sonda/logs || true)
          B64=$(grep -oE '[A-Za-z0-9+/]{200,}={0,2}' /tmp/sonda/logs | wc -l || true)
          NUESTRO=$(grep -c 'sonda\\":\\"verifactu\|"sonda":"verifactu"' /tmp/sonda/logs || true)
          echo "@@ # logs" > /tmp/sonda/logs.txt
          echo "@@ lineas_de_la_sonda $NUESTRO" >> /tmp/sonda/logs.txt
          echo "@@ con_un_pem $PEM" >> /tmp/sonda/logs.txt
          echo "@@ con_base64_de_200_o_mas $B64" >> /tmp/sonda/logs.txt
          cat /tmp/sonda/logs.txt | node scripts/conta/salida-segura.mjs >> "$GITHUB_STEP_SUMMARY"
          [ "$PEM" = "0" ] || { echo "::error::Hay material de certificado en los logs."; exit 1; }

      - name: Limpieza · la función y su token (pase lo que pase)
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          supabase functions delete "$FN" --project-ref "$REF" || true
          supabase secrets unset --project-ref "$REF" VERIFACTU_SONDA_TOKEN || true
          mkdir -p /tmp/sonda
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/functions" > /tmp/sonda/funciones.json || echo '[]' > /tmp/sonda/funciones.json
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/secrets" > /tmp/sonda/secretos.json || echo '[]' > /tmp/sonda/secretos.json
          N_FN=$(jq --arg s "$FN" '[.[] | select(.slug==$s)] | length' /tmp/sonda/funciones.json)
          N_SEC=$(jq '[.[] | select(.name=="VERIFACTU_SONDA_TOKEN")] | length' /tmp/sonda/secretos.json)
          CERT=$(jq '[.[] | select(.name=="AEAT_PRUEBAS_P12_B64" or .name=="AEAT_PRUEBAS_P12_CLAVE")] | length' /tmp/sonda/secretos.json)
          echo "@@ # Limpieza" > /tmp/sonda/resumen.txt
          echo "@@ funciones_de_la_sonda_que_quedan $N_FN" >> /tmp/sonda/resumen.txt
          echo "@@ secretos_VERIFACTU_SONDA_TOKEN_que_quedan $N_SEC" >> /tmp/sonda/resumen.txt
          echo "@@ secretos_del_certificado_de_pruebas_de_2_no_se_tocan $CERT" >> /tmp/sonda/resumen.txt
          cat /tmp/sonda/resumen.txt | node scripts/conta/salida-segura.mjs >> "$GITHUB_STEP_SUMMARY"
          [ "$N_FN" = "0" ] && [ "$N_SEC" = "0" ] || { echo "::error::No se ha limpiado todo."; exit 1; }
