name: B01 · Sonda del correo de staging-conta (solo lectura)

# QUÉ HACE (Julio, 01/11): por qué staging no manda correos, medido y no
# supuesto, para decir exactamente qué secreto o ajuste falta y en qué pantalla.
# Hay DOS caminos de correo, y cada uno puede fallar por su lado:
#
#   · Supabase Auth (recuperar la contraseña, invitar): su SMTP propio, en
#     Authentication › Emails › SMTP Settings. De ahí venía el 535.
#   · send-email (los correos de Sumied y de Folvy: el código del PIN, los
#     avisos…): la API de Resend con el secreto RESEND_API_KEY de las funciones,
#     después del freno CORREO_MARCA_ABIERTOS.
#
# En un solo run, SOLO LEYENDO, y sin mandar ningún correo:
#   1. guardas: staging y no producción; la sonda solo habla con api.resend.com;
#   2. los secretos de las funciones de staging: si están RESEND_API_KEY,
#      CORREO_MARCA_ABIERTOS y PAGO_PIN_CLAVE (solo el NOMBRE), y si la clave de
#      Resend es la misma que la de producción (comparando sus huellas, que da
#      la API de Supabase; nunca el valor);
#   3. el SMTP de Auth de staging y el de producción, lado a lado: si está puesto,
#      si es el de Resend, el puerto, si el usuario es «resend» y si el remitente
#      es de un dominio de las marcas (sí/no: ni el usuario ni la contraseña salen);
#   4. una sonda de un solo run en staging que pregunta a Resend con esa clave
#      por sus dominios (GET /domains, no manda nada) y mira el freno;
#   5. pase lo que pase, borra la sonda y su token. Lo demás NO se toca.
#
# Al resumen y al registro, solo números y claves que escribe el código (D01 R2:
# salida-segura). CUÁNDO: solo a mano, desde main (Actions › esta sonda › Run workflow).

on:
  workflow_dispatch:

concurrency:
  group: correo-sonda-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sonda:
    # W12b (30/10): el token de Supabase vive en el entorno «despliegue», que solo admite ejecuciones de main.
    environment: despliegue
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REF: oseymswjlzplqoxrfjzi
      PROD_REF: xzmpnchlguibclvxyynt
      FN: correo-sonda
      SRC: supabase/staging/sondas/correo/index.ts
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guardas · staging y no producción; solo Resend y solo leer
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${TOKEN:-}" ] || { echo "::error::Falta SUPABASE_ACCESS_TOKEN."; exit 1; }
          [ "$REF" != "$PROD_REF" ] || { echo "::error::El ref es el de producción. Abortado."; exit 1; }
          grep -qF 'const PRODUCCION_REF = "xzmpnchlguibclvxyynt";' "$SRC" || { echo "::error::La sonda no tiene la guarda de producción."; exit 1; }
          ! grep -noE 'https://[a-z0-9.-]+' "$SRC" | grep -vE 'https://api\.resend\.com$' \
            || { echo "::error::La sonda nombra un dominio que no es el de Resend."; exit 1; }
          # Solo lee: ni POST ni ningún método que escriba en Resend.
          ! grep -nE 'method:\s*"(POST|PUT|PATCH|DELETE)"' "$SRC" || { echo "::error::La sonda escribe en Resend."; exit 1; }

      - name: Los secretos de las funciones (solo los nombres y si la clave de Resend es la de producción)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/secrets" > /tmp/s.json
          curl -sS --fail -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROD_REF/secrets" > /tmp/p.json
          hay() { jq --arg n "$2" '[.[] | select(.name==$n)] | length' "$1"; }
          huella() { jq -r --arg n "$2" '[.[] | select(.name==$n)][0].value // ""' "$1"; }
          HS=$(huella /tmp/s.json RESEND_API_KEY); HP=$(huella /tmp/p.json RESEND_API_KEY)
          MISMA=0; [ -n "$HS" ] && [ "$HS" = "$HP" ] && MISMA=1
          echo "@@ # secretos" > /tmp/r1.txt
          for n in RESEND_API_KEY CORREO_MARCA_ABIERTOS PAGO_PIN_CLAVE; do
            k=$(echo "$n" | tr 'A-Z' 'a-z')
            echo "@@ staging.$k $(hay /tmp/s.json "$n")" >> /tmp/r1.txt
            echo "@@ produccion.$k $(hay /tmp/p.json "$n")" >> /tmp/r1.txt
          done
          HAY_HUELLA=0; [ -n "$HS" ] && [ -n "$HP" ] && HAY_HUELLA=1
          echo "@@ resend_api_key_huellas_comparables $HAY_HUELLA" >> /tmp/r1.txt
          echo "@@ resend_api_key_misma_que_produccion $MISMA" >> /tmp/r1.txt
          cat /tmp/r1.txt | node scripts/conta/salida-segura.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f /tmp/s.json /tmp/p.json

      - name: El SMTP de Supabase Auth, en staging y en producción (sí/no, sin usuario ni contraseña)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          { echo "@@ # smtp_de_auth"
            for lado in staging produccion; do
              ref=$REF; [ "$lado" = produccion ] && ref=$PROD_REF
              curl -sS --fail -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$ref/config/auth" > /tmp/a.json
              jq -r --arg l "$lado" '
                "@@ \($l).smtp_puesto \(if (.smtp_host // "") != "" then 1 else 0 end)",
                "@@ \($l).smtp_es_resend \(if (.smtp_host // "") == "smtp.resend.com" then 1 else 0 end)",
                "@@ \($l).smtp_puerto \((.smtp_port // "0") | tostring | gsub("[^0-9]"; "") | if . == "" then "0" else . end)",
                "@@ \($l).smtp_usuario_es_resend \(if (.smtp_user // "") == "resend" then 1 else 0 end)",
                "@@ \($l).smtp_remitente_de_folvy_app \(if ((.smtp_admin_email // "") | test("@folvy\\.app$")) then 1 else 0 end)",
                "@@ \($l).smtp_remitente_de_sumied_com \(if ((.smtp_admin_email // "") | test("@sumied\\.com$")) then 1 else 0 end)",
                "@@ \($l).correo_activado \(if .external_email_enabled then 1 else 0 end)",
                "@@ \($l).max_correos_por_hora \((.rate_limit_email_sent // 0) | tostring | gsub("[^0-9]"; "") | if . == "" then "0" else . end)"' /tmp/a.json
              rm -f /tmp/a.json
            done; } > /tmp/r2.txt
          cat /tmp/r2.txt | node scripts/conta/salida-segura.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: La sonda en staging · Resend (GET /domains) y el freno
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          TOK=$(openssl rand -hex 24); echo "::add-mask::$TOK"
          supabase secrets set --project-ref "$REF" "CORREO_SONDA_TOKEN=$TOK" > /dev/null
          mkdir -p "supabase/functions/$FN"; cp "$SRC" "supabase/functions/$FN/index.ts"
          supabase functions deploy "$FN" --project-ref "$REF" --no-verify-jwt > "$RUNNER_TEMP/despliegue.txt" 2>&1
          sleep 5
          curl -sS --max-time 60 -H "x-correo-sonda: $TOK" "https://$REF.supabase.co/functions/v1/$FN" > /tmp/r.json || echo '{"ok":false,"error":"curl"}' > /tmp/r.json
          jq -r '"@@ # resend_desde_staging",
            "@@ sonda_ok \(if .ok then 1 else 0 end)",
            (if .error then "@@ sonda_error.\(.error | ascii_downcase | gsub("[^a-z0-9_]"; "_")) 1" else empty end),
            "@@ tiene_resend_api_key \(.tiene_clave // 0)",
            "@@ clave_empieza_por_re_ \(.clave_empieza_por_re // 0)",
            "@@ resend_status \(.resend_status // 0)",
            (if .resend_error then "@@ resend_error.\(.resend_error | ascii_downcase | gsub("[^a-z0-9_]"; "_")) 1" else empty end),
            "@@ dominios_en_resend \(.dominios_en_resend // 0)",
            ((.dominios // {}) | to_entries[] | "@@ dominio.\(.key | gsub("[^a-z0-9]"; "_")) \(.value)"),
            "@@ freno_entradas \(.freno_entradas // 0)",
            "@@ freno_codigo_pago_conta \(.freno_codigo_pago_conta // 0)",
            "@@ freno_aviso_pago_conta \(.freno_aviso_pago_conta // 0)"' /tmp/r.json > /tmp/r3.txt
          cat /tmp/r3.txt | node scripts/conta/salida-segura.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f /tmp/r.json

      - name: Limpieza · la sonda y su token (pase lo que pase)
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          supabase functions delete "$FN" --project-ref "$REF" || true
          supabase secrets unset --project-ref "$REF" CORREO_SONDA_TOKEN || true
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/functions" > /tmp/f.json || echo '[]' > /tmp/f.json
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/secrets" > /tmp/s.json || echo '[]' > /tmp/s.json
          N_FN=$(jq --arg s "$FN" '[.[] | select(.slug==$s)] | length' /tmp/f.json)
          N_SEC=$(jq '[.[] | select(.name=="CORREO_SONDA_TOKEN")] | length' /tmp/s.json)
          N_KEY=$(jq '[.[] | select(.name=="RESEND_API_KEY")] | length' /tmp/s.json)
          rm -f /tmp/s.json /tmp/f.json
          echo "@@ # limpieza" > /tmp/r4.txt
          echo "@@ funciones_de_la_sonda_que_quedan $N_FN" >> /tmp/r4.txt
          echo "@@ tokens_de_la_sonda_que_quedan $N_SEC" >> /tmp/r4.txt
          echo "@@ resend_api_key_no_se_toca $N_KEY" >> /tmp/r4.txt
          cat /tmp/r4.txt | node scripts/conta/salida-segura.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$N_FN" = "0" ] && [ "$N_SEC" = "0" ] || { echo "::error::No se ha limpiado todo."; exit 1; }
