name: Diez · por qué no llegaron el 1860 y el 1861 (C0008, solo lectura)

# QUÉ HACE (C06b, 17/10)
# Mira en C0008, solo con GET, si los asientos 1860 y 1861 están escritos en
# Diez, si el listado de facturas de octubre contesta (y qué día no) y en qué
# se diferencian las subcuentas 70009001/70009002/70500001 de la 70000001
# (scripts/conta/diez/diagnostico-1860-c0008.ts). El cliente de Diez se crea
# con escribir: false.
#
# QUÉ SALE: solo «@@ clave número|huella», por scripts/conta/salida-segura.mjs
# (D01 R2): ni números de factura, ni descripciones, ni nombres, ni importes.
#
# CUÁNDO: al empujar a la rama del encargo un commit cuyo mensaje EMPIECE por
# «[diagnostico-1860]».

on:
  push:
    branches: ['conta/c06b-diez-1860']

concurrency:
  group: diez-lectura
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostico:
    if: startsWith(github.event.head_commit.message, '[diagnostico-1860]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enmascarar el secreto
        env:
          DIEZ_LECTURA: ${{ secrets.DIEZ_LECTURA }}
        run: |
          set -euo pipefail
          [ -n "$DIEZ_LECTURA" ] || { echo "::error::Falta el secreto DIEZ_LECTURA. No se lee nada."; exit 1; }
          jq -r '.[] | tostring' <<<"$DIEZ_LECTURA" | while IFS= read -r v; do [ -n "$v" ] && echo "::add-mask::$v"; done
      - name: Medir en C0008 (solo GET)
        env:
          DIEZ_LECTURA: ${{ secrets.DIEZ_LECTURA }}
        run: |
          set -euo pipefail
          DIAGNOSTICO_PASADA=2 npx --yes tsx@4.19.2 scripts/conta/diez/diagnostico-1860-c0008.ts 2>&1 | node scripts/conta/salida-segura.mjs | tee -a "$GITHUB_STEP_SUMMARY"
