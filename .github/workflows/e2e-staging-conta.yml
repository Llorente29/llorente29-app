name: Pruebas e2e en staging-conta
run-name: "e2e · ${{ github.event_name == 'schedule' && 'entera de la noche' || github.event_name == 'workflow_dispatch' && inputs.repite != '' && 'repetición de la noche' || github.event_name == 'workflow_dispatch' && (inputs.pruebas == '' && 'entera' || inputs.pruebas) || 'frente' }} · ${{ github.ref_name }} · ${{ github.sha }}"

# QUÉ HACE
# Pasa las pruebas de extremo a extremo del módulo de contabilidad
# (tests/e2e, Playwright) contra staging-conta, en ordenador (1440 × 900) y en
# móvil (390 × 844). Las capturas que saca van como ARTEFACTO del run, con un
# comentario en el PR que da el enlace; a la rama solo van a mano (abajo).
#
# POR QUÉ AQUÍ Y NO EN EL CONTENEDOR DE DESARROLLO
# Desde ese contenedor no se llega a *.supabase.co (el proxy lo corta).
#
# CADA E2E CON SUS PROPIAS CUENTAS (W02, paso 1c, 16/10)
# Hasta el 16/10 todas las e2e compartían las cuentas A y B de staging y, para
# no romperse los datos, iban de una en una detrás de un cerrojo (e2e.cerrojo):
# 1.741 min de espera en tres días, tantos como de pruebas. Ahora cada job coge
# un CARRIL (scripts/e2e/carril.sh): una copia de las cuentas de prueba (A, B,
# C, D, Diez, las dos «solas» del C06 y sus ocho usuarios) con ids propios, que
# se clona al empezar y se borra al acabar. Dos e2e a la vez ya no se pisan.
# Los usuarios del carril reciben en cada ejecución una contraseña ALEATORIA,
# que se enmascara y no sale del job. Las pruebas calculan los ids y correos
# del carril con tests/e2e/conta/sesion.ts (enCarril, correoDelCarril).
#
# EL ÚNICO CERROJO QUE QUEDA: MIENTRAS SE MIGRA, Y POR FICHERO (V03, respuesta
# 6, 26/10). Cada FICHERO de pruebas coge la barrera de migrar COMPARTIDA
# mientras corre (scripts/e2e/por-fichero.sh; entran todos a la vez);
# aplicar-staging-conta la coge EXCLUSIVA: espera a que acaben los ficheros que
# están corriendo —como mucho el más largo, unos 5,5 min— y, mientras aplica
# (mediana 0,6 min), no empieza ninguno. Así nunca se aplica nada en mitad de
# una prueba, y la aplicación ya no espera a que acabe una e2e entera (el 26/10,
# con la barrera para todo el job, C y D estuvieron casi 3 horas parados). Son
# cerrojos consultivos de Postgres que mantiene un psql en segundo plano: si el
# runner muere, se sueltan solos. Nadie espera para siempre: el carril, 15 min;
# un fichero a la barrera, 20; la aplicación, 15. Al acabarse, rojo diciendo
# quién lo tiene.
#
# LA ENTERA, EN TROZOS A LA VEZ (W02, paso 1c)
# Con «pruebas» vacío, con una carpeta (también «tests/e2e/conta»: V03,
# respuesta 6, 26/10) y en un push con la etiqueta «e2e-entera», la suite se reparte
# en 2 trozos (4 a mano con «trozos»: la Micro de staging no los aguanta) (scripts/e2e/trozos.mjs: fichero a fichero, del más lento al más
# rápido, al trozo que menos lleva), cada uno en su runner y en su carril. El
# job «entera» los junta: comprueba que entre todos están TODOS los ficheros,
# una vez cada uno, y que todos han salido en verde en este commit. Solo así el
# run sale en verde. (W04, 22/10: la entera ya no se pide antes de una tanda,
# y con ella se fue la regla del «primer intento».)
#
# Se pone con el mismo y único secreto del otro workflow, STAGING_CONTA_DB_URL,
# y con las mismas tres guardas: la URL es de staging-conta, no es de
# producción, y al otro lado no hay ni Foodint ni Folvy Interno.
#
# La URL y la clave anónima de staging-conta van escritas abajo: son públicas
# por diseño (las lleva cualquier navegador que abra la app) y no dan acceso a
# nada que la RLS no permita. No sirven para producción.
#
# QUÉ PRUEBAS LLEVA CADA PR (Julio, 26/10; antes W04, 22/10): LA ENTERA NO
# CORRE EN NINGÚN PR, NUNCA. Solo de noche sobre main, y con la etiqueta
# «e2e-entera» si Julio la pide. En cada push (scripts/e2e/area.mjs):
#   · la zona de la rama (y la de lo que toca) y cada .spec.ts que cambia el PR;
#   · si toca lo común (el marco, el menú, module.tsx, el arranque…), además la
#     rápida de pantallas (tests/e2e/conta/humo: cada pantalla de Sumied una vez,
#     en los dos tamaños, ≤ 10 min);
#   · si toca pedidos, cocina o reparto, además la corta;
#   · con tanda: además su prueba de staging en ROLLBACK, el ensayo y el real (W01).
# Un fallo POR TIEMPO en una prueba que no es de la zona del PR (el juego común,
# la rápida) no bloquea fusionar: se apunta en el run y lo mira la de la noche
# (scripts/e2e/por-fichero.sh). En la zona, todo fallo bloquea.
# Detalle y porqué: docs/conta/pruebas_de_un_pr.md.
#
# LA ENTERA DE LA NOCHE (Julio, 21/10): a las 03:00 de Madrid, en verano y en
# invierno (dos disparos UTC, 01:00 y 02:00, y el plan deja correr solo el que
# toca, como cumplimiento-nocturno-conta.yml). Sobre main, en 2 trozos.
# El job «aviso» lee el informe JSON (scripts/e2e/noche.mjs) y:
#   · verde: si había una incidencia «e2e de la noche en rojo», lo dice y la cierra;
#   · si todo lo que falló parece de staging (no poder entrar, un 520, una
#     página HTML de la base) o no llegó a fallar ninguna prueba: lo repite UNA
#     vez, solo esos ficheros, en otro run («repetición de la noche»);
#   · si no: la incidencia (una sola abierta; si ya hay, un comentario) con
#     cada prueba, su fichero y línea, el tamaño, el error y el commit.
# Corre a la vez que el cumplimiento nocturno (03:40, solo lee): no se pisan.
#
# CUÁNDO SE DISPARA
# Un push a conta/** o a claude/** (V03, respuesta 6, 26/10) que toque la app, las pruebas, el carril o este workflow.
# Cada noche sobre main (la entera), y su repetición si falló por staging.
# Y a mano (workflow_dispatch) desde la rama: cuando lo que cambia es staging
# —una semilla rehecha por aplicar-staging-conta— y no el código (12/10, C04 R3).
#
# QUÉ CORRE (C06b, respuesta 6 de Julio, tarea 5 · 14/10)
#   · en un PUSH corre el área de la rama, en un trozo
#     (scripts/e2e/area.mjs; W02, 17/10): la carpeta del frente o la de su
#     nombre (conta/c02c-* → c02c), con el juego común (el marco y el arranque
#     del C00, y la RLS entre cuentas); reparto-** → tests/e2e/reparto; una
#     rama sin área (conta/w02-…), solo el juego común. Y, además, cada
#     fichero .spec.ts que cambia el PR (V03, respuesta 6, 26/10). La suite entera,
#     nunca en un push: solo con la etiqueta (arriba).
#   · la SUITE ENTERA también corre a mano (workflow_dispatch con «pruebas»
#     vacío), cuando se quiera; ya no se pide antes de una tanda (W04).
#   · el frente sigue saliendo de la rama: decide qué carpeta corre en un push
#     y qué capturas se fijan, y las pruebas del C06 que solo son del frente C
#     siguen mirándolo (E2E_FRENTE). Los usuarios ya no: son los del carril.
#
# LA COLA (W02, 17/10, deshace el paso 1c). Una sola cola por rama, para el
# push y para la entera lanzada a mano:
#   · un PUSH nuevo cancela la e2e que corre en su rama: es de un commit que ya
#     no es el último, y lo que probaba lo vuelve a probar la nueva;
#   · una e2e lanzada A MANO no cancela nada: espera a que acabe la que corre;
#   · GitHub deja como mucho una en espera por cola: si llega otra, la que
#     esperaba se descarta antes de empezar.
# En el 1c el push y la entera corrían a la vez, y con la suite en 2 trozos
# cada una eran 4 trozos contra la Micro: la entera de R sobre 59334b37 (run
# 484, con el push 482 al lado) cayó en 6 pruebas por tiempo, distintas en
# cada vuelta. Además, todo staging corre como mucho E2E_CARRILES trozos a la
# vez (variable del repositorio, vacía = 2; 4 si staging pasa a Small): el que
# llega con los carriles cogidos espera su turno en carril.sh coger.
#
# EL GASTO (W02, 17/10): el 16/10 las e2e se llevaron 2.953 min de Actions.
# Por eso: el push corre solo su área (scripts/e2e/area.mjs), la entera solo a
# mano, y un push nuevo cancela la e2e del commit anterior.
#
# LAS CAPTURAS (C06b, 15/10; W04, 22/10; W08b, Julio, 28/10: fuera del PR):
#   · En CADA trozo, las capturas que ha sacado (las escritas después de la
#     marca) van en su artefacto «capturas-N»; el job «entera» las junta en el
#     artefacto «capturas», 30 días.
#   · La e2e de cada PUSH que sale en verde publica las del frente de la rama
#     (scripts/conta/capturas.mjs suyas) en una rama APARTE, capturas/<rama>:
#     un solo commit sin historia, que se reescribe en cada run. El bot no hace
#     commits en la rama del PR: un push con el token del workflow dejaba las
#     comprobaciones del PR en «Action required», y los PNG chocaban con main.
#     A mano, igual, con «publicar_capturas» (y «frente», para forzar de quién).
#   · Un comentario del PR (uno solo, que se va editando) da el enlace al
#     artefacto y enseña las publicadas en miniatura, por tablero.
#   · Al fusionar el PR, capturas-al-cerrar.yml las pasa a main en su carpeta
#     de siempre; al fusionarlo o cerrarlo, borra capturas/<rama>.

on:
  push:
    # reparto-**: el R02 (quién reparte), con sus pruebas en tests/e2e/reparto.
    # claude/**: las sesiones de Claude Code (V03, respuesta 6, 26/10).
    branches: ['conta/**', 'claude/**', 'reparto-**']
    paths:
      - 'src/**'
      - 'supabase/seeds/reparto/seed_r02_e2e.sql'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'scripts/e2e/carril/**'
      - 'scripts/e2e/carril.sh'
      - 'scripts/e2e/por-fichero.sh'
      - 'scripts/e2e/trozos.mjs'
      - 'scripts/e2e/area.mjs'
      - '.github/workflows/e2e-staging-conta.yml'
  # La entera de la noche, sobre main (la rama por defecto: schedule corre ahí).
  # 03:00 de Madrid: uno vale en verano y el otro en invierno (ver «plan»).
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      # Carpetas o ficheros de tests/e2e, separados por espacios (vacío = la suite entera).
      pruebas:
        description: 'Carpetas o ficheros de tests/e2e, separados por espacios (vacío = la suite ENTERA)'
        type: string
        required: false
        default: ''
      # El frente sale de la rama; esto lo fuerza. Vacío = el de la rama.
      frente:
        description: 'Frente (a, b, c o d). Vacío = el de la rama'
        type: string
        required: false
        default: ''
      # W02 (1c): en cuántos trozos a la vez va la suite entera. 2 por defecto:
      # con 4, la Micro de staging no aguanta (medido el 16/10: las mismas
      # pruebas ×1,20 y 6-8 que no llegan a pintar en 15 s por run).
      trozos:
        description: 'En cuántos trozos a la vez va la suite entera (1 a 4). Vacío = 2'
        type: string
        required: false
        default: ''
      # W08b: publica en capturas/<rama> las de SU frente (solo esas), fuera del PR.
      publicar_capturas:
        description: 'Publicar en capturas/<rama> las capturas del frente de la rama (fuera del PR)'
        type: boolean
        required: false
        default: false
      # Lo rellena el job «aviso» de la noche, no una persona: el run de la noche
      # cuyos fallos de staging se repiten (una vez) antes de avisar.
      repite:
        description: 'Solo para el aviso de la noche: el run cuyos fallos se repiten (no lo rellenes a mano)'
        type: string
        required: false
        default: ''

# Sin el tipo de evento en el grupo: el push y la entera de la misma rama van
# en la misma cola. Cancela solo un push (ver LA COLA).
concurrency:
  group: e2e-staging-conta-${{ github.ref }}-${{ inputs.frente }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  # El comentario del PR con el enlace al artefacto de las capturas.
  pull-requests: write
  # La incidencia de la entera de la noche cuando sale en rojo.
  issues: write
  # La noche relanza este workflow (una vez) para repetir lo que falló por staging.
  actions: write

env:
  # W09: psql y pg_dump dejan de esperar a conectar a los 15 s (el #728 esperó casi una hora).
  PGCONNECT_TIMEOUT: '15'
  STAGING_REF: oseymswjlzplqoxrfjzi
  PROD_REF: xzmpnchlguibclvxyynt
  VITE_SUPABASE_URL: https://oseymswjlzplqoxrfjzi.supabase.co
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zZXltc3dqbHpwbHFveHJmanppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODYzNzUsImV4cCI6MjEwNjQ2MjM3NX0.xszvWohb2R7MWidy1ZsIL0IZg2E55aQSFRc1WX8A4js

jobs:
  # Qué se corre y en cuántos trozos. Sin secretos y sin tocar staging.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frente: ${{ steps.frente.outputs.frente }}
      pruebas: ${{ steps.frente.outputs.pruebas }}
      propias: ${{ steps.frente.outputs.propias }}
      zona: ${{ steps.frente.outputs.zona }}
      trozos: ${{ steps.frente.outputs.trozos }}
      n: ${{ steps.frente.outputs.n }}
      toca: ${{ steps.hora.outputs.toca }}
    env:
      PRUEBAS: ${{ inputs.pruebas }}
      FRENTE_PEDIDO: ${{ inputs.frente }}
      TROZOS_PEDIDOS: ${{ inputs.trozos }}
      REPITE: ${{ inputs.repite }}
    steps:
      # LA NOCHE A LAS 03:00 DE MADRID, en verano y en invierno: GitHub solo
      # entiende UTC, así que hay dos disparos (01:00 y 02:00 UTC) y corre solo
      # el que en Madrid son las 03:00. Se mira el disparo que llegó, no el
      # reloj: uno que GitHub retrase sigue contando como suyo. La misma guarda
      # que cumplimiento-nocturno-conta.yml.
      - name: ¿Son las 03:00 en Madrid? (solo la noche)
        id: hora
        env:
          DISPARO: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          desfase=$(TZ=Europe/Madrid date +%z)
          toca=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            case "$DISPARO|$desfase" in
              "0 1 * * *|+0200" | "0 2 * * *|+0100") toca=true ;;
              *) toca=false ;;
            esac
            echo "Disparo «$DISPARO», Madrid en $desfase: corre = $toca."
          fi
          echo "toca=$toca" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # Todo el historial: un push compara su rama con main (¿toca lo común?).
          # W09c (28/10): todo el historial de commits y árboles, sin el contenido
          # viejo (las capturas PNG del historial pesan más de 1,3 GB). Lo que un
          # paso lea de un commit viejo (git show) lo baja git al momento.
          # (sparse-checkout ya lo hacía solo; aquí queda dicho.)
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts/e2e
            tests/e2e
      # W12 · Regla T6 (29/10): un solo push a staging por paso. Si las dos
      # últimas e2e acabadas de la rama salieron en rojo, la tercera no corre:
      # la sesión para y avisa. La desbloquea una e2e en verde lanzada a mano.
      - name: Dos e2e seguidas en rojo en esta rama · para y avisa
        if: github.event_name == 'push' && github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/e2e/dos-rojas.mjs
      - name: Frente (de la rama, o el pedido a mano)
        id: frente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Una línea por frente. Una rama que no casa con ninguna no tiene frente.
          case "$GITHUB_REF_NAME" in
            conta/d[0-9]*)              FRENTE=a ;;  # A · facturas recibidas (D01…)
            conta/b[0-9]*)              FRENTE=b ;;  # B · bancos (B01…)
            conta/c06*|conta/f[0-9]*)   FRENTE=c ;;  # C · contabilidad sola y facturas emitidas (C06, F01…)
            conta/m[0-9]*|conta/s[0-9]*) FRENTE=d ;; # D · el marco nuevo, sus piezas y el esqueleto (M01, S01…)
            *)                          FRENTE= ;;
          esac
          if [ -n "${FRENTE_PEDIDO:-}" ]; then
            case "$FRENTE_PEDIDO" in a|b|c|d) FRENTE="$FRENTE_PEDIDO" ;; *) echo "::error::«frente» tiene que ser a, b, c o d (o nada)."; exit 1 ;; esac
          fi
          # En un PUSH (Julio, 26/10): nunca la entera, salvo la etiqueta
          # «e2e-entera». La zona, las que cambia el PR y, si toca lo común, la
          # rápida de pantallas; si toca pedidos, la corta (scripts/e2e/area.mjs).
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git diff --name-only "origin/main...$GITHUB_SHA" > "$RUNNER_TEMP/cambiados.txt"
            ETIQUETAS=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json labels -q '[.[0].labels[]?.name] | join(",")' 2>/dev/null || true)
            node scripts/e2e/area.mjs "$GITHUB_REF_NAME" --cambiados "$RUNNER_TEMP/cambiados.txt" --etiquetas "$ETIQUETAS" > "$RUNNER_TEMP/decision.txt"
            PORQUE=$(sed -n 's/^porque=//p' "$RUNNER_TEMP/decision.txt")
            if [ "$(sed -n 's/^entera=//p' "$RUNNER_TEMP/decision.txt")" = true ]; then
              # C10: la entera puede ir acotada a un producto (Sumied o Folvy), y va en trozos igual.
              PRUEBAS=$(sed -n 's/^pruebas=//p' "$RUNNER_TEMP/decision.txt"); ENTERA=1
              echo "### La entera${PRUEBAS:+ de ${PRUEBAS}}, porque $PORQUE" >> "$GITHUB_STEP_SUMMARY"
            else
              PRUEBAS=$(sed -n 's/^pruebas=//p' "$RUNNER_TEMP/decision.txt")
              PROPIAS=$(sed -n 's/^propias=//p' "$RUNNER_TEMP/decision.txt"); ZONA=1
              [ -n "$PRUEBAS" ] || { echo "::error::area.mjs no ha dado pruebas para $GITHUB_REF_NAME: sería la suite entera."; exit 1; }
              echo "### La zona: $PORQUE" >> "$GITHUB_STEP_SUMMARY"
              echo "De la zona del PR (aquí todo fallo bloquea): ${PROPIAS:-ninguna}. Las demás, por tiempo, no bloquean." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "Qué corre: $PORQUE ($(wc -l < "$RUNNER_TEMP/cambiados.txt") ficheros cambiados contra main)."
          fi
          if [ -n "${REPITE:-}" ]; then
            [[ "$REPITE" =~ ^[0-9]+$ ]] || { echo "::error::«repite» es el número de un run."; exit 1; }
            echo "### Repetición de la noche (run $REPITE): ${PRUEBAS:-la suite entera}" >> "$GITHUB_STEP_SUMMARY"
          fi
          for p in ${PRUEBAS:-}; do
            if ! [[ "$p" =~ ^tests/e2e/[A-Za-z0-9_./-]*$ ]] || [[ "$p" == *..* ]]; then
              echo "::error::«pruebas» son carpetas o ficheros de tests/e2e separados por espacios (o nada): «$p» no lo es."; exit 1
            fi
          done
          # La suite entera, en N trozos a la vez (2 por defecto: la Micro no
          # aguanta 4, medido el 16/10). En UNO solo si todo lo pedido son
          # ficheros sueltos (.spec.ts), o la zona de un push: con una carpeta
          # —también «tests/e2e/conta»— va en N (V03, respuesta 6, 26/10: la
          # entera con carpeta fue en uno y tardó 1,3 h).
          N=${TROZOS_PEDIDOS:-2}
          case "$N" in 1|2|3|4) ;; *) echo "::error::«trozos» tiene que ser 1, 2, 3 o 4 (o nada)."; exit 1 ;; esac
          SUELTOS=1
          for p in ${PRUEBAS:-}; do [[ "$p" == *.spec.ts ]] || SUELTOS=0; done
          if [ -n "${PRUEBAS:-}" ] && [ "${ENTERA:-0}" != 1 ]; then
            if [ "$GITHUB_EVENT_NAME" = push ] || [ "$SUELTOS" = 1 ]; then N=1; fi
          fi
          TROZOS=$(seq -s, 1 "$N" | sed 's/^/[/; s/$/]/')
          { echo "frente=$FRENTE"; echo "pruebas=${PRUEBAS:-}"; echo "propias=${PROPIAS:-}"; echo "zona=${ZONA:-0}"; echo "trozos=$TROZOS"; echo "n=$N"; } >> "$GITHUB_OUTPUT"
          echo "Frente: ${FRENTE:-ninguno} · pruebas: ${PRUEBAS:-la suite entera} · trozos: $N"

  trozo:
    needs: plan
    if: needs.plan.outputs.toca == 'true'
    name: trozo ${{ matrix.trozo }}/${{ needs.plan.outputs.n }}
    runs-on: ubuntu-latest
    # Un trozo de la entera lleva unos 9-17 min de pruebas; uno solo con la
    # suite entera (si alguna vez hiciera falta), 35. La preparación, hasta 10.
    # Y, mientras queden ramas con la e2e de antes, hasta 15 esperando a que
    # una de aquellas deje de escribir en la plantilla (carril.sh plantilla-coger).
    # Y, con el tope de carriles (ver LA COLA), hasta 15 más esperando su turno.
    # Y cada fichero, lo que tarde en acabar de aplicarse algo (por-fichero.sh).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        trozo: ${{ fromJSON(needs.plan.outputs.trozos) }}
    env:
      E2E_FRENTE: ${{ needs.plan.outputs.frente }}
      E2E_PRUEBAS: ${{ needs.plan.outputs.pruebas }}
      # Julio, 26/10: en un push, un fallo por tiempo fuera de la zona del PR no bloquea (por-fichero.sh).
      E2E_ZONA: ${{ needs.plan.outputs.zona }}
      E2E_PROPIAS: ${{ needs.plan.outputs.propias }}
      TROZO: ${{ matrix.trozo }}
      TROZOS: ${{ needs.plan.outputs.n }}
      # Cuántos trozos a la vez en todo staging (ver LA COLA). Un ajuste, no código.
      CARRIL_MAX: ${{ vars.E2E_CARRILES || '2' }}
      CARRIL_YO: "run ${{ github.run_id }}/${{ github.run_attempt }} · trozo ${{ matrix.trozo }}/${{ needs.plan.outputs.n }} · ${{ github.ref_name }}"
    steps:
      - uses: actions/checkout@v4

      - name: Guarda 1 y 2 · el secreto apunta a staging-conta y no a producción
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then echo "::error::Falta STAGING_CONTA_DB_URL."; exit 1; fi
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ["DB_URL"])
          for parte in (os.environ["DB_URL"], u.password, u.username, u.hostname):
              if parte:
                  print(f"::add-mask::{parte}")
          PY
          case "$DB_URL" in *"$PROD_REF"*) echo "::error::La URL apunta a PRODUCCIÓN."; exit 1 ;; esac
          case "$DB_URL" in *"$STAGING_REF"*) echo "La URL es de staging-conta." ;; *) echo "::error::La URL no es de staging-conta."; exit 1 ;; esac

      - name: Instalar psql 17
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Build contra staging-conta
        run: npm run build

      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Trozo · qué ficheros le tocan
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          node scripts/e2e/trozos.mjs reparto "$TROZO" "$TROZOS" ${E2E_PRUEBAS:-} > "$RUNNER_TEMP/ficheros.txt"
          node scripts/e2e/trozos.mjs todos ${E2E_PRUEBAS:-} > "$RUNNER_TEMP/todos.txt"
          mkdir -p e2e-lista && cp "$RUNNER_TEMP/ficheros.txt" "e2e-lista/trozo-$TROZO.txt" && cp "$RUNNER_TEMP/todos.txt" "e2e-lista/todos-$TROZO.txt"
          echo "E2E_FICHEROS=$(tr '\n' ' ' < "$RUNNER_TEMP/ficheros.txt")" >> "$GITHUB_ENV"
          sed 's/^/  · /' "$RUNNER_TEMP/ficheros.txt"

      - name: Guarda 3 · al otro lado no hay cuentas de producción
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          r=$(/usr/lib/postgresql/17/bin/psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from public.accounts where id in ('51ad1792-6629-4ef7-833a-b57b09a86710','00000000-0000-0000-0000-000000000001')")
          if [ "$r" != "0" ]; then echo "::error::Al otro lado hay cuentas de producción. Abortado."; exit 1; fi

      # W02 (1c): cuánto aprieta la e2e a staging (Micro), medido desde el trozo
      # 1: consultas a la vez, conexiones y ocupación de la base cada 5 s.
      - name: Carga · empezar a medir (trozo 1)
        if: matrix.trozo == 1
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: scripts/e2e/carga.sh empezar

      # El nombre empieza por «Carril · esperar»: scripts/e2e/medir_esperas.py
      # cuenta su duración como la espera (antes era «Cerrojo · esperar»).
      # Ya no espera a que nadie migre (V03, respuesta 6, 26/10): solo a que
      # quede un carril libre, como mucho 15 min.
      - name: Carril · esperar su turno y coger uno
        timeout-minutes: 60
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          scripts/e2e/carril.sh coger
          echo "E2E_CARRIL=$(cat "$RUNNER_TEMP/carril/numero")" >> "$GITHUB_ENV"

      - name: Carril · clonar las cuentas de prueba (con la contraseña de un solo uso)
        timeout-minutes: 30
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          CLAVE=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "::add-mask::$CLAVE"
          echo "CLAVE_PRUEBAS=$CLAVE" >> "$GITHUB_ENV"
          # El clon lee la plantilla: con la barrera cogida, para que no se
          # aplique nada a medio copiar. Orden siempre el mismo: primero la
          # barrera, luego el cerrojo de antes (como aplicar-staging-conta).
          BARRERA_QUE=clonar scripts/e2e/carril.sh barrera-entrar
          # Transición: que ninguna e2e de las de antes esté escribiendo en la
          # plantilla mientras se copia. Lo suelta el clon, al acabar.
          scripts/e2e/carril.sh plantilla-coger
          # Lo que dejó un run cortado con este mismo número, fuera; luego el clon.
          scripts/e2e/carril.sh borrar
          CLAVE_PRUEBAS="$CLAVE" scripts/e2e/carril.sh clonar
          scripts/e2e/carril.sh barrera-salir
          CLAVE_PRUEBAS="$CLAVE" node scripts/e2e/carril-entrar.mjs "$E2E_CARRIL"

      # Lo que se escribe después de esta marca es lo que ha sacado este trozo.
      - name: Capturas · la marca
        run: touch "$RUNNER_TEMP/capturas.marca"

      # Fichero a fichero, cada uno con la barrera cogida solo mientras corre
      # (scripts/e2e/por-fichero.sh): si se está aplicando algo a staging, el
      # fichero siguiente espera a que acabe, y lo apunta en el resumen.
      - name: Pruebas (ordenador y móvil)
        timeout-minutes: 120
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          echo "PRUEBAS_DESDE=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_ENV"
          scripts/e2e/por-fichero.sh "$RUNNER_TEMP/ficheros.txt" "$TROZO"

      # Pase lo que pase: también si las pruebas fallan o el run se cancela.
      # Si ni esto llega a correr, el carril lo borra el próximo que lo coja y
      # los cerrojos se sueltan al caerse la conexión.
      - name: Carril · borrar y soltar (pase lo que pase)
        if: always()
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          [ -s "$RUNNER_TEMP/carril/guardian.pid" ] || [ -s "$RUNNER_TEMP/carril/numero" ] || { echo "Este trozo no llegó a coger carril."; exit 0; }
          scripts/e2e/carril.sh soltar

      - name: Carga · lo medido mientras corrían las pruebas (trozo 1)
        if: always() && matrix.trozo == 1
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: scripts/e2e/carga.sh acabar "${PRUEBAS_DESDE:-}"

      - name: Informe de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.trozo }}
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Informe para juntar y la lista del trozo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trozo-${{ matrix.trozo }}
          path: |
            blob-report
            e2e-lista
          retention-days: 3

      # En cada trozo, pase lo que pase: lo que ha sacado, como artefacto.
      - name: Capturas · las de este run
        id: recoger
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/capturas.marca" ]; then
            node scripts/conta/capturas.mjs recoger "$RUNNER_TEMP/capturas.marca" "$RUNNER_TEMP/capturas"
          else
            echo "Las pruebas no llegaron a empezar: no hay capturas."; echo "n=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Capturas · artefacto
        id: artefacto
        if: always() && steps.recoger.outputs.n != '' && steps.recoger.outputs.n != '0'
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ matrix.trozo }}
          path: ${{ runner.temp }}/capturas
          retention-days: 3

  # Junta los trozos: una sola respuesta para el run. En verde solo si los N
  # trozos están en verde en este commit y entre todos han pasado TODOS los
  # ficheros, una vez cada uno.
  entera:
    needs: [plan, trozo]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.toca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Entera · los trozos, todos en verde y sin faltar ni sobrar ningún fichero
        id: trozos
        env:
          RESULTADO: ${{ needs.trozo.result }}
          N: ${{ needs.plan.outputs.n }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Cómo salió cada trozo, en ESTE intento.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            -q '.jobs[] | select(.name | startswith("trozo ")) | "\(.name)\t\(.conclusion // .status)"' | sort > "$RUNNER_TEMP/trozos.tsv"
          {
            echo "### Los trozos de este run"
            echo
            echo '| trozo | resultado |'; echo '|---|---|'
            sed 's/\t/ | /; s/^/| /; s/$/ |/' "$RUNNER_TEMP/trozos.tsv"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "intento=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if [ "$RESULTADO" != success ]; then
            echo "::error::No todos los trozos están en verde ($RESULTADO): esto no es una entera en verde."; exit 1
          fi

      - name: Entera · juntar las listas
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: trozo-*
          path: ${{ runner.temp }}/trozos
          merge-multiple: true

      - name: Entera · entre los trozos están todos los ficheros, una vez cada uno
        if: always()
        env:
          N: ${{ needs.plan.outputs.n }}
        run: |
          set -euo pipefail
          L="$RUNNER_TEMP/trozos/e2e-lista"
          [ "$(ls "$L"/trozo-*.txt | wc -l)" = "$N" ] || { echo "::error::Faltan listas de trozos: hay $(ls "$L"/trozo-*.txt | wc -l) de $N."; exit 1; }
          # Todos calcularon la misma suite.
          for f in "$L"/todos-*.txt; do cmp -s "$f" "$L/todos-1.txt" || { echo "::error::Los trozos no calcularon la misma suite ($f)."; exit 1; }; done
          cat "$L"/trozo-*.txt | grep -v '^$' | sort > "$RUNNER_TEMP/pasados.txt"
          sort "$L/todos-1.txt" | grep -v '^$' > "$RUNNER_TEMP/todos.txt"
          if ! diff -u "$RUNNER_TEMP/todos.txt" "$RUNNER_TEMP/pasados.txt"; then
            echo "::error::Entre los trozos no están todos los ficheros una vez cada uno (arriba, la diferencia)."; exit 1
          fi
          echo "Los $N trozos han pasado los $(wc -l < "$RUNNER_TEMP/todos.txt") ficheros, una vez cada uno." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 22
          cache: npm

      - name: Informe · juntar los de los trozos
        if: always()
        run: |
          set -euo pipefail
          npm ci --ignore-scripts > /dev/null
          if ls "$RUNNER_TEMP"/trozos/blob-report/*.zip > /dev/null 2>&1; then
            npx playwright merge-reports --reporter html "$RUNNER_TEMP/trozos/blob-report"
            # Las mismas pruebas, ahora y en la entera en serie del 16/10.
            PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/informe.json" npx playwright merge-reports --reporter json "$RUNNER_TEMP/trozos/blob-report"
            node scripts/e2e/inflacion.mjs "$RUNNER_TEMP/informe.json" | tee -a "$GITHUB_STEP_SUMMARY"
            # Lo que no tenía tiempo, medido con la misma vara (27/10): sale como
            # artefacto «tiempos-propuestos» para sacarlo de «sin medir». Un PR
            # con una e2e nueva no apunta nada: lo mide la entera.
            node scripts/e2e/inflacion.mjs "$RUNNER_TEMP/informe.json" --nuevos "$RUNNER_TEMP/tiempos-propuestos" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Ningún trozo dejó informe."
          fi

      - name: Informe de Playwright (los trozos juntos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Tiempos propuestos (un fichero por prueba sin medir, para tests/e2e/tiempos/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiempos-propuestos
          path: ${{ runner.temp }}/tiempos-propuestos
          retention-days: 14
          if-no-files-found: ignore

      # El mismo informe en JSON: lo lee el aviso de la noche (qué prueba, qué fichero).
      - name: Informe en JSON (para el aviso de la noche)
        if: always() && (github.event_name == 'schedule' || inputs.repite != '')
        uses: actions/upload-artifact@v4
        with:
          name: informe-json
          path: ${{ runner.temp }}/informe.json
          retention-days: 14
          if-no-files-found: ignore

      # Las capturas de todos los trozos, en su sitio del repositorio (para
      # publicarlas) y en un solo artefacto.
      - name: Capturas · juntar las de los trozos
        id: juntar
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: capturas-*
          path: ${{ runner.temp }}/capturas
          merge-multiple: true

      - name: Capturas · las de este run
        id: recoger
        if: always()
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/capturas" ]; then
            cp -r "$RUNNER_TEMP/capturas/." .
            echo "n=$(find "$RUNNER_TEMP/capturas" -type f | wc -l)" >> "$GITHUB_OUTPUT"
          else
            echo "Ningún trozo sacó capturas."; echo "n=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Capturas · artefacto
        id: artefacto
        if: always() && steps.recoger.outputs.n != '' && steps.recoger.outputs.n != '0'
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: ${{ runner.temp }}/capturas
          retention-days: 30

      # W08b (Julio, 28/10): las del frente, FUERA del PR. Un árbol con solo
      # ésas, hecho en un índice aparte (no toca el checkout), en un commit sin
      # padre que se empuja a la fuerza a capturas/<rama>: el bot reescribe esa
      # rama en cada run y la rama del PR no cambia (ni «Action required» ni
      # PNG que choquen con main). Solo en verde (los N trozos).
      - name: Capturas · publicar las del frente en capturas/<rama>
        id: publicar
        if: success() && steps.recoger.outputs.n != '0' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publicar_capturas))
        env:
          CAPTURAS_DUENO: ${{ inputs.frente }}
        run: |
          set -euo pipefail
          node scripts/conta/capturas.mjs suyas "$GITHUB_REF_NAME" "$RUNNER_TEMP/capturas" > "$RUNNER_TEMP/suyas.txt"
          if [ ! -s "$RUNNER_TEMP/suyas.txt" ]; then echo "Nada que publicar." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/indice-capturas"
          rm -f "$GIT_INDEX_FILE"
          xargs -a "$RUNNER_TEMP/suyas.txt" -d '\n' git add -f --
          ARBOL=$(git write-tree)
          unset GIT_INDEX_FILE
          COMMIT=$(git -c user.name=folvy-e2e -c user.email=e2e@folvy.invalid commit-tree "$ARBOL" -m "Capturas de $GITHUB_REF_NAME (${GITHUB_SHA::7}, run $GITHUB_RUN_ID)")
          git push -f -q origin "$COMMIT:refs/heads/capturas/$GITHUB_REF_NAME"
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Publicadas $(wc -l < "$RUNNER_TEMP/suyas.txt") en capturas/$GITHUB_REF_NAME (${COMMIT::7})." | tee -a "$GITHUB_STEP_SUMMARY"

      # Un solo comentario por PR, que se edita en cada run: el enlace al
      # artefacto y, si se han publicado, las del frente en miniatura.
      - name: Capturas · el enlace en el PR
        if: always() && steps.artefacto.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.artefacto.outputs.artifact-url }}
          N: ${{ steps.recoger.outputs.n }}
          ESTADO: ${{ job.status }}
          PUBLICADO: ${{ steps.publicar.outputs.sha }}
        run: |
          set -euo pipefail
          MARCA='<!-- capturas-e2e -->'
          if [ -n "$PUBLICADO" ]; then
            MINIATURAS="$(node scripts/conta/capturas.mjs comentario "$GITHUB_REPOSITORY" "$PUBLICADO" "$GITHUB_REF_NAME" "$RUNNER_TEMP/suyas.txt")"
          else
            MINIATURAS='Sin capturas del frente publicadas en este run (en rojo, o la rama no es de ningún frente): están todas en el artefacto.'
          fi
          T="$(printf '%s\n**Capturas de la e2e** · run [%s](%s/%s/actions/runs/%s) · `%s` · %s\n\n%s capturas de este run: [descargar el artefacto](%s) (caduca a los 30 días).\n\n%s' \
            "$MARCA" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "${GITHUB_SHA::7}" "$([ "$ESTADO" = success ] && echo 'en verde' || echo "en $ESTADO")" "$N" "$URL" "$MINIATURAS")"
          echo "$T" >> "$GITHUB_STEP_SUMMARY"
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number -q '.[0].number')
          if [ -z "$PR" ]; then echo "La rama no tiene PR abierto: el enlace queda en el resumen del run."; exit 0; fi
          ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -q ".[] | select(.body | startswith(\"$MARCA\")) | .id" | tail -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$T" > /dev/null; echo "Comentario del PR #$PR actualizado."
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$T" > /dev/null; echo "Comentario en el PR #$PR."
          fi

  # LA NOCHE: verde, repetir o avisar (scripts/e2e/noche.mjs, Julio, 21/10).
  #   · verde: si había una incidencia abierta, lo dice en ella y la cierra;
  #   · repetir: todo lo que falló parece de staging (sesión, 520, una página
  #     HTML de la base) o no llegó a fallar ninguna prueba: relanza este
  #     workflow sobre main con esos ficheros, UNA vez («repite» = este run);
  #   · avisar: un fallo de verdad, o la repetición vuelve a fallar: la
  #     incidencia «e2e de la noche en rojo» con cada prueba, su fichero y el
  #     commit (una sola abierta: si ya hay, se comenta), y el run en rojo.
  aviso:
    needs: [plan, entera]
    if: always() && needs.plan.outputs.toca == 'true' && (github.event_name == 'schedule' || inputs.repite != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TITULO: 'e2e de la noche en rojo'
      TROZOS: ${{ needs.plan.result == 'success' && needs.entera.result || 'failure' }}
      REPITE: ${{ inputs.repite }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/e2e
          fetch-depth: 1

      - name: El informe de la noche
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: informe-json
          path: ${{ runner.temp }}/informe

      - name: Verde, repetir o avisar
        run: |
          set -euo pipefail
          export ENLACE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          export ENLACE_NOCHE="${REPITE:+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$REPITE}"
          export ASUNTO="$(git log -1 --format=%s "$GITHUB_SHA" 2>/dev/null || true)"
          INFORME="$RUNNER_TEMP/informe/informe.json"; [ -f "$INFORME" ] || INFORME=-
          node scripts/e2e/noche.mjs "$INFORME" --trozos "$TROZOS" --repeticion "${REPITE:-}" --cuerpo "$RUNNER_TEMP/aviso.md" > "$RUNNER_TEMP/decision.txt"
          cat "$RUNNER_TEMP/decision.txt"
          ACCION=$(sed -n 's/^accion=//p' "$RUNNER_TEMP/decision.txt")
          FICHEROS=$(sed -n 's/^ficheros=//p' "$RUNNER_TEMP/decision.txt")
          PORQUE=$(sed -n 's/^porque=//p' "$RUNNER_TEMP/decision.txt")
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITULO\" in:title" --json number -q '.[0].number')
          case "$ACCION" in
            verde)
              msg="La entera de la noche sobre main (\`${GITHUB_SHA::7}\`) en verde${REPITE:+, después de repetir lo que falló por staging en $ENLACE_NOCHE}."
              echo "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
              if [ -n "$n" ]; then
                gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Vuelve a verde. $msg $ENLACE"
                gh issue close "$n" --repo "$GITHUB_REPOSITORY"
              fi ;;
            repetir)
              echo "Se repite una vez, porque $PORQUE: ${FICHEROS:-la suite entera}." | tee -a "$GITHUB_STEP_SUMMARY"
              { echo; cat "$RUNNER_TEMP/aviso.md"; } >> "$GITHUB_STEP_SUMMARY"
              gh workflow run e2e-staging-conta.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f pruebas="$FICHEROS" -f repite="$GITHUB_RUN_ID" ;;
            avisar)
              cat "$RUNNER_TEMP/aviso.md" >> "$GITHUB_STEP_SUMMARY"
              if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/aviso.md"
              else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body-file "$RUNNER_TEMP/aviso.md"; fi
              echo "::error::La entera de la noche no ha salido en verde: aviso en la incidencia «$TITULO»."
              exit 1 ;;
            *) echo "::error::noche.mjs no ha decidido nada."; exit 1 ;;
          esac
