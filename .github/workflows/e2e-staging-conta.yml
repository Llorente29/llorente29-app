name: Pruebas e2e en staging-conta
run-name: "e2e · ${{ github.event_name == 'workflow_dispatch' && (inputs.pruebas == '' && 'entera' || inputs.pruebas) || 'frente' }} · ${{ github.ref_name }} · ${{ github.sha }}"

# QUÉ HACE
# Pasa las pruebas de extremo a extremo del módulo de contabilidad
# (tests/e2e, Playwright) contra staging-conta, en ordenador (1440 × 900) y en
# móvil (390 × 844). Las capturas que saca van como ARTEFACTO del run, con un
# comentario en el PR que da el enlace; a la rama solo van a mano (abajo).
#
# POR QUÉ AQUÍ Y NO EN EL CONTENEDOR DE DESARROLLO
# Desde ese contenedor no se llega a *.supabase.co (el proxy lo corta).
#
# CÓMO ENTRA, SIN NINGÚN SECRETO NUEVO
# Los cuatro usuarios de prueba (a.admin@, b.admin@, a.encargado@ y
# c.admin@prueba.folvy.test, de las semillas) reciben en cada ejecución una contraseña ALEATORIA, que se
# enmascara y no sale de este job.
#
# USUARIOS POR FRENTE (C06, respuesta 2 de Julio, 13/10)
# Los frentes A, B y C lanzan sus e2e a la vez. Con los mismos cuatro usuarios,
# cada ejecución le cambiaba la contraseña a la otra a mitad (400 y 429 al
# entrar). Ahora cada frente tiene sus dobles (seed_e2e_frentes_staging.sql:
# a.admin.frente-a@…, y su propia cuenta C sin empresa), y su e2e SOLO cambia
# la contraseña de los suyos. El frente sale de la rama (paso «Frente», una
# línea por frente); sin frente, los cuatro de siempre, como antes. La
# contraseña sigue siendo de un solo uso: no se ha aflojado ningún freno.
# Al empezar, e2e_limpieza.sql quita lo que dejaron runs cortados (más de 30
# minutos: nada que esté usando otra ejecución en marcha).
#
# Y EL CERROJO: medido el mismo día, los usuarios propios no bastan. Las
# cuentas A y B y el escenario de reparto son de todos, y dos ejecuciones
# enteras a la vez se rompen los datos. Cada una prepara a la vez (dependencias,
# build, navegador), pero lo que toca staging va de una en una: coge
# e2e.cerrojo, y la otra espera dentro de su job (no en la cola de GitHub).
# Ver el paso «Cerrojo». Se pone con el mismo y único secreto del
# otro workflow, STAGING_CONTA_DB_URL, y con las mismas tres guardas: la URL es
# de staging-conta, no es de producción, y al otro lado no hay ni Foodint ni
# Folvy Interno. La UPDATE solo toca esos cuatro usuarios, por id y por email.
#
# La URL y la clave anónima de staging-conta van escritas abajo: son públicas
# por diseño (las lleva cualquier navegador que abra la app) y no dan acceso a
# nada que la RLS no permita. No sirven para producción.
#
# CUÁNDO SE DISPARA
# Un push a conta/** que toque la app, las pruebas o este workflow. Y a mano
# (workflow_dispatch) desde la rama: cuando lo que cambia es staging —una
# semilla rehecha por aplicar-staging-conta— y no el código (12/10, C04 R3).
#
# QUÉ CORRE (C06b, respuesta 6 de Julio, tarea 5 · 14/10)
# La suite entera tarda unos 20 minutos y los tres frentes hacían cola en el
# cerrojo. Ahora:
#   · en un PUSH de una rama de frente corre solo su carpeta y el juego común
#     (el marco y el arranque del C00, y la RLS entre cuentas):
#       conta/b01-* → tests/e2e/conta/b01 · conta/d01-* → tests/e2e/conta/d01
#       conta/c06*  → tests/e2e/conta/c06
#     Una rama sin frente sigue corriendo la suite entera.
#   · la SUITE ENTERA corre a mano (workflow_dispatch con «pruebas» vacío),
#     antes de pedir tanda o abrir un PR a main. El título del run lo dice
#     («entera»), y scripts/conta/e2e-entera.mjs comprueba que hay una en verde
#     del mismo commit (antes-de-subir.sh, con PEDIR_TANDA=1).
#
# LAS CAPTURAS (C06b, Julio, 15/10): «capturas: artefacto en cada push y fijar
# las de tu frente antes del informe».
#   · En CADA run, las capturas que ha sacado ese run (las escritas después de
#     la marca) van en el artefacto «capturas», 30 días, y un comentario del PR
#     (uno solo, que se va editando) da el enlace. Nunca un commit en la rama.
#   · Antes de dar su informe, la sesión lanza este workflow a mano con
#     «fijar_capturas»: si sale verde, commitea SOLO la carpeta del frente de
#     la rama (scripts/conta/capturas.mjs fijar), y Julio las ve en «Files
#     changed». Las de otros frentes de ese run se quedan en el artefacto.
# Por qué: cada e2e commiteaba todas sus capturas, también las de otros
# frentes, y un PNG cambia unos bytes en cada pasada: el #194 chocó con main en
# 12 PNG de b01 y c00. Las que ya están en el repositorio se quedan.

on:
  push:
    # reparto-**: el R02 (quién reparte), con sus pruebas en tests/e2e/reparto.
    branches: ['conta/**', 'reparto-**']
    paths:
      - 'src/**'
      - 'supabase/seeds/reparto/seed_r02_e2e.sql'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e-staging-conta.yml'
  workflow_dispatch:
    inputs:
      # Carpetas o ficheros de tests/e2e, separados por espacios (vacío = la suite entera).
      pruebas:
        description: 'Carpetas o ficheros de tests/e2e, separados por espacios (vacío = la suite ENTERA)'
        type: string
        required: false
        default: ''
      # El frente sale de la rama; esto lo fuerza (para probar dos frentes a
      # la vez desde una misma rama). Vacío = el de la rama.
      frente:
        description: 'Frente (a, b o c). Vacío = el de la rama'
        type: string
        required: false
        default: ''
      # Antes del informe: commitea en la rama las capturas de SU frente (solo esas).
      fijar_capturas:
        description: 'Fijar en la rama las capturas del frente de la rama (antes del informe)'
        type: boolean
        required: false
        default: false

# Un push nuevo ESPERA en cola: no cancela el e2e que está corriendo (C05,
# respuesta 3). GitHub deja como mucho uno en espera por rama: si llegan dos,
# el de en medio se descarta y corre el último, que lleva todo lo anterior.
# Con el frente en el grupo: dos frentes forzados desde la misma rama no se
# esperan (cada uno toca solo sus usuarios).
concurrency:
  group: e2e-staging-conta-${{ github.ref }}-${{ inputs.frente }}
  cancel-in-progress: false

permissions:
  contents: write
  # El comentario del PR con el enlace al artefacto de las capturas.
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 40: las 164 pruebas tardan unos 18 min y la preparación (fuentes y navegador)
    # llegó a tardar 9,5 el 08/10 (run 37801003944, cortado en la 142 sin ningún fallo).
    # 100: las pruebas tardan unos 20-25 min, la preparación hasta 10, y con
    # el cerrojo (abajo) se puede esperar hasta 60 a que acabe otra.
    timeout-minutes: 100
    env:
      STAGING_REF: oseymswjlzplqoxrfjzi
      PROD_REF: xzmpnchlguibclvxyynt
      VITE_SUPABASE_URL: https://oseymswjlzplqoxrfjzi.supabase.co
      # Solo a mano; en un push, vacías: todas las pruebas y el frente de la rama.
      PRUEBAS: ${{ inputs.pruebas }}
      FRENTE_PEDIDO: ${{ inputs.frente }}
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zZXltc3dqbHpwbHFveHJmanppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODYzNzUsImV4cCI6MjEwNjQ2MjM3NX0.xszvWohb2R7MWidy1ZsIL0IZg2E55aQSFRc1WX8A4js
    steps:
      - uses: actions/checkout@v4

      - name: Guarda 1 y 2 · el secreto apunta a staging-conta y no a producción
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then echo "::error::Falta STAGING_CONTA_DB_URL."; exit 1; fi
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ["DB_URL"])
          for parte in (os.environ["DB_URL"], u.password, u.username, u.hostname):
              if parte:
                  print(f"::add-mask::{parte}")
          PY
          case "$DB_URL" in *"$PROD_REF"*) echo "::error::La URL apunta a PRODUCCIÓN."; exit 1 ;; esac
          case "$DB_URL" in *"$STAGING_REF"*) echo "La URL es de staging-conta." ;; *) echo "::error::La URL no es de staging-conta."; exit 1 ;; esac

      - name: Frente (de la rama, o el pedido a mano)
        run: |
          set -euo pipefail
          # Una línea por frente. Una rama que no casa con ninguna usa los
          # usuarios de siempre (como antes de existir los frentes).
          case "$GITHUB_REF_NAME" in
            conta/d[0-9]*)              FRENTE=a ;;  # A · facturas recibidas (D01…)
            conta/b[0-9]*)              FRENTE=b ;;  # B · bancos (B01…)
            conta/c06*|conta/f[0-9]*)   FRENTE=c ;;  # C · contabilidad sola y facturas emitidas (C06, F01…)
            *)                          FRENTE= ;;
          esac
          if [ -n "${FRENTE_PEDIDO:-}" ]; then
            case "$FRENTE_PEDIDO" in a|b|c) FRENTE="$FRENTE_PEDIDO" ;; *) echo "::error::«frente» tiene que ser a, b o c (o nada)."; exit 1 ;; esac
          fi
          # En un push de una rama de frente: su carpeta y el juego común (tarea 5).
          COMUN="tests/e2e/conta/c00/marco.spec.ts tests/e2e/conta/rls.spec.ts"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -z "${PRUEBAS:-}" ]; then
            case "$GITHUB_REF_NAME" in
              conta/b01-*) PRUEBAS="tests/e2e/conta/b01 $COMUN" ;;
              conta/d01-*) PRUEBAS="tests/e2e/conta/d01 $COMUN" ;;
              conta/c06*)  PRUEBAS="tests/e2e/conta/c06 $COMUN" ;;
            esac
          fi
          for p in ${PRUEBAS:-}; do
            if ! [[ "$p" =~ ^tests/e2e/[A-Za-z0-9_./-]*$ ]] || [[ "$p" == *..* ]]; then
              echo "::error::«pruebas» son carpetas o ficheros de tests/e2e separados por espacios (o nada): «$p» no lo es."; exit 1
            fi
          done
          echo "E2E_FRENTE=$FRENTE" >> "$GITHUB_ENV"
          echo "E2E_PRUEBAS=${PRUEBAS:-}" >> "$GITHUB_ENV"
          echo "Frente: ${FRENTE:-ninguno (los usuarios de siempre)} · pruebas: ${PRUEBAS:-la suite entera}"

      - name: Instalar psql 17
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Build contra staging-conta
        run: npm run build

      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      # EL CERROJO (C06, respuesta 2). Las cuentas A y B y el escenario de
      # reparto son de todos los frentes: medido el 13/10, dos ejecuciones a la
      # vez se rompen los datos la una a la otra aunque cada una entre con sus
      # usuarios. Así que lo que toca datos compartidos (la siembra del reparto
      # y las pruebas) va de una en una: se coge el cerrojo de staging
      # (e2e.cerrojo), y la otra ESPERA dentro de su job —no en la cola de
      # GitHub, que cancela las pendientes—. Se suelta al acabar, pase lo que
      # pase; si una ejecución muere sin soltarlo, caduca a los 50 minutos.
      - name: Cerrojo · esperar a que no haya otra e2e en staging y cogerlo
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          YO="run ${GITHUB_RUN_ID} · ${GITHUB_REF_NAME} · frente ${E2E_FRENTE:-ninguno}"
          echo "CERROJO_YO=$YO" >> "$GITHUB_ENV"
          # Como mucho 120 intentos cada 30 s (una hora). Lo cogido caduca a los 50 min.
          CERROJO_YO="$YO" scripts/e2e/cerrojo.sh coger

      - name: Guarda 3 y contraseña de un solo uso para los usuarios de prueba
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/17/bin/psql
          r=$("$PSQL" "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from public.accounts where id in ('51ad1792-6629-4ef7-833a-b57b09a86710','00000000-0000-0000-0000-000000000001')")
          if [ "$r" != "0" ]; then echo "::error::Al otro lado hay cuentas de producción. Abortado."; exit 1; fi
          CLAVE=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "::add-mask::$CLAVE"
          # Solo los usuarios de ESTE frente: los dobles e2e0000<f>… (y, en el
          # C, los tres del C06 si su semilla está: los dos de las cuentas solas y
          # el administrador de plataforma de prueba, que invita en el recorrido
          # de la tarea 6). Sin frente, los cuatro de
          # siempre. Nunca los de otro frente.
          n=$("$PSQL" "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -v clave="$CLAVE" -v frente="${E2E_FRENTE:-}" <<'SQL'
          with c as (
            update auth.users set encrypted_password = extensions.crypt(:'clave', extensions.gen_salt('bf'))
             where case when :'frente' = '' then
                     id in ('c01a0000-0000-4000-8000-0000000000a1', 'c01b0000-0000-4000-8000-0000000000b1',
                            'c01a0000-0000-4000-8000-0000000000a6', 'c01c0000-0000-4000-8000-0000000000c1')
                     and email in ('a.admin@prueba.folvy.test', 'b.admin@prueba.folvy.test',
                                   'a.encargado@prueba.folvy.test', 'c.admin@prueba.folvy.test')
                   else
                     (id::text like 'e2e0000' || :'frente' || '-0000-4000-8000-0000000000%'
                      and email like '%.frente-' || :'frente' || '@prueba.folvy.test')
                     or (:'frente' = 'c'
                         and id in ('c0600000-0000-4000-8000-0000000000a1', 'c0600000-0000-4000-8000-0000000000b1',
                                    'c0600000-0000-4000-8000-0000000000f0')
                         and email in ('sola.admin@c06-prueba.test', 'sola.alta@c06-prueba.test', 'c06.plataforma@c06-prueba.test'))
                   end
            returning 1)
          select count(*) from c;
          SQL
          )
          n=$(echo "$n" | tr -d '[:space:]')
          # Sin frente: los dos administradores (C01), el encargado de A (C00,
          # tarea 8) y el administrador de C, sin empresa (C00, respuesta 3).
          # Con frente: sus cuatro dobles; el C, 7 cuando está la semilla del C06.
          case "${E2E_FRENTE:-}:$n" in
            :4|a:4|b:4|c:4|c:7) ;;
            :*) echo "::error::Esperaba los 4 usuarios de siempre y he tocado $n."; exit 1 ;;
            *)  echo "::error::Esperaba los 4 usuarios del frente ${E2E_FRENTE} (7 en el C con el C06) y he tocado $n. ¿Está aplicada seed_e2e_frentes_staging.sql?"; exit 1 ;;
          esac
          echo "CLAVE_PRUEBAS=$CLAVE" >> "$GITHUB_ENV"
          echo "Contraseña de un solo uso puesta a los $n usuarios del frente ${E2E_FRENTE:-de siempre}."
          # Lo que dejaron runs cortados (más de 30 minutos), de cualquier frente.
          "$PSQL" "$DB_URL" -X -v ON_ERROR_STOP=1 -1 -q -f supabase/seeds/conta/e2e_limpieza.sql

      # R02: el escenario de reparto, igual en cada ejecución (pedidos vivos de
      # hoy, celdas como las dejó la migración, sin respuestas a Folvy). Dentro
      # del cerrojo: volver a sembrarlo a mitad de otra ejecución la rompe.
      - name: Escenario del R02
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${E2E_PRUEBAS:-}" ] || [[ " $E2E_PRUEBAS" == *" tests/e2e/reparto"* ]]; then
            if [ -f supabase/seeds/reparto/seed_r02_e2e.sql ]; then
              /usr/lib/postgresql/17/bin/psql "$DB_URL" -X -v ON_ERROR_STOP=1 -1 -q -f supabase/seeds/reparto/seed_r02_e2e.sql
              echo "Escenario del R02 preparado."
            fi
          else
            echo "Sin pruebas de reparto en esta ejecución: el escenario no se toca."
          fi

      # Lo que se escribe después de esta marca es lo que ha sacado este run.
      - name: Capturas · la marca
        run: touch "$RUNNER_TEMP/capturas.marca"

      - name: Pruebas (ordenador y móvil)
        run: npx playwright test ${E2E_PRUEBAS:-}

      # Pase lo que pase: también si las pruebas fallan o el run se cancela
      # (always() corre en los dos casos; medido el 13/10 cancelando 38457342932,
      # que lo tenía: quedó libre). Si ni esto llega a correr, caduca solo.
      - name: Cerrojo · soltarlo (pase lo que pase)
        if: always()
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          [ -n "${CERROJO_YO:-}" ] || { echo "Este run no llegó a pedir el cerrojo."; exit 0; }
          scripts/e2e/cerrojo.sh soltar

      - name: Informe de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

      # En cada run, pase lo que pase: lo que ha sacado, como artefacto.
      - name: Capturas · las de este run
        id: recoger
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/capturas.marca" ]; then
            node scripts/conta/capturas.mjs recoger "$RUNNER_TEMP/capturas.marca" "$RUNNER_TEMP/capturas"
          else
            echo "Las pruebas no llegaron a empezar: no hay capturas."; echo "n=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Capturas · artefacto
        id: artefacto
        if: always() && steps.recoger.outputs.n != '' && steps.recoger.outputs.n != '0'
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: ${{ runner.temp }}/capturas
          retention-days: 30

      # Un solo comentario por PR, que se edita en cada run: el enlace, no los PNG.
      - name: Capturas · el enlace en el PR
        if: always() && steps.artefacto.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.artefacto.outputs.artifact-url }}
          N: ${{ steps.recoger.outputs.n }}
          ESTADO: ${{ job.status }}
        run: |
          set -euo pipefail
          MARCA='<!-- capturas-e2e -->'
          T="$(printf '%s\n**Capturas de la e2e** · run [%s](%s/%s/actions/runs/%s) · `%s` · %s\n\n%s capturas de este run: [descargar el artefacto](%s) (caduca a los 30 días).\n\nPara verlas en «Files changed», antes del informe: Actions → «Pruebas e2e en staging-conta» → Run workflow en esta rama con **fijar_capturas**. Solo se fijan las del frente de la rama.' \
            "$MARCA" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "${GITHUB_SHA::7}" "$([ "$ESTADO" = success ] && echo 'en verde' || echo "en $ESTADO")" "$N" "$URL")"
          echo "$T" >> "$GITHUB_STEP_SUMMARY"
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number -q '.[0].number')
          if [ -z "$PR" ]; then echo "La rama no tiene PR abierto: el enlace queda en el resumen del run."; exit 0; fi
          ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -q ".[] | select(.body | startswith(\"$MARCA\")) | .id" | tail -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$T" > /dev/null; echo "Comentario del PR #$PR actualizado."
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$T" > /dev/null; echo "Comentario en el PR #$PR."
          fi

      # Solo a mano y solo en verde: las del frente de la rama, y ninguna más.
      - name: Capturas · fijar las del frente en la rama
        if: success() && github.event_name == 'workflow_dispatch' && inputs.fijar_capturas
        run: |
          set -euo pipefail
          git config user.name "folvy-e2e"
          git config user.email "e2e@folvy.invalid"
          node scripts/conta/capturas.mjs fijar "$GITHUB_REF_NAME"
          if git diff --cached --quiet; then echo "Las capturas del frente no han cambiado."; exit 0; fi
          git commit -m "Capturas fijadas en staging-conta (${GITHUB_SHA::7}, frente de ${GITHUB_REF_NAME})"
          # Lo de otros frentes no se sube: se descarta antes de traer la rama.
          git restore --worktree -- docs/conta/capturas docs/reparto/capturas 2>/dev/null || true
          git clean -fdq -- docs/conta/capturas docs/reparto/capturas
          # Si alguien ha empujado a la rama mientras tanto: las de este run (-X theirs, en un rebase, son las nuestras).
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
