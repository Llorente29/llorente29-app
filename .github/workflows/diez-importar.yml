# .github/workflows/diez-importar.yml
#
# C04b · T3 · La tanda del histórico de Diez (Julio, 12/10).
#
#   · Los datos reales NUNCA van a staging (regla de Julio).
#   · En producción, primero el ENSAYO: todo en una transacción que se deshace
#     al final. Mide contra los cuatro Excel de sumas y saldos (por huella,
#     testigo-huellas.json), da el informe (recuentos, rechazos con su motivo,
#     documentos esperados y la marca de negativos) y no deja nada escrito: lo
#     comprueba contando antes y después.
#   · El REAL solo se lanza con un ensayo EN VERDE del MISMO commit, como el
#     resto de tandas; y aun así, si no cuadra, se deshace y sale en rojo.
#
# Al empujar a la rama del encargo (scripts del importador), un ensayo
# SIMULADO en staging: el Diez de mentira con datos inventados
# (importar-simulado.mjs) y la empresa de la cuenta A de pruebas. Prueba el
# camino entero sin un dato real.
#
# Secretos: PROD_CONTA_DB_URL y DIEZ_LECTURA (producción), STAGING_CONTA_DB_URL
# (simulado). Ninguno llega a la línea de órdenes que se ve.
#
# C06 · PARA CUALQUIER EMPRESA (encargo C06, tarea 5; freno autorizado por
# Julio en la respuesta 1). Nada de una empresa escrito aquí:
#   · empresa, desde, hasta y corte son entradas; la BASE de Diez no: sale de
#     conta_diez_base (la que Folvy registró para esa empresa, con registro).
#   · el secreto: DIEZ_LECTURA, o DIEZ_LECTURA_<secreto> si la empresa tiene
#     el suyo (su propio acceso a apiCON).
#   · el real lleva en «autorizo» «historico-diez» si la base es la C0008 (como
#     hasta hoy) y «historico-diez-<base>» si es otra: el autorizo es por
#     empresa. Y solo con un ensayo en verde del mismo commit Y de la misma
#     empresa.
#   · el testigo es el de la base (testigo-huellas.json para la C0008). Sin
#     testigo, la tanda no sale en verde.
#   · «preparar» (producción, con «produccion» y «preparar-diez-<base>»):
#     registra la base de la empresa (conta_diez_base_poner, con su motivo y
#     quién lanzó el run) y deja su ejercicio del corte «mixto de Diez»
#     (conta_diez_preparar_corte: solo en una empresa limpia). Las dos cosas en
#     UNA transacción. Sin ningún id de cliente en el repositorio.
#   · En staging, a mano: «simulado-staging» (el Diez de mentira contra la
#     empresa que se diga, pasos 1 y 2 en ensayo) y «lectura-staging» (lee la
#     C0009 de verdad, SOLO GET y solo el paso 1: nada se escribe en staging;
#     la empresa tiene que tener registrada la C0009).

name: 'Diez · tanda del histórico (C04b)'
run-name: "Diez · histórico · ${{ github.event_name == 'workflow_dispatch' && format('{0} · {1}', inputs.modo, inputs.empresa) || 'simulado en staging' }}"

on:
  push:
    branches: ['conta/c04b-diez']
    paths:
      - 'scripts/conta/diez/importar*'
      - 'scripts/conta/diez/testigo-huellas.json'
      - 'supabase/functions/_shared/diezImportar.ts'
      - 'supabase/functions/_shared/diezMapeo.ts'
      - '.github/workflows/diez-importar.yml'
  workflow_dispatch:
    inputs:
      modo:
        description: 'preparar / ensayo / real (producción) · simulado-staging / lectura-staging (staging)'
        required: true
        default: ensayo
        type: choice
        options: [preparar, ensayo, real, simulado-staging, lectura-staging]
      empresa:
        description: 'Id de la empresa (company.id). Vacío: la única con base de Diez registrada (hoy, Foodint).'
        required: false
        type: string
      desde:
        description: 'Primer mes a leer (AAAAMM). Vacío: lo último usado con esa empresa.'
        required: false
        type: string
      hasta:
        description: 'Último mes a leer (AAAAMM). Vacío: lo último usado con esa empresa.'
        required: false
        type: string
      corte:
        description: 'Fecha de corte (AAAA-MM-DD). Vacío: lo último usado con esa empresa. En «preparar», obligatoria.'
        required: false
        type: string
      secreto:
        description: 'Vacío = DIEZ_LECTURA. Si la empresa tiene su acceso: el sufijo de DIEZ_LECTURA_<sufijo>'
        required: false
        type: string
      confirmo:
        description: 'En producción, escribe «produccion»'
        required: false
        type: string
      autorizo:
        description: 'Real: «historico-diez» (C0008) o «historico-diez-<base>». Preparar: «preparar-diez-<base>»'
        required: false
        type: string
      base:
        description: 'Solo en «preparar»: la base de Diez de la empresa (C y cuatro cifras; C0001 nunca)'
        required: false
        type: string
      motivo:
        description: 'Solo en «preparar»: por qué se registra esa base (queda en el registro)'
        required: false
        type: string

# Una tanda a la vez, y una en marcha no se cancela.
concurrency:
  group: diez-importar
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  # W09: psql y pg_dump dejan de esperar a conectar a los 15 s (el #728 esperó casi una hora).
  PGCONNECT_TIMEOUT: '15'
  PROD_REF: xzmpnchlguibclvxyynt
  STAGING_REF: oseymswjlzplqoxrfjzi
  PSQL: /usr/lib/postgresql/17/bin/psql
  PGAPPNAME: gha-diez-historico-${{ github.run_id }}

jobs:
  simulado:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMPRESA: 3b34403a-a7d6-4a48-a8d7-737e8cababdc # cuenta A de pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guarda · el secreto apunta a STAGING
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${DB_URL:-}" ] || { echo "::error::Falta STAGING_CONTA_DB_URL."; exit 1; }
          python3 - <<'PY'
          import os, urllib.parse as u
          p = u.urlsplit(os.environ["DB_URL"])
          for x in (os.environ["DB_URL"], p.password, p.username, p.hostname):
              if x: print(f"::add-mask::{x}")
          PY
          case "$DB_URL" in *"$PROD_REF"*) echo "::error::La URL apunta a PRODUCCIÓN. Abortado sin conectar."; exit 1 ;; esac
          case "$DB_URL" in *"$STAGING_REF"*) echo "Staging." ;; *) echo "::error::La URL no es de staging."; exit 1 ;; esac
      - name: Instalar psql 17
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Paso 1 · leer y preparar (Diez de mentira, datos inventados)
        env:
          DIEZ_FUENTE: simulado
          CARGA: /tmp/carga
          DIEZ_DESDE: '202310'
          DIEZ_HASTA: '202412'
          DIEZ_CORTE: '2024-12-30'
        run: npx --yes tsx@4.19.2 scripts/conta/diez/importar-preparar.ts > /tmp/informe.md
      - name: Paso 2 · escribir, medir y deshacer (ensayo)
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          cd /tmp/carga
          "$PSQL" "$DB_URL" -X -q -v ON_ERROR_STOP=1 -v empresa="$EMPRESA" -v modo=ensayo \
            -f "$GITHUB_WORKSPACE/scripts/conta/diez/importar.sql" | tee -a /tmp/informe.md
      - name: Paso 3 · un rechazo de verdad pone la tanda en ROJO, aun en real, y no deja nada
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -uo pipefail
          cd /tmp/carga
          # Un asiento que mueve saldo y no entra (Julio, 12/10: eso es un rechazo; lo que está todo a cero, no).
          echo '"2023","2023/4/99","1 línea con importe"' >> rechazos.csv
          if "$PSQL" "$DB_URL" -X -q -v ON_ERROR_STOP=1 -v empresa="$EMPRESA" -v modo=real \
               -f "$GITHUB_WORKSPACE/scripts/conta/diez/importar.sql" > /tmp/rojo.txt 2>&1; then
            cat /tmp/rojo.txt; echo "::error::Con un rechazo, la tanda NO salió en rojo."; exit 1
          fi
          cat /tmp/rojo.txt
          grep -q 'REAL en rojo: deshecho' /tmp/rojo.txt && grep -q 'antes 0 · después 0' /tmp/rojo.txt \
            || { echo "::error::En rojo, pero sin la prueba de que no se escribió nada."; exit 1; }
          { echo; echo "**Paso 3:** con un rechazo de verdad, en rojo y sin escribir nada (antes 0 · después 0)."; } >> /tmp/informe.md
      - name: Informe
        if: always()
        run: '[ -f /tmp/informe.md ] && cat /tmp/informe.md >> "$GITHUB_STEP_SUMMARY" || true'

  produccion:
    # W12b (30/10): el secreto vive en el entorno «produccion», que solo admite
    # ejecuciones de main (escribe en producción: con la aprobación de Julio).
    environment: produccion
    if: github.event_name == 'workflow_dispatch' && (inputs.modo == 'ensayo' || inputs.modo == 'real')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Lo escrito a mano (puede venir vacío). EMPRESA y DIEZ_DESDE/HASTA/CORTE
    # los pone el paso «Empresa y lo último usado», ya resueltos.
    env:
      IN_EMPRESA: ${{ inputs.empresa }}
      IN_DESDE: ${{ inputs.desde }}
      IN_HASTA: ${{ inputs.hasta }}
      IN_CORTE: ${{ inputs.corte }}
      SECRETO: ${{ inputs.secreto }}
      MODO: ${{ inputs.modo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmación, modo y autorización
        env:
          CONFIRMO: ${{ inputs.confirmo }}
          AUTORIZO: ${{ inputs.autorizo }}
        run: |
          set -euo pipefail
          [ "$CONFIRMO" = "produccion" ] || { echo "::error::Hay que escribir «produccion» en «confirmo». No se hace nada."; exit 1; }
          case "$MODO" in ensayo|real) ;; *) echo "::error::Modo desconocido."; exit 1 ;; esac
          # Las entradas, con su forma (van a SQL y a la línea de órdenes). Vacías
          # valen: salen de lo último usado (respuesta 3: sin más fricción que antes).
          [ -z "$IN_EMPRESA" ] || [[ "$IN_EMPRESA" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::«empresa» tiene que ser un id (uuid) o nada."; exit 1; }
          [ -z "$IN_DESDE" ] || [[ "$IN_DESDE" =~ ^[0-9]{6}$ ]] || { echo "::error::«desde» es AAAAMM o nada."; exit 1; }
          [ -z "$IN_HASTA" ] || [[ "$IN_HASTA" =~ ^[0-9]{6}$ ]] || { echo "::error::«hasta» es AAAAMM o nada."; exit 1; }
          [ -z "$IN_CORTE" ] || [[ "$IN_CORTE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::«corte» es AAAA-MM-DD o nada."; exit 1; }
          [ -z "$SECRETO" ] || [[ "$SECRETO" =~ ^[A-Z0-9_]+$ ]] || { echo "::error::«secreto» solo lleva mayúsculas, cifras y _."; exit 1; }
          echo "AUTORIZO_DADO=$AUTORIZO" > /tmp/env.txt
          cat /tmp/env.txt >> "$GITHUB_ENV"
          echo "# Diez · tanda del histórico · **$MODO**" > /tmp/informe.md
          echo "" >> /tmp/informe.md
          echo "Commit \`${GITHUB_SHA}\` · lanzado por **${GITHUB_ACTOR}** · $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M') de Madrid" >> /tmp/informe.md
          echo "" >> /tmp/informe.md
      - name: El real, solo con un ensayo en verde del mismo commit
        if: inputs.modo == 'real'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow diez-importar.yml --commit "$GITHUB_SHA" --status success --limit 50 \
                --json displayTitle --jq "[.[] | select(.displayTitle == \"Diez · histórico · ensayo · ${IN_EMPRESA}\")] | length")
          if [ "$n" -lt 1 ]; then
            echo "::error::No hay un ensayo en verde de este commit (${GITHUB_SHA}) para esta empresa. Primero el ensayo; el real, después y desde el mismo commit."
            exit 1
          fi
          echo "Hay $n ensayo(s) en verde de este commit." >> /tmp/informe.md
      - name: Guardas · el secreto apunta a PRODUCCIÓN y no a staging
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${DB_URL:-}" ] || { echo "::error::Falta PROD_CONTA_DB_URL."; exit 1; }
          python3 - <<'PY'
          import os, urllib.parse as u
          p = u.urlsplit(os.environ["DB_URL"])
          for x in (os.environ["DB_URL"], p.password, p.username, p.hostname):
              if x: print(f"::add-mask::{x}")
          PY
          case "$DB_URL" in *"$STAGING_REF"*) echo "::error::La URL apunta a STAGING. Abortado sin conectar."; exit 1 ;; esac
          case "$DB_URL" in *"$PROD_REF"*) echo "Producción." ;; *) echo "::error::La URL no es de producción."; exit 1 ;; esac
      - name: Enmascarar el secreto de Diez
        env:
          DIEZ_LECTURA: ${{ secrets[inputs.secreto != '' && format('DIEZ_LECTURA_{0}', inputs.secreto) || 'DIEZ_LECTURA'] }}
        run: |
          set -euo pipefail
          [ -n "$DIEZ_LECTURA" ] || { echo "::error::Falta el secreto DIEZ_LECTURA${SECRETO:+_$SECRETO}."; exit 1; }
          jq -r '.[] | tostring' <<<"$DIEZ_LECTURA" | while IFS= read -r v; do [ -n "$v" ] && echo "::add-mask::$v"; done
      - name: Instalar psql 17
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Empresa y lo último usado (lo que no se escribe sale de la base)
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          # Sin empresa: la única con base de Diez registrada. Si hay más de una,
          # hay que decir cuál (no se elige por nadie).
          r=$("$PSQL" "$DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -v empresa="$IN_EMPRESA" <<'SQL'
          select b.company_id, coalesce(b.ultimo_desde, ''), coalesce(b.ultimo_hasta, ''), coalesce(b.ultimo_corte::text, ''), c.legal_name
            from public.conta_diez_base b join public.company c on c.id = b.company_id
           where case when :'empresa' = '' then true else b.company_id = nullif(:'empresa', '')::uuid end;
          SQL
          )
          n=$(printf '%s\n' "$r" | grep -c . || true)
          if [ -z "$IN_EMPRESA" ] && [ "$n" != "1" ]; then echo "::error::Hay $n empresas con base de Diez registrada: escribe cuál en «empresa»."; exit 1; fi
          [ "$n" = "1" ] || { echo "::error::Esa empresa no tiene base de Diez registrada (modo «preparar», primero)."; exit 1; }
          IFS='|' read -r e d h c nombre <<<"$r"
          DESDE=${IN_DESDE:-$d}; HASTA=${IN_HASTA:-$h}; CORTE=${IN_CORTE:-$c}
          [[ "$DESDE" =~ ^[0-9]{6}$ && "$HASTA" =~ ^[0-9]{6}$ && "$CORTE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Faltan fechas y no hay nada usado antes con esta empresa: escribe desde, hasta y corte."; exit 1; }
          { echo "EMPRESA=$e"; echo "DIEZ_DESDE=$DESDE"; echo "DIEZ_HASTA=$HASTA"; echo "DIEZ_CORTE=$CORTE"; } >> "$GITHUB_ENV"
          origen() { [ -n "$1" ] && echo "escrito" || echo "lo último usado"; }
          { echo "Empresa \`$e\` · desde **$DESDE** ($(origen "$IN_DESDE")) · hasta **$HASTA** ($(origen "$IN_HASTA")) · corte **$CORTE** ($(origen "$IN_CORTE"))."; echo; } >> /tmp/informe.md
      - name: Guarda · la empresa, su base registrada, sus pasos y su ejercicio mixto de Diez hasta el corte
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          # Los pasos de antes (respuesta 3): datos, plan y banco. Si falta uno, se dice cuál.
          # (Las variables :'x' del cliente solo se sustituyen en lo que entra por la entrada, no con -c.)
          falta=$("$PSQL" "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -v empresa="$EMPRESA" <<'SQL'
          select coalesce(public.conta_diez_listo(:'empresa'::uuid) ->> 'falta', 'nada');
          SQL
          )
          case "$falta" in diez|nada) ;; *) echo "::error::Antes de traer de Diez falta un paso de la empresa: «$falta» (datos → plan → banco). Abortado sin escribir nada."; exit 1 ;; esac
          # La base NO la dice quien lanza: es la que Folvy registró para la
          # empresa (conta_diez_base). Y el ejercicio del corte, mixto de Diez.
          r=$("$PSQL" "$DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -v empresa="$EMPRESA" -v corte="$DIEZ_CORTE" <<'SQL'
          select b.nombre_bd, c.legal_name
            from public.company c
            join public.conta_diez_base b on b.company_id = c.id and b.account_id = c.account_id
            join public.fiscal_year f on f.company_id = c.id
           where c.id = :'empresa'::uuid and c.account_id <> '00000000-0000-0000-0000-000000000001'
             and b.nombre_bd <> 'C0001'
             and f.code = left(:'corte', 4) and f.origin = 'mixed' and f.origin_program = 'diez' and f.imported_until = :'corte'::date;
          SQL
          )
          [ "$(printf '%s\n' "$r" | grep -c .)" = "1" ] || { echo "::error::La empresa no tiene base de Diez registrada o su ejercicio $(echo "$DIEZ_CORTE" | cut -c1-4) no es mixto de Diez hasta el $DIEZ_CORTE. Abortado sin escribir nada."; exit 1; }
          BD=${r%%|*}
          echo "DIEZ_BD=$BD" > /tmp/env.txt
          cat /tmp/env.txt >> "$GITHUB_ENV"
          echo "Empresa con la base $BD de Diez y su ejercicio mixto hasta el $DIEZ_CORTE." >> /tmp/informe.md
      - name: El real lleva su autorizo, por empresa
        if: inputs.modo == 'real'
        run: |
          set -euo pipefail
          if [ "$DIEZ_BD" = "C0008" ]; then esperado="historico-diez"; else esperado="historico-diez-$(echo "$DIEZ_BD" | tr 'A-Z' 'a-z')"; fi
          [ "$AUTORIZO_DADO" = "$esperado" ] || { echo "::error::El real de esta empresa (base $DIEZ_BD) lleva «$esperado» en «autorizo». No se hace nada."; exit 1; }
      - name: Paso 1 · leer de Diez y preparar (solo GET)
        env:
          DIEZ_FUENTE: real
          DIEZ_LECTURA: ${{ secrets[inputs.secreto != '' && format('DIEZ_LECTURA_{0}', inputs.secreto) || 'DIEZ_LECTURA'] }}
          CARGA: /tmp/carga
        run: npx --yes tsx@4.19.2 scripts/conta/diez/importar-preparar.ts >> /tmp/informe.md
      - name: Paso 2 · escribir, medir contra el testigo y decidir (una transacción)
        timeout-minutes: 60
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          cd /tmp/carga
          # D01 R2: de un error, solo fichero, línea y código (sin el DETAIL ni la
          # línea del \copy con su JSON: el registro y el resumen son públicos).
          "$PSQL" "$DB_URL" -X -q -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate -v empresa="$EMPRESA" -v modo="$MODO" \
            -f "$GITHUB_WORKSPACE/scripts/conta/diez/importar.sql" | tee -a /tmp/informe.md
      - name: Recordar lo usado (para que la siguiente salga rellena)
        if: success()
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          "$PSQL" "$DB_URL" -X -q -A -t -v ON_ERROR_STOP=1 -v empresa="$EMPRESA" -v desde="$DIEZ_DESDE" -v hasta="$DIEZ_HASTA" -v corte="$DIEZ_CORTE" <<'SQL'
          select public.conta_diez_base_recordar(:'empresa'::uuid, :'desde', :'hasta', :'corte'::date);
          SQL
          echo "Queda como lo último usado: desde $DIEZ_DESDE, hasta $DIEZ_HASTA, corte $DIEZ_CORTE." >> /tmp/informe.md
      - name: Sumas por subcuenta, CIFRADAS (llevan importes)
        if: always()
        run: |
          set -euo pipefail
          [ -f /tmp/carga/detalle.csv ] && npx --yes tsx@4.19.2 scripts/conta/diez/cifrar.ts /tmp/carga/detalle.csv 'DETALLE CIFRADO' || echo "Sin detalle."
      - name: Informe
        if: always()
        run: '[ -f /tmp/informe.md ] && cat /tmp/informe.md >> "$GITHUB_STEP_SUMMARY" || true'

  # C06 · En staging, a mano, para cualquier empresa de staging con su base
  # registrada. Nunca escribe nada real en staging.
  staging:
    if: github.event_name == 'workflow_dispatch' && (inputs.modo == 'simulado-staging' || inputs.modo == 'lectura-staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EMPRESA: ${{ inputs.empresa }}
      DIEZ_DESDE: ${{ inputs.desde }}
      DIEZ_HASTA: ${{ inputs.hasta }}
      DIEZ_CORTE: ${{ inputs.corte }}
      MODO: ${{ inputs.modo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Entradas
        run: |
          set -euo pipefail
          [[ "$EMPRESA" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::«empresa» tiene que ser un id (uuid)."; exit 1; }
          [[ "$DIEZ_DESDE" =~ ^[0-9]{6}$ && "$DIEZ_HASTA" =~ ^[0-9]{6}$ && "$DIEZ_CORTE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Fechas: desde y hasta AAAAMM, corte AAAA-MM-DD."; exit 1; }
          echo "# Diez · $MODO · empresa \`$EMPRESA\`" > /tmp/informe.md
      - name: Guarda · el secreto apunta a STAGING
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${DB_URL:-}" ] || { echo "::error::Falta STAGING_CONTA_DB_URL."; exit 1; }
          python3 - <<'PY'
          import os, urllib.parse as u
          p = u.urlsplit(os.environ["DB_URL"])
          for x in (os.environ["DB_URL"], p.password, p.username, p.hostname):
              if x: print(f"::add-mask::{x}")
          PY
          case "$DB_URL" in *"$PROD_REF"*) echo "::error::La URL apunta a PRODUCCIÓN. Abortado sin conectar."; exit 1 ;; esac
          case "$DB_URL" in *"$STAGING_REF"*) echo "Staging." ;; *) echo "::error::La URL no es de staging."; exit 1 ;; esac
      - name: Instalar psql 17
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Guarda · staging de verdad, y la base registrada de la empresa
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          r=$("$PSQL" "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from public.accounts where id in ('51ad1792-6629-4ef7-833a-b57b09a86710','00000000-0000-0000-0000-000000000001')")
          [ "$r" = "0" ] || { echo "::error::Al otro lado hay cuentas de producción. Abortado."; exit 1; }
          BD=$("$PSQL" "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -v empresa="$EMPRESA" <<'SQL'
          select b.nombre_bd from public.conta_diez_base b join public.company c on c.id = b.company_id and c.account_id = b.account_id where b.company_id = :'empresa'::uuid;
          SQL
          )
          [ -n "$BD" ] || { echo "::error::La empresa no tiene base de Diez registrada en conta_diez_base. No se lee nada."; exit 1; }
          falta=$("$PSQL" "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -v empresa="$EMPRESA" <<'SQL'
          select coalesce(public.conta_diez_listo(:'empresa'::uuid) ->> 'falta', 'nada');
          SQL
          )
          case "$falta" in diez|nada) ;; *) echo "::error::Antes de traer de Diez falta un paso de la empresa: «$falta» (datos → plan → banco). No se lee nada."; exit 1 ;; esac
          # En staging solo se lee la copia de pruebas: lo real nunca va a staging.
          if [ "$MODO" = "lectura-staging" ] && [ "$BD" != "C0009" ]; then echo "::error::En staging solo se lee la C0009; esta empresa tiene la $BD."; exit 1; fi
          echo "DIEZ_BD=$BD" > /tmp/env.txt
          cat /tmp/env.txt >> "$GITHUB_ENV"
          echo "Base registrada para la empresa: **$BD** (conta_diez_base)." >> /tmp/informe.md
      - name: Lectura · leer la C0009 y preparar (SOLO GET; nada se escribe en staging)
        if: inputs.modo == 'lectura-staging'
        env:
          DIEZ_FUENTE: real
          DIEZ_LECTURA: ${{ secrets.DIEZ_LECTURA }}
          CARGA: /tmp/carga
        run: |
          set -euo pipefail
          [ -n "$DIEZ_LECTURA" ] || { echo "::error::Falta el secreto DIEZ_LECTURA."; exit 1; }
          jq -r '.[] | tostring' <<<"$DIEZ_LECTURA" | while IFS= read -r v; do [ -n "$v" ] && echo "::add-mask::$v"; done
          npx --yes tsx@4.19.2 scripts/conta/diez/importar-preparar.ts > /tmp/lectura.md
          cat /tmp/lectura.md >> /tmp/informe.md
          # Solo los RECUENTOS, también como aviso del run (sin claves ni motivos).
          grep -E '^(Base |- Meses leídos|- Asientos leídos|- Preparados|- Subcuentas que usan)' /tmp/lectura.md | sed 's/^/::notice::/'
          # Lo leído no sale del runner: ni a staging ni al informe (solo recuentos).
          rm -rf /tmp/carga
      - name: Simulado · leer y preparar (Diez de mentira, datos inventados)
        if: inputs.modo == 'simulado-staging'
        env:
          DIEZ_FUENTE: simulado
          CARGA: /tmp/carga
        run: npx --yes tsx@4.19.2 scripts/conta/diez/importar-preparar.ts >> /tmp/informe.md
      - name: Simulado · escribir, medir y deshacer (ensayo)
        if: inputs.modo == 'simulado-staging'
        timeout-minutes: 25
        env:
          DB_URL: ${{ secrets.STAGING_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          cd /tmp/carga
          # El error de la base, como anotación del run (regla 8: si falla, que diga por qué).
          if ! "$PSQL" "$DB_URL" -X -q -v ON_ERROR_STOP=1 -v empresa="$EMPRESA" -v modo=ensayo \
               -f "$GITHUB_WORKSPACE/scripts/conta/diez/importar.sql" > /tmp/salida.txt 2>&1; then
            cat /tmp/salida.txt >> /tmp/informe.md
            grep -E 'ERROR|error|CONTEXT' /tmp/salida.txt | head -5 | sed 's/^/::error::/'
            # Lo que explica un rojo (datos inventados: se puede enseñar).
            grep -E 'NO cuadra|rechaz|distint|Sin testigo|Subcuentas|ya estaban' /tmp/salida.txt | head -8 | sed 's/^/::warning::/'
            exit 1
          fi
          tee -a /tmp/informe.md < /tmp/salida.txt
      - name: Informe
        if: always()
        run: '[ -f /tmp/informe.md ] && cat /tmp/informe.md >> "$GITHUB_STEP_SUMMARY" || true'

  # C06 · Registrar la base de una empresa y preparar su corte, en producción.
  preparar:
    # W12b (30/10): el secreto vive en el entorno «produccion», que solo admite
    # ejecuciones de main (escribe en producción: con la aprobación de Julio).
    environment: produccion
    if: github.event_name == 'workflow_dispatch' && inputs.modo == 'preparar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EMPRESA: ${{ inputs.empresa }}
      BASE: ${{ inputs.base }}
      MOTIVO: ${{ inputs.motivo }}
      DIEZ_CORTE: ${{ inputs.corte }}
    steps:
      - name: Confirmación, entradas y autorización
        env:
          CONFIRMO: ${{ inputs.confirmo }}
          AUTORIZO: ${{ inputs.autorizo }}
        run: |
          set -euo pipefail
          [ "$CONFIRMO" = "produccion" ] || { echo "::error::Hay que escribir «produccion» en «confirmo». No se hace nada."; exit 1; }
          [[ "$EMPRESA" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::«empresa» tiene que ser un id (uuid)."; exit 1; }
          BASE=$(echo "$BASE" | tr 'a-z' 'A-Z' | tr -d '[:space:]')
          [[ "$BASE" =~ ^C[0-9]{4}$ ]] || { echo "::error::«base» es C y cuatro cifras."; exit 1; }
          [ "$BASE" != "C0001" ] || { echo "::error::La base C0001 no se toca nunca."; exit 1; }
          [[ "$DIEZ_CORTE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::«corte» es AAAA-MM-DD."; exit 1; }
          [ -n "$(echo "$MOTIVO" | tr -d '[:space:]')" ] || { echo "::error::Hace falta el motivo."; exit 1; }
          esperado="preparar-diez-$(echo "$BASE" | tr 'A-Z' 'a-z')"
          [ "$AUTORIZO" = "$esperado" ] || { echo "::error::Preparar esta empresa (base $BASE) lleva «$esperado» en «autorizo». No se hace nada."; exit 1; }
          echo "BASE=$BASE" > /tmp/env.txt
          cat /tmp/env.txt >> "$GITHUB_ENV"
      - name: Guardas · el secreto apunta a PRODUCCIÓN y no a staging
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${DB_URL:-}" ] || { echo "::error::Falta PROD_CONTA_DB_URL."; exit 1; }
          python3 - <<'PY'
          import os, urllib.parse as u
          p = u.urlsplit(os.environ["DB_URL"])
          for x in (os.environ["DB_URL"], p.password, p.username, p.hostname):
              if x: print(f"::add-mask::{x}")
          PY
          case "$DB_URL" in *"$STAGING_REF"*) echo "::error::La URL apunta a STAGING. Abortado sin conectar."; exit 1 ;; esac
          case "$DB_URL" in *"$PROD_REF"*) echo "Producción." ;; *) echo "::error::La URL no es de producción."; exit 1 ;; esac
      - name: Instalar psql 17
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Registrar la base y preparar el corte (una transacción)
        timeout-minutes: 15
        env:
          DB_URL: ${{ secrets.PROD_CONTA_DB_URL }}
        run: |
          set -euo pipefail
          POR="Folvy · ${GITHUB_ACTOR} · run ${GITHUB_RUN_ID}"
          if ! "$PSQL" "$DB_URL" -X -A -t -1 -v ON_ERROR_STOP=1 -v empresa="$EMPRESA" -v base="$BASE" -v motivo="$MOTIVO" -v corte="$DIEZ_CORTE" -v por="$POR" > /tmp/salida.txt 2>&1 <<'SQL'
          select 'base: ' || public.conta_diez_base_poner(:'empresa'::uuid, :'base', :'motivo', :'por')::text;
          select 'corte: ' || public.conta_diez_preparar_corte(:'empresa'::uuid, :'corte'::date, :'por')::text;
          SQL
          then
            grep -E 'ERROR' /tmp/salida.txt | head -3 | sed 's/^/::error::/'
            echo "No se ha escrito nada (todo iba en una transacción)."; exit 1
          fi
          echo "# Diez · preparar la empresa: base registrada y corte preparado (una transacción)" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/salida.txt | node scripts/conta/salida-segura.mjs >> "$GITHUB_STEP_SUMMARY"
