<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ficha de proveedor en el móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E3A5F}a:hover{color:#142a45}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F4F0; font-family: Inter, system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

<div style="background: #1E3A5F; color: #FFFFFF; padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="#" aria-label="Volver a proveedores" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #FFFFFF; background: rgba(255,255,255,0.12)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<span style="font-size: 13px; color: #C9D3DF">Ficha al 80 %</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 600">Hermanos Ruiz</h1>
<span style="font-size: 14px; color: #C9D3DF">B12345678 · NIF comprobado</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 12px; background: #FFFFFF; color: #1E3A5F; font-weight: 600; font-size: 15px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>Llamar</a>
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 12px; background: #D67542; color: #1B1F24; font-weight: 700; font-size: 15px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>Foto factura</a>
</div>
</div>

<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: #FFFFFF; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #A2501F; font-weight: 600">Le debes</span><span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600">1.283,15 €</span><span style="font-size: 12px; color: #5A6470">vence el 24 oct</span></div>
<div style="background: #FFFFFF; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5A6470; font-weight: 600">Este año</span><span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600">18.420 €</span><span style="font-size: 12px; color: #5A6470">23 facturas</span></div>
</div>

<div style="background: #FFFFFF; border-radius: 14px; display: flex; flex-direction: column">
<sc-for list="{{filas}}" as="r" hint-placeholder-count="6">
<a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 16px; border-bottom: 1px solid #F1EFEA; text-decoration: none; color: #1B1F24">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{r.nombre}}</span><span style="font-size: 13px; color: {{r.colorDetalle}}">{{r.detalle}}</span></div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A94A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</a>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const ok = '#5A6470', falta = '#A2501F';
return {
filas: [
{ nombre: 'Datos fiscales', detalle: 'General · 10 % y 21 %', colorDetalle: ok },
{ nombre: 'Contactos', detalle: 'Falta el de administración', colorDetalle: falta },
{ nombre: 'Pago', detalle: 'Transferencia a 30 días', colorDetalle: ok },
{ nombre: 'Contabilidad', detalle: 'Comida y bebida · 600', colorDetalle: ok },
{ nombre: 'Documentos', detalle: 'Falta el certificado del banco', colorDetalle: falta },
{ nombre: 'Facturas', detalle: 'Última: 24/09 · 1.283,15 €', colorDetalle: ok }
]
};
}
}
</script>
</body>
</html>
