<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visitas de los dosieres</title><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--tinta:#172443;--apoyo:#4A5B73;--fondo:#F4F7FB;--linea:#DCE5F0;--azul:#1E63C9;--turq:#00D1B2;--folvy:#1F9D6B;--sumied:#1E63C9}
*{box-sizing:border-box}body{margin:0;background:var(--fondo);color:var(--tinta);font:15px/1.5 Inter,system-ui,sans-serif;padding:28px 16px}
main{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}h2{font-size:17px;margin:0 0 10px}
.caja{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px 16px}.kpi b{display:block;font-size:28px;letter-spacing:-.02em}.kpi span{font-size:13px;color:var(--apoyo)}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.filtros{display:flex;gap:8px;flex-wrap:wrap}.filtros button{font:inherit;font-size:14px;border:1px solid var(--linea);background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer}.filtros button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.tabla{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.8px;min-width:760px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--apoyo);padding:0 12px 8px 0;border-bottom:2px solid var(--tinta);white-space:nowrap}
td{padding:8px 12px 8px 0;border-bottom:1px solid var(--linea);vertical-align:top}
.p{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 9px;color:#fff}.p.folvy{background:var(--folvy)}.p.sumied{background:var(--sumied)}
.barra{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13.5px;margin:5px 0}.barra i{display:block;height:8px;border-radius:4px;background:var(--turq);margin-top:3px}
form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{font:inherit;border:1px solid #7F8FA6;border-radius:10px;padding:10px 12px;min-width:260px}
button.ok{font:inherit;font-weight:600;background:var(--azul);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
.aviso{color:#8A4B00;font-size:14px}.apoyo{color:var(--apoyo);font-size:13px}
@media (max-width:720px){.kpis,.dos{grid-template-columns:repeat(2,minmax(0,1fr))}.dos{grid-template-columns:minmax(0,1fr)}}
</style></head><body><main>
<h1>Visitas de los dosieres</h1>
<section class="caja" id="entrar"><form id="f"><input id="k" type="password" placeholder="Clave del panel" autocomplete="current-password"><button class="ok">Entrar</button><span class="aviso" id="err"></span></form></section>
<div id="datos" hidden>
<div class="filtros" id="filtros"><button data-f="todos" class="on">Los dos</button><button data-f="folvy">Folvy</button><button data-f="sumied">Sumied</button></div>
<div class="kpis" style="margin-top:14px"><div class="kpi"><b id="kv">–</b><span>visitas</span></div><div class="kpi"><b id="kd">–</b><span>dispositivos distintos</span></div><div class="kpi"><b id="ks">–</b><span>tiempo medio de lectura</span></div><div class="kpi"><b id="kp">–</b><span>descargas en PDF</span></div></div>
<p class="apoyo" id="nota" style="margin:8px 2px 0"></p>
<div class="dos" style="margin-top:14px"><section class="caja"><h2>Hojas más vistas</h2><div id="secc"></div></section><section class="caja"><h2>Por enlace</h2><div id="enl"></div></section></div>
<section class="caja" style="margin-top:14px"><h2>Últimas visitas</h2><div class="tabla"><table><thead><tr><th>Cuándo</th><th>Dosier</th><th>Enlace</th><th>Lugar</th><th>Dispositivo</th><th>Tiempo</th><th>Leído</th><th>PDF</th><th>Llegó desde</th></tr></thead><tbody id="ult"></tbody></table></div></section>
</div>
</main>
<script>
var EP="https://xzmpnchlguibclvxyynt.supabase.co/functions/v1/dosier-track?panel=1",D=null,F="todos";
function dosierDe(et){return et&&/^Sumied/.test(et)?"sumied":"folvy"}
function enlaceDe(et){if(!et)return"sin etiqueta";return et.replace(/^Sumied( · )?/,"")||"sin etiqueta"}
function tiempo(s){s=s||0;return s<60?s+" s":Math.floor(s/60)+" min "+(s%60)+" s"}
function cuando(c){return new Date(c).toLocaleString("es-ES",{timeZone:"Europe/Madrid",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pintar(){
 var u=D.ultimas.filter(function(f){return F=="todos"||dosierDe(f.etiqueta)==F});
 if(F=="todos"){document.getElementById("kv").textContent=D.visitas;document.getElementById("kd").textContent=D.dispositivos;document.getElementById("ks").textContent=tiempo(D.segundos_media);document.getElementById("kp").textContent=D.pdf;document.getElementById("nota").textContent="Totales de los dos dosieres desde el principio."}
 else{var l=u.filter(function(f){return f.segundos>5});document.getElementById("kv").textContent=u.length;document.getElementById("kd").textContent="–";document.getElementById("ks").textContent=tiempo(l.length?Math.round(l.reduce(function(a,f){return a+f.segundos},0)/l.length):0);document.getElementById("kp").textContent=u.filter(function(f){return f.pdf}).length;document.getElementById("nota").textContent="Contado sobre las 100 visitas más recientes de los dos dosieres."}
 var sc=D.secciones.filter(function(s){var su=/^Sumied: /.test(s.titulo);return F=="todos"||(F=="sumied")==su});var mx=sc.length?sc[0].n:1;
 document.getElementById("secc").innerHTML=sc.slice(0,24).map(function(s){return'<div class="barra"><span>'+esc(s.titulo.replace(/^Sumied: /,F=="todos"?"Sumied · ":""))+'<i style="width:'+Math.round(100*s.n/mx)+'%"></i></span><b>'+s.n+'</b></div>'}).join("")||'<p class="apoyo">Todavía nada.</p>';
 var en={};u.forEach(function(f){var k=(F=="todos"?(dosierDe(f.etiqueta)=="sumied"?"Sumied · ":"Folvy · "):"")+enlaceDe(f.etiqueta);en[k]=(en[k]||0)+1});var ek=Object.keys(en).sort(function(a,b){return en[b]-en[a]});var me=ek.length?en[ek[0]]:1;
 document.getElementById("enl").innerHTML=ek.map(function(k){return'<div class="barra"><span>'+esc(k)+'<i style="width:'+Math.round(100*en[k]/me)+'%"></i></span><b>'+en[k]+'</b></div>'}).join("")||'<p class="apoyo">Todavía nada.</p>';
 document.getElementById("ult").innerHTML=u.map(function(f){var d=dosierDe(f.etiqueta);var lugar=[f.ciudad,f.pais&&f.pais!="ES"?f.pais:null,f.red].filter(Boolean).join(" · ");return"<tr><td>"+cuando(f.cuando)+(f.nuevo?' <b title="Dispositivo nuevo">•</b>':"")+'</td><td><span class="p '+d+'">'+(d=="sumied"?"Sumied":"Folvy")+"</span></td><td>"+esc(enlaceDe(f.etiqueta))+"</td><td>"+esc(lugar||"—")+"</td><td>"+esc(f.dispositivo)+"</td><td>"+tiempo(f.segundos)+"</td><td>"+(f.scroll||0)+" %</td><td>"+(f.pdf?"Sí":"")+"</td><td>"+esc(f.origen)+"</td></tr>"}).join("");
}
function cargar(k){document.getElementById("err").textContent="Cargando…";fetch(EP,{headers:{"x-panel-key":k},cache:"no-store"}).then(function(r){if(r.status==401)throw new Error("clave");if(!r.ok)throw new Error("fallo");return r.json()}).then(function(j){D=j;try{sessionStorage.setItem("k",k)}catch(e){}document.getElementById("entrar").hidden=true;document.getElementById("datos").hidden=false;pintar()}).catch(function(e){document.getElementById("err").textContent=e.message=="clave"?"La clave no es correcta.":"No se han podido leer las visitas. Prueba otra vez en un momento."})}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();cargar(document.getElementById("k").value.trim())});
document.getElementById("filtros").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;F=b.dataset.f;[].forEach.call(this.children,function(x){x.classList.toggle("on",x==b)});pintar()});
try{var g=sessionStorage.getItem("k");if(g)cargar(g)}catch(e){}
</script></body></html>
